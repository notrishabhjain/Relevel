# Cloudflare Worker: serves the app and its account API.
#
# One-time setup (all free tier):
#   npx wrangler login
#   npx wrangler d1 create aifz              # paste database_id below
#   npx wrangler d1 execute aifz --remote --file worker/schema.sql
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   node build.js && npx wrangler deploy
name = "ai-from-zero"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# The built site is served straight from the edge; the Worker only runs for /api/*.
[assets]
directory = "dist/site"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# Restrict sign-in to your own GitHub account. Leave empty to allow any GitHub user.
ALLOWED_LOGINS = "notrishabhjain"

[[d1_databases]]
binding = "DB"
database_name = "aifz"
database_id = "local-dev-placeholder"
