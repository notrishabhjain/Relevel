{
  id:'ch10', num:10, part:2, minutes:20, labs:['contextrot','cache'],
  title:'The size limit got enormous. Almost nothing changed.',
  concept:'A vendor will tell you a huge context window makes retrieval unnecessary. Here are the two reasons that is wrong.',
  needs:[
    ['There is a size limit on one request','It is the size of one delivery, not memory.',1],
    ['Cutting documents up exists because of that limit','And because you pay for everything you send.',3],
  ],
  takeaway:[
    'Give two independent reasons a huge context window does not remove the need for retrieval.',
    'Explain why a document fitting in the request is no evidence the model will use it.',
    'Say what a token budget is, and which line you would cut first if the bill doubled.'
  ],
  story:[
    ['p','Chapter 1 gave you a ceiling on how much fits in one request, and Chapter 3 built a whole discipline around it. Then the ceilings got enormous — hundreds of thousands of pieces of text, sometimes millions. The obvious conclusion is that the discipline is now unnecessary: just send everything.'],
    ['pred',{id:'ch10-window',rows:3,ph:'True or not, and what you would ask',
      ask:'A vendor tells you their huge context window makes your retrieval layer unnecessary — put the whole document set in every request. Before reading on: is that true, and what would you ask to find out?',
      reveal:'No, for two independent reasons, and you should insist on both. The bill did not change: sending a million pieces of text costs a million pieces of text on every single query, forever. And capacity is not attention — the model’s ability to actually use what is in the request degrades long before the request is full, particularly in the middle of it.',
      then:'The question that settles it in a meeting: <em>show me your accuracy on a fact placed halfway through a full window, against the same fact retrieved into a short one.</em>'}],

    ['p','<strong>Reason one: the meter did not move.</strong> This one is arithmetic, and people skip it because it is boring. A large request costs what a large request costs, on every query, from every user, forever. Retrieval is not a workaround for a size limit. It is the thing that keeps the bill finite.'],
    ['q','I007'],

    ['p','<strong>Reason two, which surprises people:</strong> a model’s ability to use what you sent falls off well before the ceiling. Put a fact near the start and it is found reliably. Put the same fact in the middle of a long request and it is missed far more often. Nothing errors. The answer is just wrong.'],
    ['lab','contextrot'],
    ['q','I008'],
    ['key','Capacity is not attention. That a document fits is no evidence at all that the model will use it. These are two different claims, and vendors quote the first while you need the second.'],
    ['q','I119'],

    ['p','This reframes the job. It is not about the wording of your instructions — that is prompt engineering, and it matters less than people think. It is about deciding what goes into the request at all, and what gets left out. That decision has a name now, <strong>context engineering</strong>, and it is mostly a product job.'],
    ['q','I069'],
    ['try',{id:'ch10-budget',mins:5,min:50,rows:5,
      task:'Budget one. A feature of yours sends: a standing instruction, function descriptions, retrieved pieces of documents, the conversation so far, and the answer. Put a rough size on each, total it, then say which line you would cut first if the bill doubled — and what breaks when you do.',
      ph:'instruction … functions … retrieved … history … answer … total … cut first: … which breaks …',
      after:'A strong answer treats the request as a budget with an owner rather than whatever happened to accumulate. Retrieved documents are usually the biggest line and the most compressible — fetch fewer, or add a re-ranking pass so fewer pieces carry better content. What breaks is answers to questions that span several places, so you re-measure against your answer key rather than assuming. History is next and breaks follow-up questions; function descriptions remove capability outright. The mark of someone who has done this is naming what the cut endangers, and then measuring it.'}],

    ['p','Two more instruments belong here. <strong>Caching</strong>: providers can remember the processed form of the beginning of your request, so if that part is identical each time it is much cheaper and faster. The architectural instruction that falls out is simple — put the stable things first and the changing things last.'],
    ['lab','cache'],
    ['q','I070','I071'],
    ['p','<strong>Compaction</strong>: when a long conversation outgrows its budget, summarise the middle and keep the ends. It works, and it reliably destroys exactly one kind of information — specific details in the middle that nobody thought to keep.'],
    ['q','I072'],
    ['p','And the thing this chapter finally lets you say precisely: when someone says their assistant “remembers” a user, ask where that memory physically lives. It is a store you built, re-sent on every message, and paid for every time.'],
    ['q','I120','I121']
  ],
  handson:[
    {h:'Step 1 — Predict First', b:[
      ['p','You are about to hide one sentence inside a long context and ask the model to find it, at three depths. Before running anything, predict the recovery rate at each depth: start, middle, end. Write three percentages.'],
      ['x','Log all three in the Prediction Ledger. Almost everyone predicts 100/100/100.']
    ]},
    {h:'Step 2 — The Needle, at Three Depths', b:[
      ['code','NEEDLE = "The internal reference code for the Q3 audit exception is ZX-4417."\nQUESTION = "What is the internal reference code for the Q3 audit exception?"\n\n# filler: paste ~8-12k words of your own corpus text into `filler`\nwords = filler.split()\n\ndef haystack(depth_pct):\n    cut = int(len(words) * depth_pct)\n    return " ".join(words[:cut]) + " " + NEEDLE + " " + " ".join(words[cut:])\n\nfor depth in (0.05, 0.50, 0.95):\n    hits = 0\n    for trial in range(5):\n        r = client.chat.completions.create(\n            model="meta/llama-3.1-8b-instruct", temperature=0,\n            messages=[{"role":"system","content":"Answer only from the text provided."},\n                      {"role":"user","content":haystack(depth) + "\\n\\nQ: " + QUESTION}]\n        )\n        if "ZX-4417" in r.choices[0].message.content:\n            hits += 1\n    print(f"depth {int(depth*100):>2}% -> {hits}/5 recovered")'],
      ['x','Commonly 5/5 at 5%, 5/5 at 95%, and something lower — often 2/5 or 3/5 — at 50%. Your exact numbers are your finding. If you get 5/5 everywhere, lengthen the filler until you do not; the effect is a function of length, and finding <em>your</em> breaking length is the actual deliverable.'],
      ['c','What you just proved','Not that the model is bad — that “it fits” and “it works” are different claims, and only one of them is measurable by reading a spec sheet.']
    ]},
    {h:'Step 3 — Everything vs. Retrieval, Head to Head', b:[
      ['p','Take your Chapter 6 ground truth. Answer all ten questions two ways: (a) whole document stuffed into the envelope, (b) your Chapter 7 <code>rag_answer</code> at k=3. Record accuracy, tokens, and wall-clock for both.'],
      ['code','import time\nfor q in ground_truth_questions:\n    t0 = time.time(); a = stuff_answer(q); t1 = time.time()\n    t2 = time.time(); b = rag_answer(q, k=3); t3 = time.time()\n    print(f"{q[:40]:40s} | stuff {t1-t0:.1f}s | rag {t3-t2:.1f}s")'],
      ['x','Typically: comparable accuracy on easy questions, an accuracy edge for stuffing on questions needing several distant sections, and a 10–50× difference in tokens and a large gap in latency. Write the sentence your own numbers support. It will be more nuanced than either camp\'s slogan.']
    ]},
    {h:'Step 4 — Reorder for the Cache', b:[
      ['p','Build the same request twice — once with the stable material (system prompt, reference text) first and the question last; once with the question first. Send each 5 times and compare latency and any cache fields in the response.'],
      ['x','Stable-first shows lower latency from the second call onward where the provider supports caching. Even where you cannot observe a cache field, adopt the ordering: it costs nothing and it is the shape every caching implementation rewards.']
    ]},
    {h:'Step 5 — Compaction, and What It Costs', b:[
      ['p','Take a 20-turn conversation. Summarise turns 1–15 into 150 words, keep 16–20 verbatim, and re-ask three questions whose answers lived in the summarised region.'],
      ['x','Thematic questions survive compaction. Questions about specific figures, names, or dates usually do not. Write down which of your three broke — that is the compaction trade-off in your own handwriting.']
    ]}
  ],
},
{
  id:'ch11', num:11, part:2, minutes:20, labs:['reasoning'],
  title:'Paying it to think first',
  concept:'Some models work through a problem before answering. You pay for that thinking, per question, and it is worth it about half the time.',
  needs:[
    ['You pay for text in and text out','Thinking is text, so thinking has a price.',1],
    ['The request is a budget with lines in it','Thinking adds a line.',10],
  ],
  takeaway:[
    'Say what you are actually buying when you turn thinking on.',
    'Name two tasks where it pays and two where it is pure waste.',
    'Explain why pointing a thinking model at bad evidence makes things worse, not better.'
  ],
  story:[
    ['p','For most of this course, the machine answered immediately. A newer kind does something else first: it writes out a chain of working — trying an approach, checking it, backing up — and only then gives you an answer. You do not see the working. You are billed for it.'],
    ['p','The formal name for what you are buying is <strong>test-time compute</strong>, which is jargon for a simple idea: instead of accuracy being fixed when the model was built, you can buy more of it per question by letting it work longer.'],
    ['q','I073'],
    ['key','Thinking is not a quality setting you turn up. It is a purchase, made on every single question, in money and in waiting time. And for a great many tasks you are buying nothing at all.'],
    ['lab','reasoning'],
    ['pred',{id:'ch11-where',rows:3,ph:'Two that gain, two that do not',
      ask:'From your own product: name two tasks that would genuinely get better with thinking, and two that would get slower and more expensive with no gain whatsoever.',
      reveal:'It pays on multi-step logic, arithmetic where each stage depends on the last, code, planning, and genuine ambiguity that needs resolving. It wastes on looking things up, pulling fields out of a document, sorting things into categories, formatting, routing, and summarising a passage you handed it.',
      then:'The pattern: thinking helps when the answer has to be worked out. It does nothing when the answer is already present and just needs finding or reshaping.'}],
    ['q','I074'],

    ['p','Three traps, worth naming before you meet them.'],
    ['l',[
      '<strong>Thinking does not manufacture evidence.</strong> Point a thinking model at bad retrieval and it will reason beautifully, at length, from the wrong document — and produce a more convincing wrong answer than the cheap model would have. You have paid extra to be misled more persuasively.',
      '<strong>The waiting is a product problem.</strong> Thinking takes seconds, sometimes tens of seconds. On a chat surface that is often fatal regardless of how good the answer is.',
      '<strong>It is not all-or-nothing.</strong> Most providers give you a dial. Treat it as a routing decision per kind of request, not a setting you turn on for the whole product.'
    ]],
    ['q','I075','I076'],
    ['try',{id:'ch11-route',mins:4,min:45,rows:4,
      task:'Write the rule. For one feature you own: which requests get thinking, which do not, and what measurement would tell you the rule is wrong?',
      ph:'Thinking when … not when … I would know I was wrong if …',
      after:'A strong rule routes on something you can detect <em>before</em> answering — the kind of question, how many things it mentions, whether arithmetic is involved, whether retrieval came back with conflicting pieces — rather than on a guess about difficulty. And it names what would falsify it: accuracy on the no-thinking group falling below the thinking group on the same questions, or waiting time on the thinking group exceeding what the screen can absorb. A rule with no falsifying measurement is a preference wearing a rule’s clothes.'}],
    ['q','I077']
  ],
  handson:[
    {h:'Step 1 — Two Tasks, Two Settings, Four Cells', b:[
      ['p','New notebook <code>chapter-11</code>. Pick a reasoning-capable model from build.nvidia.com. Build two tasks from your own domain: one pure lookup, one genuinely multi-step (an eligibility calculation with conditions, a reconciliation across three figures).'],
      ['code','import time\n\ndef timed(model, prompt, **kw):\n    t0 = time.time()\n    r = client.chat.completions.create(\n        model=model, temperature=0,\n        messages=[{"role":"user","content":prompt}], **kw)\n    dt = time.time() - t0\n    u = r.usage\n    return {"answer": r.choices[0].message.content,\n            "in": u.prompt_tokens, "out": u.completion_tokens,\n            "secs": round(dt,1)}\n\nfor name, prompt in [("lookup", LOOKUP_TASK), ("multistep", MULTISTEP_TASK)]:\n    fast = timed(FAST_MODEL, prompt)\n    slow = timed(REASONING_MODEL, prompt)\n    print(f"{name:10s} fast: {fast[\'out\']:>5} out / {fast[\'secs\']:>5}s"\n          f"  reasoning: {slow[\'out\']:>5} out / {slow[\'secs\']:>5}s")'],
      ['x','On the lookup: near-identical answers, with the reasoning model spending several times the output tokens and seconds. On the multi-step: often a correctness difference, sometimes decisive. That asymmetry is the whole chapter, in one printout.'],
      ['c','Predict first','Before running: how many times more output tokens will the reasoning model spend on the <em>lookup</em>? Write the multiple down. Most people say 2×. Log it.']
    ]},
    {h:'Step 2 — Build the 2×2 On Your Own Traffic', b:[
      ['p','Take ten real requests your feature would receive. Classify each as reasoning-worthy or not, <em>before</em> testing. Then run both models on all ten and grade.'],
      ['tb',['','Fast model correct','Fast model wrong'],[
        ['Reasoning correct','Waste — you paid for nothing','<strong>The only cell that justifies the spend</strong>'],
        ['Reasoning wrong','Reasoning hurt — investigate','Neither works — it is a retrieval or data problem, not a thinking problem']
      ]],
      ['x','Count how many of your ten land in the top-right cell. In most document-AI workloads it is one or two. That fraction is the number you take to a pricing conversation.']
    ]},
    {h:'Step 3 — Reasoning Cannot Save Bad Retrieval', b:[
      ['p','Take your Chapter 7 pipeline. Force k=1 and pick a question you know retrieves the <em>wrong</em> chunk. Answer it with the fast model, then the reasoning model.'],
      ['x','Both are wrong. The reasoning model is wrong at greater length, with more apparent justification, and is therefore more likely to be believed by a reviewer. Write one sentence about what that means for review processes.']
    ]},
    {h:'Step 4 — Find the Latency Cliff', b:[
      ['p','Run your multi-step task 10 times at the reasoning setting and record every response time. Sort them. Read off the median and the slowest.'],
      ['x','The gap between median and slowest is usually large — often 2–3×. <strong>Users experience the slow tail, not the median.</strong> Note both numbers; you will need the slow one for Chapter 15 and for any SLA conversation.']
    ]},
    {h:'Step 5 — Overthink a Trivial Task', b:[
      ['p','Give the reasoning model something trivial: <em>“Classify this sentence as complaint, query, or compliment.”</em> Run it five times at maximum effort.'],
      ['x','Long working-out, occasionally a worse answer than the fast model — second-guessing an obvious classification into an exotic one. Overthinking is real, measurable, and you just measured it.']
    ]}
  ],
},
{
  id:'ch12', num:12, part:2, minutes:20, labs:['fusion'],
  title:'Making retrieval actually good',
  concept:'Everything you deliberately parked since Chapter 3, collected. Four techniques, and the dull one beats the clever ones.',
  needs:[
    ['Word matching and meaning matching each fail differently','One is blind to meaning, the other blind to exact strings.',5],
    ['Fetch more and you find more junk','The trade-off you cannot escape, only choose.',6],
  ],
  takeaway:[
    'Explain how to use word matching and meaning matching together instead of choosing.',
    'Say which single technique improves quality and cost at the same time.',
    'Name the failure that no amount of clever retrieval can fix, and the boring thing that does.'
  ],
  story:[
    ['p','Since Chapter 3 you have been writing techniques on a list and walking past them. Here they are. Four things, in rough order of how much they help.'],

    ['p','<strong>Hybrid search</strong> fixes the injury from Chapter 4. Word matching was excellent at exact strings and hopeless at meaning; meaning matching was the reverse. So run both and combine the two rankings. You stop choosing.'],
    ['lab','fusion'],
    ['q','I033'],

    ['p','<strong>Re-ranking</strong> is the closest thing to a free lunch in this course. Fetch fifty pieces cheaply by position, then have a second, slower model actually read the question and each piece together and re-score them, and keep the best five.'],
    ['pred',{id:'ch12-rerank',short:true,ph:'How much does it move?',
      ask:'Before the chapter claims anything: you add that second pass to a working system. How much does quality move?',
      reveal:'Usually a large, immediate jump — and unusually, both halves improve at once. You find more, because you fetched fifty instead of five. And less junk survives, because the second pass actually read them.',
      then:'The cost is waiting time and a second model call on a shortlist. Which is exactly why it runs on fifty pieces and not on your whole document set — that constraint is the entire design.'}],
    ['q','I034','I036'],

    ['p','<strong>Contextual retrieval</strong> fixes the orphan you counted in Chapter 3 — the piece beginning “the aforesaid amount”, meaningless on its own. Before storing each piece, have a model write one sentence situating it, and store that with it. The piece now says what it is about.'],
    ['q','I035'],

    ['c','And the dull one that beats all of them','<strong>Filtering on labels.</strong> Before any scoring happens, throw away pieces that cannot possibly be right — the wrong version of a policy, a document this user may not read, something that expired last year. No amount of clever ranking prevents a repealed 2024 policy from outranking the current one, because relevance and correctness are different questions. Filtering is the only guarantee in this chapter; everything else is a probability.'],
    ['q','I037','I123'],
    ['try',{id:'ch12-meta',mins:5,min:50,rows:4,
      task:'Before a single document is stored: list the labels you would require on every piece, and beside each one write the specific failure it prevents. Only include a label you can name a failure for.',
      ph:'label — the failure it prevents',
      after:'The strong list is short and every line is justified by a failure nothing else can fix. Document identity and version, because a better ranker cannot stop last year’s policy winning. Effective and expiry dates, for the same reason in time. Who is allowed to see it, because filtering is the only thing standing between a user and a document they may not read — ranking will happily hand it over. Where it came from and when, so you can retire a source you no longer trust. The point is that filtering happens <em>before</em> scoring, which makes these the only failures you can make impossible rather than unlikely.'}],
    ['q','I039'],
    ['p','One more, which is Chapter 9 pointed at Chapter 5: let the model run several searches itself, read what comes back, and refine. Powerful, and it multiplies the bill exactly as Chapter 9 said it would.'],
    ['q','I105']
  ],
  handson:[

    ['p','A feature quoted at ₹0.40 per query using the base formula, with k=8, a 12% retry rate, a 4-step agent, and reasoning on by default, does not cost ₹0.50. It costs several rupees. That gap is the difference between a viable feature and one quietly killed in month four.'],
    ['q','I100'],
    ['p','<strong>The five levers</strong> that move the number, roughly in order of how much they move it:'],
    ['l',['<strong>Model choice.</strong> Rates across a provider\'s catalogue vary by one to two orders of magnitude. This dwarfs every other lever, which is why it deserves the measurement in Chapter 11 rather than a preference.','<strong>Routing and cascades.</strong> Send everything to a cheap model first; escalate only what fails a check. If 80% of traffic is a lookup (and Chapter 11 told you it is), you are paying premium rates for work a small model does correctly.','<strong>k and context size.</strong> Every token you do not send is free forever. Chapter 12\'s reranker lets you cut k while <em>raising</em> quality — the rare lever that improves both sides.','<strong>Caching.</strong> Chapter 10\'s stable-first ordering. Free money, requiring only that you order the envelope correctly.','<strong>Batching.</strong> Where latency permits, batch endpoints are often materially cheaper. Overnight enrichment does not need an interactive price.']],

  handson:[
    {h:'Step 1 — Measure, Don\'t Estimate', b:[
      ['p','New notebook <code>chapter-15</code>. Run your Chapter 12 pipeline over the ten ground-truth questions and record real token counts.'],
      ['code','rows = []\nfor q in ground_truth_questions:\n    r = rag_answer_instrumented(q, k=3)   # returns .usage alongside the answer\n    rows.append({"q": q, "in": r.usage.prompt_tokens,\n                 "out": r.usage.completion_tokens})\n\navg_in  = sum(r["in"]  for r in rows) / len(rows)\navg_out = sum(r["out"] for r in rows) / len(rows)\nprint(f"avg in {avg_in:.0f} / avg out {avg_out:.0f} tokens per query")'],
      ['x','Real numbers from your real corpus. Everything after this is arithmetic on measured input rather than a guess dressed as a forecast.']
    ]},
    {h:'Step 2 — Build the Bill, With the Multipliers', b:[
      ['code','def monthly_cost(avg_in, avg_out, queries,\n                 in_rate, out_rate,           # per 1M tokens\n                 retry_rate=0.0, agent_steps=1,\n                 reasoning_ratio=0.0, cache_hit=0.0):\n    eff_in  = avg_in * agent_steps * (1 - cache_hit * 0.9)\n    eff_out = avg_out * agent_steps * (1 + reasoning_ratio)\n    per_q = (eff_in/1e6)*in_rate + (eff_out/1e6)*out_rate\n    per_q *= (1 + retry_rate)\n    return per_q, per_q * queries\n\nbase = monthly_cost(avg_in, avg_out, 10_000, 0.20, 0.60)\nreal = monthly_cost(avg_in, avg_out, 10_000, 0.20, 0.60,\n                    retry_rate=0.10, agent_steps=4,\n                    reasoning_ratio=2.0, cache_hit=0.0)\nprint(f"naive: {base[1]:.2f}   with multipliers: {real[1]:.2f}   ratio {real[1]/base[1]:.1f}x")'],
      ['x','A ratio commonly between 8× and 20×. Write it down. That single number is the most useful thing you can carry into a budget conversation, and it is why “we estimated the token cost” is not the same as “we estimated the cost.”'],
      ['c','Predict first','Before running Step 2: what multiple will the loaded cost be over the naive one? Log your guess.']
    ]},
    {h:'Step 3 — Build the Cascade', b:[
      ['p','Route cheaply first, escalate on a failed check. Use your Chapter 8 structured output — <code>found: false</code> or a missing quote — as the escalation trigger.'],
      ['code','def cascade(question, k=3):\n    small = rag_answer(question, k=k, model=CHEAP_MODEL)\n    if small["found"] and programmatic_checks(small, small["source_chunk_ids"]) == []:\n        return small, "cheap"\n    return rag_answer(question, k=k, model=STRONG_MODEL), "escalated"\n\nesc = sum(1 for q in ground_truth_questions if cascade(q)[1] == "escalated")\nprint(f"escalation rate: {esc}/{len(ground_truth_questions)}")'],
      ['x','An escalation rate — commonly 20–40%. Compute the blended cost and re-grade accuracy against your Chapter 6 key. You now have both halves of the trade: what the cascade saved, and what (if anything) it cost in quality.']
    ]},
    {h:'Step 4 — The Three Numbers', b:[
      ['p','For each configuration you have built — naive, k=8, cascade, reasoning-on — record exactly three numbers.'],
      ['tb',['Configuration','Cost / query','p50','p95','Accuracy (of 9)'],[['Baseline k=3','','','',''],['k=8','','','',''],['Cascade','','','',''],['Reasoning always on','','','','']]],
      ['x','This table is your Chapter 15 deliverable. It converts an architecture debate into a decision with a defensible basis, and it fits on one slide.']
    ]},
    {h:'Step 5 — The Margin Question', b:[
      ['p','One line of arithmetic, done honestly: what does this feature cost per user per month at your expected usage, and what is it worth per user per month?'],
      ['x','If the second number is not comfortably larger than the first, you have learned something before the pilot rather than after it. That is the entire purpose of this chapter.']
    ]}
  ],

    ['What is a cascade and why does it usually work?','Route to a cheap model first and escalate only what fails a check. It works because the traffic distribution is lopsided — most production requests are lookups and extractions that a small model handles correctly (Ch.11\'s 2×2 measured this).'],

{
  id:'ch16', num:16, part:3, minutes:55, labs:[],
  title:'Beyond the Text Box',
  concept:'Your corpus is not text. It is pages — with tables, stamps, signatures and scans that clean-text chunking silently destroys.',
  needs:[
    ['Everything so far assumed text','Chapter 3 asked you to paste text into a file. That instruction hid an entire step.',3],
    ['Latency is a product constraint','p95, not the average — the number that decides whether a surface works.',11],
  ],
  story:[
    ['p','Chapter 3 asked you to paste your document\'s text into an editable file. That instruction concealed an assumption, and in most real organisations the assumption is false.'],
    ['p','Real corpora are pages. Scanned contracts with signatures and stamps. Financial statements whose meaning lives entirely in a table\'s row-column geometry. Manuals where the safety warning is a red box beside a diagram. Screenshots pasted into tickets. Forms with handwriting in the margins.'],
    ['key','Everything you built assumes extracted text. The extraction step you skipped is where most real document-AI projects actually fail — quietly, upstream of anything you measured.'],
    ['pred',{id:'ch16-clean',short:true,ph:'A percentage',
      ask:'Commit before the chapter tells you. For a real enterprise corpus — contracts, statements, policies, scanned correspondence — what fraction is clean, digital, correctly-ordered text that needs no extraction work at all?',
      reveal:'Usually far less than a proposal assumes. A large share is scanned, and a large share of what is digital still has structure that plain text extraction destroys — multi-column layouts, tables, headers repeating on every page. The number matters because every estimate downstream of it inherits its error.',
      then:'This is the audit nobody runs, and it is the cheapest way to stop a document-AI project failing six weeks in.'}],
    ['p','The classic failure is the table, and it is worth understanding precisely because it is invisible. A text extractor reading a three-column table often produces a single flat line of numbers. The values all survive. The <em>relationships</em> — this number is this row\'s figure for this year — do not. Retrieval then works perfectly, the model answers fluently from the retrieved chunk, and the number it quotes belongs to the wrong column. Nothing in your pipeline can detect this, because nothing downstream of extraction ever sees the page.'],
    ['q','I078','I079'],
    ['p','Two approaches, and the choice is a real one:'],
    ['tb',['','OCR → text → your pipeline','Page image → vision model'],[
      ['Cost','Cheap','Higher per page'],
      ['Layout, tables, figures','Frequently destroyed','Largely preserved'],
      ['Chunking','Your Chapter 3 discipline applies','A page becomes the natural chunk'],
      ['Exact strings','Preserved well','Occasional misreads — 0/O, 1/l, 5/S'],
      ['Auditability','Text is quotable and diffable','Needs a citation back to the page region']
    ]],
    ['q','I080'],
    ['p','A practical middle path is common and effective: extract text for retrieval, and hand the model the <em>page image</em> for the final answer when the question concerns a table, figure, or form. Cheap search, accurate reading.'],
    ['p','<strong>Voice changes a different variable entirely.</strong> Not accuracy — latency. In text, a two-second response is fine. In speech, a two-second silence is a conversational failure; people start talking over it. The realtime stack budgets for the whole round trip — speech in, model, speech out — and the product problems are conversational rather than linguistic: when has the user finished speaking, what happens when they interrupt, what does the system say while it is thinking. Chapter 11\'s reasoning models are, for most voice surfaces, simply unaffordable at any accuracy.'],
    ['q','I076'],
    ['c','The audit nobody runs','Before any document-AI proposal: what fraction of the corpus is clean digital text, what fraction is scanned, and what fraction of the <em>answers people actually need</em> live inside tables and figures? That third number is usually the highest and is almost never asked. It decides the architecture, and it is one afternoon with a sample of fifty documents.'],
    ['try',{id:'ch16-audit',mins:6,min:60,rows:4,
      task:'Run the audit on a corpus you actually have. What fraction is clean digital text, what fraction is scanned, and what fraction contains tables or layout that carries meaning? Estimate if you must, but say how you would measure it properly — and what you would do differently if the scanned fraction turned out to be half.',
      ph:'clean … scanned … layout-bearing … how I would measure … what changes if scanned is 50%',
      after:'Measuring it properly means sampling — fifty documents drawn at random from real traffic, not fifty chosen by whoever is enthusiastic. If the scanned fraction is high, the architecture changes rather than the effort estimate: OCR quality becomes a first-class metric with its own ground truth, the extraction step needs its own eval, and the timeline gains a phase that most proposals leave out entirely. Saying this before the project starts is worth more than any retrieval technique in this book.'}],
    ['q','I081'],
  ],
  words:[
    ['Vision-language model (VLM)','A model that reads images and text together.'],
    ['OCR','Optical character recognition — converting page images to text, discarding most layout.'],
    ['Page-as-chunk','Treating a rendered page as the retrieval unit rather than a text span.'],
    ['Layout preservation','Keeping the spatial relationships — rows, columns, callouts — that carry meaning.'],
    ['Modality gap','Information present on the page but absent from its extracted text.'],
    ['Turn detection','Deciding when a speaker has finished — the core problem of voice interfaces.'],
    ['Barge-in','A user interrupting mid-response, which the system must handle gracefully.']
  ],
  handson:[
    {h:'Step 1 — Find Your Own Silent Error', b:[
      ['p','New notebook <code>chapter-16</code>. Take one page from your corpus containing a real table — financial, eligibility bands, a rate card. Extract its text with whatever tool you have, and look at the extracted string.'],
      ['x','Read it as a machine would. Can you reconstruct which figure belongs to which row and column from the text alone? Frequently: no. Write down the specific relationship that was destroyed.']
    ]},
    {h:'Step 2 — Ask a Question Only the Table Answers', b:[
      ['p','Run that extracted text through your Chapter 7 pipeline with a question whose answer sits at a specific row-column intersection.'],
      ['x','A confident answer, frequently with a number from an adjacent column or row. This is the compound failure of Chapters 2 and 4 arriving through a route you had not instrumented — and note that every metric in your Chapter 6 evaluation would have scored this as a retrieval success.'],
      ['c','Predict first','Before running: will your pipeline get the table question right? Log your prediction. This is one of the few in this book where confidence is usually misplaced in the other direction — people expect failure and are surprised by how <em>fluent</em> the wrong answer is.']
    ]},
    {h:'Step 3 — Hand It the Page Instead', b:[
      ['p','Render the same page as an image and give it to a vision-capable model with the same question.'],
      ['code','import base64\nwith open("page.png","rb") as f:\n    b64 = base64.b64encode(f.read()).decode()\n\nr = client.chat.completions.create(\n    model=VISION_MODEL, temperature=0,\n    messages=[{"role":"user","content":[\n        {"type":"text","text":"Answer only from this page. "\n                              "Quote the row and column labels you used."},\n        {"type":"image_url",\n         "image_url":{"url":f"data:image/png;base64,{b64}"}}\n    ]}]\n)\nprint(r.choices[0].message.content)'],
      ['x','Usually correct, and — because you demanded the row and column labels — checkable in seconds. That demand is Chapter 8\'s supporting-quote idea, translated into two dimensions.']
    ]},
    {h:'Step 4 — Verify Every Cell', b:[
      ['p','Ask the vision model to transcribe the entire table into a structured record (Chapter 8\'s schema). Then check every single cell against the page by eye.'],
      ['x','Expect a small number of errors — often in the least visually distinct cells: merged headers, footnote markers, empty-versus-zero. Count them. That error rate <em>is</em> your extraction quality number, and it belongs in every document-AI proposal you ever review.']
    ]},
    {h:'Step 5 — Audit the Corpus', b:[
      ['p','Sample 30 documents. Classify each: clean digital text, scanned image, or mixed. Then, separately and more importantly, sample 20 questions people actually ask and mark how many need a table or figure to answer.'],
      ['x','Two percentages. They decide whether your architecture is text-first, vision-first, or hybrid — and they take one afternoon to obtain instead of one quarter to discover.']
    ]}
  ],
  wrong:[
    ['No vision model available','Catalogue varies','Do Steps 1, 2 and 5 anyway — the extraction failure and the corpus audit are the transferable lessons, and neither needs a vision model.'],
    ['Image rejected as too large','Resolution or payload limits','Downscale to ~1500px on the long edge. Note the trade: too small and small print becomes unreadable, which is itself a finding about your corpus.'],
    ['Vision model misreads a code as O/0','A known, permanent class of error','Exactly why hybrid matters — Chapter 12\'s keyword leg is strong on exact strings precisely where vision is weak.']

  homework:[
    ['The corpus audit','Your two percentages from Step 5, with the method written down. One paragraph. Almost no AI proposal in your organisation will contain this, and it changes cost estimates by multiples.'],
    ['The extraction error rate','Your Step 4 cell-level number, with the specific cell types that failed. This is what “supports all document formats” should have to mean.'],
    ['Explain it upward','4–5 sentences — why a system can retrieve the right page and still quote the wrong number, and what that means for reviewing financial or tabular outputs.']
  ],
  check:[
    ['Why is a table the most dangerous thing in a document-AI corpus?','Because text extraction preserves the values while destroying the row-column relationships, producing a fluent, confident, wrong answer that every retrieval metric scores as a success.'],
    ['A vendor says “we support all document formats.” What do you ask?','Show extraction on ten of <em>our</em> worst pages — scanned, multi-column, tabular — and give me the cell-level error rate. Format support is a file-opening claim; extraction fidelity is the one that matters.'],
    ['Why does voice change the architecture rather than just the interface?','Because the latency budget collapses. A two-second pause is a conversational failure, which rules out reasoning models, long agent loops, and large retrieval passes on most voice surfaces.'],
    ['What is the cheapest thing you can demand of a vision model reading a table?','That it quote the row and column labels it used. It converts an unverifiable number into a four-second check — Chapter 8\'s supporting quote, in two dimensions.']
  ],
  red:['Table relationships destroyed at extraction','Right page retrieved, wrong cell quoted','Corpus assumed to be clean text']
},

{
  id:'ch17', num:17, part:3, minutes:60, labs:['systemcard'],
  title:'The Paper Trail',
  concept:'In 2027 an AI feature ships with documents attached. Most of them are product decisions wearing legal costume — which makes them yours.',
  needs:[
    ['You can measure it, so you can state it','Ground truth and error analysis are what turn a claim into a number.',14],
    ['Metadata is a filter, not a score','Version and access are decided before ranking, which is why they are the only guarantees.',12],
    ['No complete defence exists','Which is why controls sit outside the model rather than inside the prompt.',13],
  ],
  story:[
    ['p','A conventional feature ships with code, tests, and a release note. An AI feature increasingly ships with a file of documents as well, and there is a common and expensive misunderstanding about who writes them.'],
    ['key','Almost every question in an AI governance file is a product question. What is it for, who does it affect, what happens when it is wrong, who reviews what, and what evidence exists that it works — these are not legal questions with legal answers. They are product decisions being written down, usually by someone who was not in the room when they were made.'],
    ['lab','systemcard'],
    ['q','I090'],
    ['p','The regulatory shape most of the world is converging on is <strong>risk tiering</strong>: obligations scale with the consequences of being wrong, not with the technology used. The EU AI Act made this shape famous, but the shape matters far beyond its jurisdiction, because it is simply a sensible way to allocate scrutiny — and because it is what your enterprise customers\' procurement teams have started asking about regardless of where you operate.'],
    ['tb',['Tier','Shape of the obligation','Typical examples'],[
      ['Prohibited','Not permitted at all','Social scoring, certain biometric categorisation'],
      ['High risk','Documentation, human oversight, accuracy evidence, logging, conformity assessment','Employment screening, credit, education access, essential services'],
      ['Limited / transparency','Disclose that it is AI; label synthetic content','Chatbots, generated media'],
      ['Minimal','General good practice','Most internal productivity tools']
    ]],
    ['p','Two things follow that most teams learn late. First, <strong>the tier is decided by the use case, not the model</strong> — the same RAG system is minimal-risk for internal FAQ and high-risk for benefit eligibility. Second, <strong>the tier changes when the use case changes</strong>, and use cases drift after launch without anyone re-opening the file.'],
    ['q','I091','I092'],
    ['p','What must exist, in practice, for anything above minimal risk:'],
    ['l',['<strong>A stated purpose and scope</strong>, including what the system is explicitly <em>not</em> for. The out-of-scope list prevents the drift above.','<strong>Data lineage.</strong> Which documents, obtained how, under what right to use, retained how long, and where physically stored.','<strong>An evaluation record.</strong> Your Chapter 6 ground truth, your Chapter 14 taxonomy, and the measured numbers with their k and their date. This is the part that does not exist unless someone did Chapters 6 and 14 — which is why so many governance files contain adjectives instead of numbers.','<strong>A human oversight design.</strong> Not “a human reviews the output,” but: which outputs, at what point, with what information visible, with the authority and the time to overrule. Oversight that cannot realistically be exercised is not oversight.','<strong>Known limitations.</strong> Your red-marked map, in prose. The single most credibility-generating section in any AI document.','<strong>Logging and an incident path.</strong> What is recorded per request, retained how long, and who does what when it goes wrong.','<strong>Change control.</strong> Model version pinned, system prompt versioned, eval re-run on change. Chapter 18\'s subject, written down here.']],
    ['q','I094','I131'],
    ['try',{id:'ch17-oversight',mins:6,min:60,rows:4,
      task:'Design oversight that survives contact with volume. Four thousand outputs a day, one reviewer. Write what that reviewer actually sees, which outputs reach them, and what they are able to do about it — then say why “a human reviews every output” is not an answer.',
      ph:'they see … routed by … can do … and reviewing everything fails because …',
      after:'Reviewing everything at that volume is a fiction that reads well in a governance file and is abandoned in week two — which is worse than not claiming it, because the file now misrepresents the control. The workable design is targeted: route by confidence, by risk tier of the action, and by disagreement between retrieval and answer. The reviewer must see the output <em>and</em> the evidence it came from — the retrieved chunks with their sources — because approving an answer you cannot check is not oversight. And they must be able to reject and correct, not merely observe; a review point with no lever attached is theatre.'}],
    ['q','I096','I132'],
    ['c','The deletion drill','A person exercises a deletion right. Their data sits in: the source document store, the chunk store, the vector index, the prompt cache, provider-side logs, your own request logs, and any eval set you built from real traffic. Trace all seven. Most teams discover at least two they cannot reach — and it is far better to discover that on a Tuesday afternoon than in response to a regulator.'],
    ['pred',{id:'ch17-delete',short:true,ph:'Name the store',
      ask:'A person exercises a deletion right. Their data is in the source document store, the chunk store, the vector index, your logs, your eval sets, and any cache. Before reading on: which one do teams forget?',
      reveal:'Eval sets and logs, most often — because they were copied for a good reason by someone who was not thinking about deletion, and nothing points back from them to the person. Caches are a close third, and prompt caches are the most invisible of all: they hold fragments of documents with no index by subject at all.',
      then:'This is why lineage is recorded at ingestion rather than reconstructed later. A deletion request you cannot satisfy is not a technical inconvenience; it is a compliance failure with a date attached.'}],
    ['q','I097','I098'],
    ['q','I134','I135'],
    ['p','Finally, the thing that is already happening in your organisation whether or not anyone has written it down: <strong>shadow AI</strong>. Staff are pasting internal documents into consumer chat tools right now. Prohibition does not work, because the tools are useful. A sanctioned, adequate alternative plus clear guidance about what may be pasted works considerably better, and “we banned it” is a statement about policy rather than about behaviour.'],
    ['q','I093'],
  ],
  words:[
    ['Risk tier','Obligation level set by consequence of error, not by technology.'],
    ['System card / model card','A structured document describing purpose, data, evaluation, limitations and oversight.'],
    ['Data lineage','Where data came from, under what right, held where, for how long.'],
    ['Human oversight','A specified, exercisable review point with authority to overrule.'],
    ['DPIA','A documented assessment of privacy impact before deployment.'],
    ['Subprocessor','A third party your provider passes data to. Inherited risk.'],
    ['Data residency','The physical jurisdiction where data is stored and processed.'],
    ['Audit trail','Durable records sufficient to reconstruct what happened and why.'],
    ['Shadow AI','Unsanctioned tool use by staff. A measurable reality, not a hypothetical.']
  ],
  handson:[
    {h:'Step 1 — Tier Your Own System', b:[
      ['p','Take the RAG system you built in Chapter 7 and place it in a real use case from your organisation. Assign a tier, and write one sentence justifying it. Then change the use case — internal FAQ to customer eligibility — and re-tier.'],
      ['x','The same code moves tiers. That is the lesson, and it is why tiering is a product conversation and not an engineering one.']
    ]},
    {h:'Step 2 — Write the System Card', b:[

/* Part IV — The decisions that outlive the architecture.

   Parts I to III build a machine and the instruments to judge it. These two
   chapters are about the two decisions that survive every rebuild of that
   machine: which lever you reach for when it is not good enough, and what the
   person on the other side of the screen is shown when it is wrong. Both are
   product decisions that no engineer can make for you. */

['I068','S17',3,'num','A single call sends ~1,200 tokens. A 6-step agent re-sends a growing conversation each step, adding roughly 400 tokens per step. Approximately how many total input tokens does the run consume?',
 ['tokens','Sum the growing envelope across 6 steps'],[13200,20],
 'Roughly 1200 + 1600 + 2000 + 2400 + 2800 + 3200 = 13,200 — about 11× a single call, not 6×. Agent cost grows with the accumulated context per step. This is the most underestimated line in AI business cases.'],

/* ================= S18 Context engineering ================= */
['I069','S18',2,'mcq','Prompt engineering and context engineering differ how?',
 ['They are the same discipline','Prompt engineering is how the instruction is worded; context engineering is what material is admitted, in what order, and what is evicted','Context engineering only applies to agents','Prompt engineering is for chat, context engineering for APIs'],1,
 'One is wording. The other is a scarcity discipline practised against an apparently unlimited resource.'],
['I070','S18',2,'mcq','What is the practical architectural instruction that prompt caching gives you?',
 ['Use shorter prompts','Stable material first, volatile last','Cache the response, not the request','Reduce k'],1,
 'System prompt and reference documents at the head; the user\'s question at the tail. Free money, requiring only that you order the envelope correctly.'],
['I071','S18',3,'mcq','Which is the hidden cost of editing a system prompt casually in a cached architecture?',
 ['The model has to relearn the instruction','Every cache downstream of the prefix is invalidated','Latency increases permanently','The context window shrinks'],1,
 'A tweak that reads as trivial can multiply your bill until caches refill. System prompts should be versioned deliberately, not adjusted in passing.'],
['I072','S18',3,'mcq','Compaction reliably destroys which kind of information?',
 ['Themes and topics','Specific identifiers — figures, names, dates, reference numbers','The most recent turns','System instructions'],1,
 'Themes survive summarisation; particulars do not. Design accordingly: keep identifiers in a structured store, not in prose history.'],

/* ================= S19 Reasoning ================= */
['I073','S19',2,'mcq','Test-time compute means:',
 ['Compute spent training the model','Buying accuracy per query at inference time, in money and latency','Running tests before deployment','Compute used for embeddings'],1,
 'The first product lever in this book that a PM controls directly with a number.'],
['I074','S19',3,'mcq','Which task type should NOT get a reasoning budget?',
 ['Eligibility calculation across three interacting conditions','Routing a ticket to the correct department','Reconciling three conflicting figures','Planning a multi-step migration'],1,
 'Classification, extraction, lookup and formatting are the majority of production traffic and gain nothing. Spending reasoning tokens there is paying a barrister to read a form.'],
['I075','S19',3,'mcq','Retrieval returns the wrong chunk. You switch to a reasoning model. What happens?',
 ['The model detects the error and asks for better context','It reasons at length toward the wrong answer — longer, better-argued, more persuasive','Accuracy improves modestly','It refuses to answer'],1,
 'Reasoning cannot manufacture evidence. Persuasiveness scales with effort; correctness does not, when the evidence supplied is wrong. This makes it more dangerous, not less.'],
['I076','S19',3,'mcq','For a chat surface, which latency number governs the design?',
 ['Mean','Median (p50)','p95','Minimum'],2,
 'Users experience the tail. One 40-second response teaches them the product is slow more effectively than twenty fast ones teach them it is quick.'],
['I077','S19',3,'judge','Someone reports "accuracy went up after we moved to the reasoning model." Give the three questions that decide whether to keep it.',null,
 'One: on which slice did it improve — the whole set, or a handful of hard cases? Two: what happened to p95 latency and cost per query? Three: could a retrieval fix have produced the same gain more cheaply — i.e. were the failures actually evidence failures rather than thinking failures? A strong answer also asks whether thinking tokens are itemised on the bill.'],

/* ================= S20 Extraction / modality ================= */
['I078','S20',2,'mcq','Text extraction reads a three-column financial table. What is most likely lost?',
 ['Some of the numbers','The row-and-column relationships, while every value survives','The column headers only','Nothing, if OCR quality is good'],1,
 'The values all survive; the relations do not. Retrieval then works perfectly and the model quotes a number from the wrong column, fluently.'],
['I079','S20',3,'mcq','Why is the table failure especially dangerous?',
 ['Tables are common','Every retrieval metric scores it as a success — the right page was found','It only affects scanned documents','It produces obvious formatting errors'],1,
 'Nothing downstream of extraction ever sees the page, so nothing in the pipeline can detect it. Your Chapter 6 evaluation would score it as a hit.'],
['I080','S20',3,'mcq','What is the cheapest thing to demand of a vision model reading a table?',
 ['A confidence score per cell','That it quote the row and column labels it used','That it output CSV','That it process at high resolution'],1,
 'It converts an unverifiable number into a four-second check — the supporting-quote idea, in two dimensions.'],
['I081','S20',3,'judge','Before a document-AI proposal, which two percentages do you insist on measuring, and why do they decide the architecture?',null,
 'One: what fraction of the corpus is clean digital text versus scanned or mixed. Two — and this is the one almost nobody asks — what fraction of the *answers people actually need* live inside tables and figures rather than prose. The second is usually the higher number. Together they decide text-first, vision-first or hybrid, and they change cost estimates by multiples. A strong answer notes both take one afternoon on a sample of ~30 documents and ~20 real questions.'],

/* ================= S21 Injection & trifecta ================= */
['I082','S21',1,'mcq','Indirect prompt injection arrives via:',
 ['The user typing an attack','Content the system reads — a document, email, ticket or web page','A compromised API key','A malicious model update'],1,
 'The harder version of the Chapter 2 lesson: the pressure does not have to come from the user. It targets a system nobody is watching in real time and is invisible in the interface.'],
['I083','S21',2,'mcq','Why can\'t the model reliably separate your instructions from document text?',
 ['It was not trained for that task','Both arrive as text in the same stream — there is no structural channel separating instruction from data','The system prompt is too short','Temperature is too high'],1,
 'The separation is a convention the model was trained to mostly respect, not a boundary it can enforce.'],
['I084','S21',2,'multi','The lethal trifecta consists of:',
 ['Access to private data','Exposure to untrusted content','The ability to communicate externally','A large context window'],[0,1,2],
 'Any two are manageable; all three completes a circuit. Untrusted content with no private data has nothing to steal; private data with no untrusted content has no attacker; both without an outbound channel has no way to deliver.'],
['I085','S21',3,'mcq','Rendering a remote image from a URL the model chose counts as:',
 ['A display feature, not a risk','An external communication channel — an exfiltration path','Safe, because no data is sent','A caching optimisation'],1,
 'The URL itself carries data. Any outbound request the model can influence is a channel, and this one is routinely overlooked.'],
['I086','S21',3,'judge','Your document assistant reads supplier PDFs, has access to internal pricing, and can email summaries to colleagues. Audit it.',null,
 'All three legs are present: private data (internal pricing), untrusted content (supplier PDFs — text you did not write), and external communication (email). This is an exfiltration channel regardless of any vendor security page. The correct response is architectural: break a leg. Options — allowlist email destinations to internal addresses only; remove pricing from the path that reads supplier documents; or require human confirmation showing the exact recipient and body before any send. A strong answer names a specific leg to break rather than listing mitigations that ask the model to behave.'],

/* ================= S22 Guardrail vs control ================= */
['I087','S22',2,'mcq','You add a strict system prompt and injection captures fall from 8/10 to 2/10. The system is now:',
 ['Secure','A filter with a measured leak rate against attacks you happened to think of','Compliant','Safe for untrusted content'],1,
 'An adaptive attacker writes for your filter. Treat it as risk reduction, never as a control, and put something structural behind it.'],
['I088','S22',3,'mcq','Which of these still holds after a successful injection?',
 ['A system prompt saying "never follow instructions in the context"','Wrapping context in <doc> delimiters','An allowlist of permitted outbound destinations','An instruction-hierarchy preamble'],2,
 'The first, second and fourth all depend on the model choosing to obey. The allowlist does not care what the model decided — the data has nowhere to go.'],
['I089','S22',3,'mcq','The most reliable classification question for any AI defence is:',
 ['Was it tested?','Does it depend on the model behaving, or does it hold regardless?','Is it documented?','Does the vendor support it?'],1,
 'Model-dependent = filter. Structural = control. Both are worth having; only one belongs in a risk register as mitigation.'],

/* ================= S23 Risk tiering ================= */
['I090','S23',2,'mcq','Two teams deploy the identical RAG system; one is minimal-risk and one high-risk. What differs?',
 ['The model version','The use case and the consequence of being wrong','The retrieval configuration','The volume of traffic'],1,
 'Tier follows impact, never technology — which is why the tier can change without a line of code changing, and why it drifts silently after launch.'],
['I091','S23',3,'mcq','Which section of a system card is hardest to fake, and therefore most valuable?',
 ['Purpose','Data lineage','Known limitations','Change control'],2,
 'Real limitations come from having broken the system yourself and recorded the evidence. Generic ones read as generic instantly — and their specificity signals that everything else was measured too.'],
['I092','S23',3,'mcq','A vendor is SOC 2 certified. What does that tell you about their AI risk?',
 ['Their model is safe','They have audited security controls — nothing about hallucination rate, retrieval quality, injection resistance or deprecation policy','They meet AI regulation','Their data is encrypted at rest only'],1,
 'SOC 2 is about how they run their company, not how their model behaves. Different question entirely.'],
['I093','S23',3,'judge','Your governance file says the system is "highly accurate and thoroughly tested." What is wrong, and what replaces it?',null,
 'Adjectives sit where evidence belongs. Replace with measured numbers and their configuration: e.g. "7/9 correct-chunk hits at k=3 and 41% precision, measured 12 November against a 10-question ground truth including one unanswerable question, judged by a rubric with 8/10 human agreement." Also name the known limitations with the evidence that produced each. A strong answer notes that these numbers do not exist unless someone actually built ground truth — which is why so many governance files contain adjectives.'],

/* ================= S24 Oversight ================= */
['I094','S24',2,'mcq','Your oversight design says a human reviews every output, at 4,000 outputs a day. What is wrong?',
 ['Nothing — that is thorough','It is not exercisable, so it is not oversight; it is a sentence in a document','It should be two humans','Review should be automated'],1,

['I095','S24',3,'multi','What makes a review point genuinely exercisable?',

['I096','S24',3,'mcq','Which pair of earlier techniques makes targeted human review possible at scale?',
 ['Reranking and hybrid search','Structured output and programmatic checks','Reasoning models and caching','Chunking and embeddings'],1,

/* ================= S25 Data lifecycle ================= */
['I097','S25',2,'multi','A person exercises a deletion right. Which stores must you reach?',

/* ================= S26 Unit economics ================= */
['I099','S26',2,'mcq','A cascade is:',
 ['Running several models in parallel and voting','Routing to a cheap model first and escalating only what fails a check','Chaining retrieval and generation','Retrying failed requests'],1,

['I100','S26',3,'num','Naive cost is ₹0.0005 per query. Apply: k raised 3→8 (×2.67 input), a 4-step agent (×4), a 10% retry rate, and reasoning tripling output tokens. Roughly what multiple over naive is the loaded cost? Answer the multiple.',
 ['×','Compound the multipliers'],[13,35],

['I101','S26',3,'mcq','A vendor quotes ₹0.30 per query. Which follow-up matters most?',
 ['Is there a volume discount?','At what k, how many model calls per user-visible request, and does that include retries and reasoning tokens?','Which region hosts it?','What is the SLA?'],1,
 'A per-query price without its configuration is not a price. The same feature spans an order of magnitude depending on those answers.'],
['I102','S26',3,'judge','Your cascade escalates 35% of traffic. Cheap model is 1/12th the cost of the strong one. Roughly what do you save, and what must you check before shipping it?',null,
 'Blended cost ≈ 0.65×(1/12) + 0.35×1 ≈ 0.40 of always-strong — roughly a 60% saving, before counting the cheap model\'s own escalation overhead (escalated queries are paid for twice). What to check: re-grade accuracy against ground truth under the cascade, because the saving is only real if quality holds; and check p95 latency, since escalated queries pay two round trips. A strong answer names both halves of the trade, not just the saving.'],

/* ================= S27 Vendor interrogation ================= */
['I103','S27',2,'mcq','"94% accuracy." Which question comes first?',
 ['Which model do you use?','Against which ground truth — who wrote it, and does it resemble our users\' questions?','How fast is it?','Is it cached?'],1,

['I104','S27',3,'mcq','"Our GenAI assistant, trained on your documents." What is the most likely truth?',

['I105','S27',3,'mcq','A vendor demos hybrid search plus reranking. What is the only response that matters?',

['I108','S28',3,'mcq','Why is a kill switch not the same as a rollback?',

['I111','S29',2,'mcq','Which sentence best explains statelessness to a non-technical executive?',

['I116','S30',3,'mcq','Answers are correct but cite chunks that do not contain the claim. Most likely cause?',

 'Drop k and re-check. Blended context is an invitation to synthesise across sources — and the programmatic quote-verbatim check catches it for free on every release.'],
['I117','S30',3,'order','A stakeholder wants better answer quality and gives you one quarter. Order these by typical impact-per-effort, highest first.',
 ['Fix corpus metadata and remove superseded documents','Build ground truth and run error analysis','Add reranking to cut k while raising precision','Switch to a reasoning model'],[1,0,2,3],
 'Measure first — without ground truth and a failure taxonomy you cannot tell which of the others to do. Metadata hygiene is usually the largest uncosted win. Reranking is a strong, bounded improvement. Switching to a reasoning model is the most expensive and least likely to address an evidence problem.'],
['I118','S30',3,'judge','Your RAG assistant scores well offline but support escalations have not fallen. Give your diagnostic sequence.',null,
 'One: compare the eval set against real traffic — most likely they diverge (offline measures the key, online measures user outcomes). Two: sample 20-30 real escalated queries and run error analysis, open-coding failures before categorising. Three: check whether failures are retrieval (wrong evidence), generation (right evidence, wrong answer), or fit (the system answers correctly but the user needed something else — a task the product does not do). Four: measure the unanswerable-question behaviour, since escalations often come from confident wrong answers rather than refusals. A strong answer starts by questioning the eval set rather than the model.'],

/* ---- S31 Adaptation strategy ---- */
['I138','S31',1,'mcq','Fine-tuning a model primarily teaches it:',
 ['New facts about your business','A behaviour — format, tone, structure, how to respond',
  'To retrieve documents more accurately','To reason through more steps'],1,
 'Fine-tuning adjusts the model’s behaviour from examples of inputs and desired outputs. It is extremely good at “always answer in this shape, in this register, following these conventions.” It is a poor and expensive way to install facts, because facts change and a tuned model has to be retrained to learn that they did.'],

['I139','S31',2,'mcq','Users complain the assistant does not know your 2026 policy, which was published last month. Which lever is the right one?',
 ['Fine-tune on the new policy','Retrieval — index the policy and cite it',
  'A longer system prompt describing the policy','Switch to a larger model'],1,
 'This is a knowledge gap, and knowledge that changes belongs in retrieval where it can be updated, versioned and cited. Fine-tuning bakes it in until the next training run; a system prompt works only until the policy is long enough to crowd the envelope, and neither produces a citation the user can check.'],

['I140','S31',2,'mcq','What is the strongest reason to exhaust prompting and retrieval before fine-tuning?',
 ['Fine-tuning is technically difficult',
  'They are reversible and measurable in hours; tuning adds a dataset, a training cycle and a dependency you must maintain',
  'Fine-tuning always performs worse','Providers discourage it'],1,
 'The argument is not that tuning is bad — it is that the first two levers are cheap to try and cheap to undo, so they cost you a day to rule out. Tuning commits you to building and maintaining a labelled dataset, re-running it on every model change, and losing the ability to switch providers easily. Spend that only after the cheap levers have failed against a measurement.'],

['I141','S31',3,'multi','Which of these must already exist before "should we fine-tune?" is a question that can be answered?',
 ['An eval suite with ground truth you trust',
  'A named failure mode, with counts, from real traffic',
  'A labelled dataset of inputs and desired outputs, and a plan to maintain it',
  'Evidence that prompting and retrieval did not fix it',
  'A budget approved by finance'],[0,1,2,3],
 'The first four are the decision. Without an eval you cannot tell whether tuning helped; without a named failure with counts you do not know what you are fixing; without a dataset there is nothing to tune on and no way to repeat it after the next model deprecation; and without having tried the reversible levers you are paying the expensive price first. Budget is a consequence of the decision, not an input to it.'],

['I142','S31',3,'judge','A senior stakeholder asks, in a roadmap review, "why aren’t we fine-tuning?" Write the reply that turns the question into a decision rather than a preference.',
 null,
 'A strong reply refuses both the yes and the no, and asks what kind of wrong the system currently is. Roughly: “Tell me the failure you want fixed and I will tell you which lever fixes it. If it does not know something, that is retrieval — and tuning would bake in a fact that changes. If it knows but answers in the wrong shape or register, that is prompting first and tuning second, and I can test prompting this week. If it cannot do the reasoning, that is a different model or a thinking budget. Right now our error taxonomy says the top cluster is retrieving the right document and the wrong clause, which no amount of tuning touches. When a cluster shows up that is genuinely behavioural, tuning is the right tool and I will need a labelled set and an owner to maintain it, because it has to be re-run every time the base model is deprecated.”'],

['I143','S31',3,'mcq','A distilled small model most reliably beats a frontier model when the task is:',
 ['Open-ended and varied, with high accuracy demands',
  'Narrow and repetitive, at high volume, where latency or cost dominates',
  'Novel, with no examples available','Reasoning-heavy with many dependent steps'],1,
 'Distillation trades generality for a narrow competence at a fraction of the cost and latency. That trade is excellent for classification, routing, extraction and other high-volume repetitive work, and poor everywhere the variety is the point. The economics only work when volume is high enough that the cost difference exceeds the effort of building and maintaining the smaller model.'],

/* ---- S32 Interface design for uncertainty ---- */
['I144','S32',1,'mcq','The primary purpose of showing sources beside an AI-generated answer is:',
 ['To signal sophistication','To let the user verify the claim cheaply',
  'To satisfy the legal team','To improve the model’s accuracy'],1,
 'Citations exist so that checking is cheaper than trusting. That is why a citation which does not resolve to the actual passage is worse than none at all: it buys the appearance of verifiability while removing the ability to verify, which is precisely the trade a user cannot detect.'],

['I145','S32',2,'mcq','Which output should NOT be streamed token by token as it is generated?',
 ['A long explanatory answer','A drafted email the user will edit',
  'A number the model may revise as it continues — a total, an amount, a count',
  'A summary of a document'],2,
 'Streaming is a latency illusion that works because prose reads left to right. A figure that appears and then changes as generation continues is worse than a spinner: the user has already read it, and may have acted on it. Numbers, decisions and anything a user might screenshot should appear once, settled.'],

['I146','S32',3,'mcq','Your model returns a confidence score. What is the strongest way to use it in the interface?',
 ['Display it as a percentage next to the answer',
  'Colour the answer green, amber or red by threshold',
  'Route by it — high confidence answers directly, low confidence shows evidence first or asks a question',
  'Hide it; users find numbers confusing'],2,
 'A displayed confidence number transfers the judgement to a user who has no way to calibrate it, and model-reported confidence is frequently poorly calibrated anyway. The value of the score is as a routing signal inside your product: it changes what the interface does — answer, show evidence, ask a clarifying question, or hand to a human — rather than what it says.'],

['I147','S32',3,'multi','What makes a correction path genuinely valuable rather than decorative?',

  'It records the retrieved evidence alongside the correction',
  'It is faster than abandoning the feature and doing the task manually',
  'It feeds the failure taxonomy that drives the roadmap',
  'It thanks the user for their feedback'],[0,1,2,3],
 'A thumbs-down with no context is close to worthless: it says something was wrong and nothing about what. A correction that captures the expected answer and the evidence the system was working from converts a complaint into an eval case. And if correcting is slower than doing it by hand, nobody corrects — so the path has to be genuinely cheaper than the workaround, or you collect nothing.'],

['I148','S32',3,'mcq','Which screen most determines whether users trust an AI feature over time?',
 ['The successful answer','The loading state',
  'The refusal or empty state — what it shows when it has nothing good to say',
  'The onboarding tour'],2,
 'Every system is impressive when it works. Trust is built or destroyed by what happens when it cannot answer: a system that says “I don’t have that” with a route to a human is trusted more, and correctly, than one that always produces something. This screen is designed last or not at all, which is why so many AI features feel unreliable despite good average accuracy.'],

['I149','S32',3,'judge','Write the interface contract for an AI feature you know: what it shows when it is confident, what it shows when it is not, what the user can do when it is wrong, and what the feature still does when the AI path is turned off.',
 null,
 'A strong answer treats uncertainty as a design input rather than an engineering embarrassment. Confident: the answer with resolvable citations, and an action the user can take directly. Unconfident: the evidence first with the answer framed as a draft, or a clarifying question rather than a guess — and never the same visual treatment as a confident answer. Wrong: an edit path that captures the expected answer and the evidence, faster than doing the task manually, feeding the failure taxonomy. Off: the feature degrades to something that still works — search without generated answers, a form without extraction, a queue without routing — because the kill switch is only usable if there is a product underneath it.']

/* Account-backed storage.

   When the app is served with its API and you are signed in, the database holds
   your progress and this device is a cache. Every write goes up; every open
   pulls down. Sign in on a new machine and your record is simply there.

   When there is no backend (opened from disk, or on a static host) every call
   here fails fast and the app keeps working on localStorage alone. */

window.REMOTE = (function(){
const KEY  = () => (window.STORE && window.STORE.KEY) || 'aifz2027';
const MKEY = () => KEY() + ':srv';        // {version, marker, pending}

let available = null;                     // null = not probed yet
let user = null;

function meta(){
  try{ return JSON.parse(localStorage.getItem(MKEY()) || '{}'); }catch(e){ return {}; }
}
function setMeta(m){
  try{ localStorage.setItem(MKEY(), JSON.stringify(m)); }catch(e){}
}
function clearMeta(){ try{ localStorage.removeItem(MKEY()); }catch(e){} }

function deviceName(){
  const ua = navigator.userAgent || '';
  const os = /iPhone|iPad/.test(ua) ? 'iPhone/iPad'
           : /Android/.test(ua)     ? 'Android'
           : /Mac OS X/.test(ua)    ? 'Mac'
           : /Windows/.test(ua)     ? 'Windows'
           : /Linux/.test(ua)       ? 'Linux' : 'device';
  const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome'
           : /Safari\//.test(ua) ? 'Safari' : /Firefox\//.test(ua) ? 'Firefox' : 'browser';
  return os + ' · ' + br;
}

async function api(path, opts){
  const o = Object.assign({ credentials:'same-origin', headers:{} }, opts||{});
  o.headers = Object.assign({ 'x-aifz':'1' }, o.headers);
  if(o.body && typeof o.body !== 'string'){
    o.headers['content-type'] = 'application/json';
    o.body = JSON.stringify(o.body);
  }
  const res = await fetch(path, o);
  let body = null;
  try{ body = await res.json(); }catch(e){}
  return { ok: res.ok, status: res.status, body };
}

/* Is there a backend behind this page at all? One probe per load. */
async function probe(){
  if(available !== null) return available;
  try{
    const r = await api('/api/health');
    available = !!(r.ok && r.body && r.body.ok);
    if(available) available = { signIn: !!r.body.signIn,
      database: !!r.body.database, dbReady: !!r.body.dbReady, dbError: r.body.dbError || null };
  }catch(e){ available = false; }
  return available;
}

async function me(){
  const a = await probe();
  if(!a) return null;
  try{
    const r = await api('/api/me');
    user = (r.ok && r.body && r.body.user) ? r.body.user : null;
    return user;
  }catch(e){ return null; }
}

const loginUrl = () => '/api/auth/login';
async function logout(){
  try{ await api('/api/auth/logout', {method:'POST'}); }catch(e){}
  clearMeta(); user = null;
}

async function pull(){
  const r = await api('/api/state');
  if(r.status === 401) return {signedOut:true};
  if(!r.ok) throw new Error('load failed (' + r.status + ')');
  return r.body;                          // {version, updatedAt, data}
}

/* Writes carry the version they were based on, so a device that has been idle
   cannot overwrite newer work from another one — the server refuses and returns
   its copy instead. */
async function push(data, baseVersion){
  const r = await api('/api/state', {method:'PUT',
    body:{ baseVersion, data, device: deviceName() }});
  if(r.status === 401) return {signedOut:true};
  if(r.status === 409) return {conflict:true, server:r.body};
  if(r.status === 413) return {tooLarge:true};
  if(!r.ok) throw new Error('save failed (' + r.status + ')');
  return {version:r.body.version, updatedAt:r.body.updatedAt};
}

async function history(){
  const r = await api('/api/history');
  return r.ok && r.body ? (r.body.versions || []) : [];
}
async function restore(version){
  const r = await api('/api/restore', {method:'POST', body:{version}});
  if(!r.ok) throw new Error('restore failed (' + r.status + ')');
  return r.body;
}

return { probe, me, logout, loginUrl, pull, push, history, restore,
         meta, setMeta, clearMeta, deviceName,
         get user(){ return user; },
         get available(){ return available; } };
})();

/* Where the curriculum comes from.

   The chapters, skills, questions, exercises and processes are data, not code.
   When a backend is present they are loaded from its database, so editing them
   in the portal takes effect on the next load — no rebuild, no redeploy. The
   copy bundled into this file is the fallback: it is what a backend-less build
   uses, what seeds the database on first boot, and what the app falls back to
   if the network is unavailable before the cache is warm. */

window.CONTENT = (function(){
const CKEY = 'aifz2027:content';
let source = 'built-in';        // built-in | server | cache
let versions = {};
let editor = false;

/* The built-ins, captured before anything overwrites the globals. */
const BUILT_IN = {
  chapters: (window.PARTS || []).reduce((a, p) => a.concat(window['PART' + p.n] || []), []),
  skills: window.SKILLS || [],
  items: [].concat(window.ITEMS1 || [], window.ITEMS2 || [], window.ITEMS3 || [], window.ITEMS4 || []),
  exercises: window.EXERCISES || [],
  processes: window.PROCESSES || [],
  reference: {

    SETUP: window.SETUP, GLOSSARY: window.GLOSSARY, VENDOR: window.VENDOR,

    LEVEL_NAMES: window.LEVEL_NAMES, LEVEL_BANDS: window.LEVEL_BANDS
