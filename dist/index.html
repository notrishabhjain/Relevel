{
  id:'ch17', num:17, part:3, minutes:60, labs:['systemcard'],
  title:'The Paper Trail',
  concept:'In 2027 an AI feature ships with documents attached. Most of them are product decisions wearing legal costume — which makes them yours.',
  story:[
    ['p','A conventional feature ships with code, tests, and a release note. An AI feature increasingly ships with a file of documents as well, and there is a common and expensive misunderstanding about who writes them.'],
    ['key','Almost every question in an AI governance file is a product question. What is it for, who does it affect, what happens when it is wrong, who reviews what, and what evidence exists that it works — these are not legal questions with legal answers. They are product decisions being written down, usually by someone who was not in the room when they were made.'],
    ['lab','systemcard'],
    ['q','I090'],
    ['p','The regulatory shape most of the world is converging on is <strong>risk tiering</strong>: obligations scale with the consequences of being wrong, not with the technology used. The EU AI Act made this shape famous, but the shape matters far beyond its jurisdiction, because it is simply a sensible way to allocate scrutiny — and because it is what your enterprise customers\' procurement teams have started asking about regardless of where you operate.'],
    ['tb',['Tier','Shape of the obligation','Typical examples'],[
      ['Prohibited','Not permitted at all','Social scoring, certain biometric categorisation'],
      ['High risk','Documentation, human oversight, accuracy evidence, logging, conformity assessment','Employment screening, credit, education access, essential services'],
      ['Limited / transparency','Disclose that it is AI; label synthetic content','Chatbots, generated media'],
      ['Minimal','General good practice','Most internal productivity tools']
    ]],
    ['p','Two things follow that most teams learn late. First, <strong>the tier is decided by the use case, not the model</strong> — the same RAG system is minimal-risk for internal FAQ and high-risk for benefit eligibility. Second, <strong>the tier changes when the use case changes</strong>, and use cases drift after launch without anyone re-opening the file.'],
    ['q','I091','I092'],

/* Part IV — The decisions that outlive the architecture.

   Parts I to III build a machine and the instruments to judge it. These two
   chapters are about the two decisions that survive every rebuild of that
   machine: which lever you reach for when it is not good enough, and what the
   person on the other side of the screen is shown when it is wrong. Both are
   product decisions that no engineer can make for you. */

 'A generated confidence number is uncalibrated and sits high for wrong answers too. A quote converts an unverifiable claim into a four-second check. Cheapest quality intervention available.'],
['I061','S16',3,'multi','Which schema decisions reduce invented values?',
 ['Making a field nullable when the source may not contain it','Adding a status enum including insufficient_evidence','Replacing free-text fields with enums where the value space is closed','Adding a confidence float field'],[0,1,2],
 'The first two remove the compulsion to invent; enums remove drift and downstream normalisation. A confidence field adds a number that feels like evidence and is not.'],
['I062','S16',3,'judge','Rewrite this requirement as a schema decision: "The extractor keeps guessing settlement amounts for claims that are still pending."',null,
 'Make amount nullable (type: ["number","null"]) and add a status enum with values such as settled / pending / insufficient_evidence, requiring status but not amount. Add a supporting_quote field so any populated amount is checkable. The insight to state explicitly: the invention was *caused* by a required non-nullable numeric field with no legal alternative — this is a schema bug, not a model failing.'],

/* ================= S17 Tools & agents ================= */
['I063','S17',1,'mcq','When a model "calls a tool", what actually executes the function?',
 ['The model','The provider\'s infrastructure','Your code, which decided to comply with a request','A sandbox inside the model'],2,
 'The model can only ask. Your program runs the function and puts the result back in the envelope. That distinction is the whole security posture.'],
['I064','S17',2,'mcq','An "agent" is best defined as:',
 ['A model that can think for itself','A model, a set of tools, a loop, and a stopping condition','A fine-tuned model with domain knowledge','A multi-model orchestration framework'],1,
 'When the fourth item is missing you do not have an agent; you have an accident with a budget attached.'],
['I065','S17',3,'mcq','Your agent produced a confident final answer containing an exchange rate, but the rate tool had returned an error. Which failure is this, and why does it matter most?',
 ['A retrieval failure — the tool was wrong','Success narrated over a tool error — it combines confident invention with a real side effect and a system that trusts the report','A latency failure','A schema failure'],1,
 'A wrong answer a human reads is a mistake. A wrong success a system records is an incident.'],
['I066','S17',3,'mcq','You changed no code and the agent started choosing the wrong tool. What did you change?',
 ['The temperature','A tool description','The step budget','The model version'],1,
 'The model selects tools purely by reading their descriptions. Descriptions are functional code written in English, and belong under version control and review.'],
['I067','S17',3,'multi','Before letting an agent act on a real workflow, which are mandatory?',
 ['A step budget with defined behaviour at exhaustion','A repeat-detection rule to break identical consecutive calls','A recorded trace of steps, arguments and results','Human confirmation on tools that write, send, pay or delete'],[0,1,2,3],
 'All four. The first two prevent runaway cost; the trace makes debugging possible at all; the fourth is the read/write boundary, the most important line in the architecture.'],
['I068','S17',3,'num','A single call sends ~1,200 tokens. A 6-step agent re-sends a growing conversation each step, adding roughly 400 tokens per step. Approximately how many total input tokens does the run consume?',
 ['tokens','Sum the growing envelope across 6 steps'],[13200,20],
 'Roughly 1200 + 1600 + 2000 + 2400 + 2800 + 3200 = 13,200 — about 11× a single call, not 6×. Agent cost grows with the accumulated context per step. This is the most underestimated line in AI business cases.'],

/* ================= S18 Context engineering ================= */
['I069','S18',2,'mcq','Prompt engineering and context engineering differ how?',
 ['They are the same discipline','Prompt engineering is how the instruction is worded; context engineering is what material is admitted, in what order, and what is evicted','Context engineering only applies to agents','Prompt engineering is for chat, context engineering for APIs'],1,
 'One is wording. The other is a scarcity discipline practised against an apparently unlimited resource.'],
['I070','S18',2,'mcq','What is the practical architectural instruction that prompt caching gives you?',
 ['Use shorter prompts','Stable material first, volatile last','Cache the response, not the request','Reduce k'],1,
 'System prompt and reference documents at the head; the user\'s question at the tail. Free money, requiring only that you order the envelope correctly.'],
['I071','S18',3,'mcq','Which is the hidden cost of editing a system prompt casually in a cached architecture?',
 ['The model has to relearn the instruction','Every cache downstream of the prefix is invalidated','Latency increases permanently','The context window shrinks'],1,
 'A tweak that reads as trivial can multiply your bill until caches refill. System prompts should be versioned deliberately, not adjusted in passing.'],
['I072','S18',3,'mcq','Compaction reliably destroys which kind of information?',
 ['Themes and topics','Specific identifiers — figures, names, dates, reference numbers','The most recent turns','System instructions'],1,
 'Themes survive summarisation; particulars do not. Design accordingly: keep identifiers in a structured store, not in prose history.'],

/* ================= S19 Reasoning ================= */
['I073','S19',2,'mcq','Test-time compute means:',
 ['Compute spent training the model','Buying accuracy per query at inference time, in money and latency','Running tests before deployment','Compute used for embeddings'],1,
 'The first product lever in this book that a PM controls directly with a number.'],
['I074','S19',3,'mcq','Which task type should NOT get a reasoning budget?',
 ['Eligibility calculation across three interacting conditions','Routing a ticket to the correct department','Reconciling three conflicting figures','Planning a multi-step migration'],1,
 'Classification, extraction, lookup and formatting are the majority of production traffic and gain nothing. Spending reasoning tokens there is paying a barrister to read a form.'],
['I075','S19',3,'mcq','Retrieval returns the wrong chunk. You switch to a reasoning model. What happens?',
 ['The model detects the error and asks for better context','It reasons at length toward the wrong answer — longer, better-argued, more persuasive','Accuracy improves modestly','It refuses to answer'],1,
 'Reasoning cannot manufacture evidence. Persuasiveness scales with effort; correctness does not, when the evidence supplied is wrong. This makes it more dangerous, not less.'],
['I076','S19',3,'mcq','For a chat surface, which latency number governs the design?',
 ['Mean','Median (p50)','p95','Minimum'],2,
 'Users experience the tail. One 40-second response teaches them the product is slow more effectively than twenty fast ones teach them it is quick.'],
['I077','S19',3,'judge','Someone reports "accuracy went up after we moved to the reasoning model." Give the three questions that decide whether to keep it.',null,
 'One: on which slice did it improve — the whole set, or a handful of hard cases? Two: what happened to p95 latency and cost per query? Three: could a retrieval fix have produced the same gain more cheaply — i.e. were the failures actually evidence failures rather than thinking failures? A strong answer also asks whether thinking tokens are itemised on the bill.'],

/* ================= S20 Extraction / modality ================= */
['I078','S20',2,'mcq','Text extraction reads a three-column financial table. What is most likely lost?',
 ['Some of the numbers','The row-and-column relationships, while every value survives','The column headers only','Nothing, if OCR quality is good'],1,
 'The values all survive; the relations do not. Retrieval then works perfectly and the model quotes a number from the wrong column, fluently.'],
['I079','S20',3,'mcq','Why is the table failure especially dangerous?',
 ['Tables are common','Every retrieval metric scores it as a success — the right page was found','It only affects scanned documents','It produces obvious formatting errors'],1,
 'Nothing downstream of extraction ever sees the page, so nothing in the pipeline can detect it. Your Chapter 6 evaluation would score it as a hit.'],
['I080','S20',3,'mcq','What is the cheapest thing to demand of a vision model reading a table?',
 ['A confidence score per cell','That it quote the row and column labels it used','That it output CSV','That it process at high resolution'],1,
 'It converts an unverifiable number into a four-second check — the supporting-quote idea, in two dimensions.'],
['I081','S20',3,'judge','Before a document-AI proposal, which two percentages do you insist on measuring, and why do they decide the architecture?',null,
 'One: what fraction of the corpus is clean digital text versus scanned or mixed. Two — and this is the one almost nobody asks — what fraction of the *answers people actually need* live inside tables and figures rather than prose. The second is usually the higher number. Together they decide text-first, vision-first or hybrid, and they change cost estimates by multiples. A strong answer notes both take one afternoon on a sample of ~30 documents and ~20 real questions.'],

/* ================= S21 Injection & trifecta ================= */
['I082','S21',1,'mcq','Indirect prompt injection arrives via:',
 ['The user typing an attack','Content the system reads — a document, email, ticket or web page','A compromised API key','A malicious model update'],1,
 'The harder version of the Chapter 2 lesson: the pressure does not have to come from the user. It targets a system nobody is watching in real time and is invisible in the interface.'],
['I083','S21',2,'mcq','Why can\'t the model reliably separate your instructions from document text?',
 ['It was not trained for that task','Both arrive as text in the same stream — there is no structural channel separating instruction from data','The system prompt is too short','Temperature is too high'],1,
 'The separation is a convention the model was trained to mostly respect, not a boundary it can enforce.'],
['I084','S21',2,'multi','The lethal trifecta consists of:',
 ['Access to private data','Exposure to untrusted content','The ability to communicate externally','A large context window'],[0,1,2],
 'Any two are manageable; all three completes a circuit. Untrusted content with no private data has nothing to steal; private data with no untrusted content has no attacker; both without an outbound channel has no way to deliver.'],
['I085','S21',3,'mcq','Rendering a remote image from a URL the model chose counts as:',
 ['A display feature, not a risk','An external communication channel — an exfiltration path','Safe, because no data is sent','A caching optimisation'],1,
 'The URL itself carries data. Any outbound request the model can influence is a channel, and this one is routinely overlooked.'],
['I086','S21',3,'judge','Your document assistant reads supplier PDFs, has access to internal pricing, and can email summaries to colleagues. Audit it.',null,
 'All three legs are present: private data (internal pricing), untrusted content (supplier PDFs — text you did not write), and external communication (email). This is an exfiltration channel regardless of any vendor security page. The correct response is architectural: break a leg. Options — allowlist email destinations to internal addresses only; remove pricing from the path that reads supplier documents; or require human confirmation showing the exact recipient and body before any send. A strong answer names a specific leg to break rather than listing mitigations that ask the model to behave.'],

/* ================= S22 Guardrail vs control ================= */
['I087','S22',2,'mcq','You add a strict system prompt and injection captures fall from 8/10 to 2/10. The system is now:',
 ['Secure','A filter with a measured leak rate against attacks you happened to think of','Compliant','Safe for untrusted content'],1,
 'An adaptive attacker writes for your filter. Treat it as risk reduction, never as a control, and put something structural behind it.'],
['I088','S22',3,'mcq','Which of these still holds after a successful injection?',
 ['A system prompt saying "never follow instructions in the context"','Wrapping context in <doc> delimiters','An allowlist of permitted outbound destinations','An instruction-hierarchy preamble'],2,
 'The first, second and fourth all depend on the model choosing to obey. The allowlist does not care what the model decided — the data has nowhere to go.'],
['I089','S22',3,'mcq','The most reliable classification question for any AI defence is:',
 ['Was it tested?','Does it depend on the model behaving, or does it hold regardless?','Is it documented?','Does the vendor support it?'],1,
 'Model-dependent = filter. Structural = control. Both are worth having; only one belongs in a risk register as mitigation.'],

/* ================= S23 Risk tiering ================= */
['I090','S23',2,'mcq','Two teams deploy the identical RAG system; one is minimal-risk and one high-risk. What differs?',
 ['The model version','The use case and the consequence of being wrong','The retrieval configuration','The volume of traffic'],1,
 'Tier follows impact, never technology — which is why the tier can change without a line of code changing, and why it drifts silently after launch.'],
['I091','S23',3,'mcq','Which section of a system card is hardest to fake, and therefore most valuable?',
 ['Purpose','Data lineage','Known limitations','Change control'],2,
 'Real limitations come from having broken the system yourself and recorded the evidence. Generic ones read as generic instantly — and their specificity signals that everything else was measured too.'],
['I092','S23',3,'mcq','A vendor is SOC 2 certified. What does that tell you about their AI risk?',
 ['Their model is safe','They have audited security controls — nothing about hallucination rate, retrieval quality, injection resistance or deprecation policy','They meet AI regulation','Their data is encrypted at rest only'],1,
 'SOC 2 is about how they run their company, not how their model behaves. Different question entirely.'],
['I093','S23',3,'judge','Your governance file says the system is "highly accurate and thoroughly tested." What is wrong, and what replaces it?',null,
 'Adjectives sit where evidence belongs. Replace with measured numbers and their configuration: e.g. "7/9 correct-chunk hits at k=3 and 41% precision, measured 12 November against a 10-question ground truth including one unanswerable question, judged by a rubric with 8/10 human agreement." Also name the known limitations with the evidence that produced each. A strong answer notes that these numbers do not exist unless someone actually built ground truth — which is why so many governance files contain adjectives.'],

/* ================= S24 Oversight ================= */
['I094','S24',2,'mcq','Your oversight design says a human reviews every output, at 4,000 outputs a day. What is wrong?',
 ['Nothing — that is thorough','It is not exercisable, so it is not oversight; it is a sentence in a document','It should be two humans','Review should be automated'],1,

['I095','S24',3,'multi','What makes a review point genuinely exercisable?',

/* ================= S25 Data lifecycle ================= */

/* ================= S26 Unit economics ================= */
['I099','S26',2,'mcq','A cascade is:',
 ['Running several models in parallel and voting','Routing to a cheap model first and escalating only what fails a check','Chaining retrieval and generation','Retrying failed requests'],1,
 'It works because the traffic distribution is lopsided — most production requests are lookups a small model handles correctly.'],
['I100','S26',3,'num','Naive cost is ₹0.0005 per query. Apply: k raised 3→8 (×2.67 input), a 4-step agent (×4), a 10% retry rate, and reasoning tripling output tokens. Roughly what multiple over naive is the loaded cost? Answer the multiple.',
 ['×','Compound the multipliers'],[13,35],

['I101','S26',3,'mcq','A vendor quotes ₹0.30 per query. Which follow-up matters most?',
 ['Is there a volume discount?','At what k, how many model calls per user-visible request, and does that include retries and reasoning tokens?','Which region hosts it?','What is the SLA?'],1,

['I102','S26',3,'judge','Your cascade escalates 35% of traffic. Cheap model is 1/12th the cost of the strong one. Roughly what do you save, and what must you check before shipping it?',null,
 'Blended cost ≈ 0.65×(1/12) + 0.35×1 ≈ 0.40 of always-strong — roughly a 60% saving, before counting the cheap model\'s own escalation overhead (escalated queries are paid for twice). What to check: re-grade accuracy against ground truth under the cascade, because the saving is only real if quality holds; and check p95 latency, since escalated queries pay two round trips. A strong answer names both halves of the trade, not just the saving.'],

['I103','S27',2,'mcq','"94% accuracy." Which question comes first?',
 ['Which model do you use?','Against which ground truth — who wrote it, and does it resemble our users\' questions?','How fast is it?','Is it cached?'],1,

['I105','S27',3,'mcq','A vendor demos hybrid search plus reranking. What is the only response that matters?',

['I109','S28',3,'multi','Your provider deprecates your model in 30 days. What do you re-run?',

['I111','S29',2,'mcq','Which sentence best explains statelessness to a non-technical executive?',
 ['The model is stateless between inference calls','The AI forgets you completely after every reply; the app creates the illusion of memory by re-sending the whole conversation each time — and you pay for that re-reading every time','Context is not persisted across API boundaries','The transformer has no recurrent state'],1,

['I113','S29',3,'judge','Explain, in four sentences a non-technical director could repeat, how a document assistant can retrieve the right page and still quote the wrong number.',null,

['I114','S30',2,'mcq','Users report the assistant answers a different question than they asked, but only on follow-ups like "and for contractors?" Which component is at fault?',

['I115','S30',3,'mcq','The assistant quotes a rule that was repealed last year, with a high confidence score. Where do you look first?',
 ['The embedding model','The system prompt','Corpus metadata and filtering — the superseded version is still indexed','The reranker'],2,

['I116','S30',3,'mcq','Answers are correct but cite chunks that do not contain the claim. Most likely cause?',

 'Drop k and re-check. Blended context is an invitation to synthesise across sources — and the programmatic quote-verbatim check catches it for free on every release.'],
['I117','S30',3,'order','A stakeholder wants better answer quality and gives you one quarter. Order these by typical impact-per-effort, highest first.',
 ['Fix corpus metadata and remove superseded documents','Build ground truth and run error analysis','Add reranking to cut k while raising precision','Switch to a reasoning model'],[1,0,2,3],
 'Measure first — without ground truth and a failure taxonomy you cannot tell which of the others to do. Metadata hygiene is usually the largest uncosted win. Reranking is a strong, bounded improvement. Switching to a reasoning model is the most expensive and least likely to address an evidence problem.'],
['I118','S30',3,'judge','Your RAG assistant scores well offline but support escalations have not fallen. Give your diagnostic sequence.',null,
 'One: compare the eval set against real traffic — most likely they diverge (offline measures the key, online measures user outcomes). Two: sample 20-30 real escalated queries and run error analysis, open-coding failures before categorising. Three: check whether failures are retrieval (wrong evidence), generation (right evidence, wrong answer), or fit (the system answers correctly but the user needed something else — a task the product does not do). Four: measure the unanswerable-question behaviour, since escalations often come from confident wrong answers rather than refusals. A strong answer starts by questioning the eval set rather than the model.'],

/* ---- S31 Adaptation strategy ---- */
['I138','S31',1,'mcq','Fine-tuning a model primarily teaches it:',
 ['New facts about your business','A behaviour — format, tone, structure, how to respond',
  'To retrieve documents more accurately','To reason through more steps'],1,
 'Fine-tuning adjusts the model’s behaviour from examples of inputs and desired outputs. It is extremely good at “always answer in this shape, in this register, following these conventions.” It is a poor and expensive way to install facts, because facts change and a tuned model has to be retrained to learn that they did.'],

['I139','S31',2,'mcq','Users complain the assistant does not know your 2026 policy, which was published last month. Which lever is the right one?',
 ['Fine-tune on the new policy','Retrieval — index the policy and cite it',
  'A longer system prompt describing the policy','Switch to a larger model'],1,
 'This is a knowledge gap, and knowledge that changes belongs in retrieval where it can be updated, versioned and cited. Fine-tuning bakes it in until the next training run; a system prompt works only until the policy is long enough to crowd the envelope, and neither produces a citation the user can check.'],

['I140','S31',2,'mcq','What is the strongest reason to exhaust prompting and retrieval before fine-tuning?',
 ['Fine-tuning is technically difficult',
  'They are reversible and measurable in hours; tuning adds a dataset, a training cycle and a dependency you must maintain',
  'Fine-tuning always performs worse','Providers discourage it'],1,
 'The argument is not that tuning is bad — it is that the first two levers are cheap to try and cheap to undo, so they cost you a day to rule out. Tuning commits you to building and maintaining a labelled dataset, re-running it on every model change, and losing the ability to switch providers easily. Spend that only after the cheap levers have failed against a measurement.'],

['I141','S31',3,'multi','Which of these must already exist before "should we fine-tune?" is a question that can be answered?',
 ['An eval suite with ground truth you trust',
  'A named failure mode, with counts, from real traffic',
  'A labelled dataset of inputs and desired outputs, and a plan to maintain it',
  'Evidence that prompting and retrieval did not fix it',
  'A budget approved by finance'],[0,1,2,3],
 'The first four are the decision. Without an eval you cannot tell whether tuning helped; without a named failure with counts you do not know what you are fixing; without a dataset there is nothing to tune on and no way to repeat it after the next model deprecation; and without having tried the reversible levers you are paying the expensive price first. Budget is a consequence of the decision, not an input to it.'],

['I142','S31',3,'judge','A senior stakeholder asks, in a roadmap review, "why aren’t we fine-tuning?" Write the reply that turns the question into a decision rather than a preference.',
 null,
 'A strong reply refuses both the yes and the no, and asks what kind of wrong the system currently is. Roughly: “Tell me the failure you want fixed and I will tell you which lever fixes it. If it does not know something, that is retrieval — and tuning would bake in a fact that changes. If it knows but answers in the wrong shape or register, that is prompting first and tuning second, and I can test prompting this week. If it cannot do the reasoning, that is a different model or a thinking budget. Right now our error taxonomy says the top cluster is retrieving the right document and the wrong clause, which no amount of tuning touches. When a cluster shows up that is genuinely behavioural, tuning is the right tool and I will need a labelled set and an owner to maintain it, because it has to be re-run every time the base model is deprecated.”'],

['I143','S31',3,'mcq','A distilled small model most reliably beats a frontier model when the task is:',
 ['Open-ended and varied, with high accuracy demands',
  'Narrow and repetitive, at high volume, where latency or cost dominates',
  'Novel, with no examples available','Reasoning-heavy with many dependent steps'],1,
 'Distillation trades generality for a narrow competence at a fraction of the cost and latency. That trade is excellent for classification, routing, extraction and other high-volume repetitive work, and poor everywhere the variety is the point. The economics only work when volume is high enough that the cost difference exceeds the effort of building and maintaining the smaller model.'],

/* ---- S32 Interface design for uncertainty ---- */
['I144','S32',1,'mcq','The primary purpose of showing sources beside an AI-generated answer is:',
 ['To signal sophistication','To let the user verify the claim cheaply',
  'To satisfy the legal team','To improve the model’s accuracy'],1,
 'Citations exist so that checking is cheaper than trusting. That is why a citation which does not resolve to the actual passage is worse than none at all: it buys the appearance of verifiability while removing the ability to verify, which is precisely the trade a user cannot detect.'],

['I145','S32',2,'mcq','Which output should NOT be streamed token by token as it is generated?',
 ['A long explanatory answer','A drafted email the user will edit',
  'A number the model may revise as it continues — a total, an amount, a count',
  'A summary of a document'],2,
 'Streaming is a latency illusion that works because prose reads left to right. A figure that appears and then changes as generation continues is worse than a spinner: the user has already read it, and may have acted on it. Numbers, decisions and anything a user might screenshot should appear once, settled.'],

['I146','S32',3,'mcq','Your model returns a confidence score. What is the strongest way to use it in the interface?',

  'Colour the answer green, amber or red by threshold',
  'Route by it — high confidence answers directly, low confidence shows evidence first or asks a question',
  'Hide it; users find numbers confusing'],2,
 'A displayed confidence number transfers the judgement to a user who has no way to calibrate it, and model-reported confidence is frequently poorly calibrated anyway. The value of the score is as a routing signal inside your product: it changes what the interface does — answer, show evidence, ask a clarifying question, or hand to a human — rather than what it says.'],

['I147','S32',3,'multi','What makes a correction path genuinely valuable rather than decorative?',
 ['It captures what the user expected instead, not only that they were unhappy',
  'It records the retrieved evidence alongside the correction',
  'It is faster than abandoning the feature and doing the task manually',
  'It feeds the failure taxonomy that drives the roadmap',
  'It thanks the user for their feedback'],[0,1,2,3],
 'A thumbs-down with no context is close to worthless: it says something was wrong and nothing about what. A correction that captures the expected answer and the evidence the system was working from converts a complaint into an eval case. And if correcting is slower than doing it by hand, nobody corrects — so the path has to be genuinely cheaper than the workaround, or you collect nothing.'],

['I148','S32',3,'mcq','Which screen most determines whether users trust an AI feature over time?',
 ['The successful answer','The loading state',
  'The refusal or empty state — what it shows when it has nothing good to say',
  'The onboarding tour'],2,
 'Every system is impressive when it works. Trust is built or destroyed by what happens when it cannot answer: a system that says “I don’t have that” with a route to a human is trusted more, and correctly, than one that always produces something. This screen is designed last or not at all, which is why so many AI features feel unreliable despite good average accuracy.'],

['I149','S32',3,'judge','Write the interface contract for an AI feature you know: what it shows when it is confident, what it shows when it is not, what the user can do when it is wrong, and what the feature still does when the AI path is turned off.',
 null,
 'A strong answer treats uncertainty as a design input rather than an engineering embarrassment. Confident: the answer with resolvable citations, and an action the user can take directly. Unconfident: the evidence first with the answer framed as a draft, or a clarifying question rather than a guess — and never the same visual treatment as a confident answer. Wrong: an edit path that captures the expected answer and the evidence, faster than doing the task manually, feeding the failure taxonomy. Off: the feature degrades to something that still works — search without generated answers, a form without extraction, a queue without routing — because the kill switch is only usable if there is a product underneath it.']

/* Account-backed storage.

   When the app is served with its API and you are signed in, the database holds
   your progress and this device is a cache. Every write goes up; every open
   pulls down. Sign in on a new machine and your record is simply there.

   When there is no backend (opened from disk, or on a static host) every call
   here fails fast and the app keeps working on localStorage alone. */

window.REMOTE = (function(){
const KEY  = () => (window.STORE && window.STORE.KEY) || 'aifz2027';
const MKEY = () => KEY() + ':srv';        // {version, marker, pending}

let available = null;                     // null = not probed yet
let user = null;

function meta(){
  try{ return JSON.parse(localStorage.getItem(MKEY()) || '{}'); }catch(e){ return {}; }
}
function setMeta(m){
  try{ localStorage.setItem(MKEY(), JSON.stringify(m)); }catch(e){}
}
function clearMeta(){ try{ localStorage.removeItem(MKEY()); }catch(e){} }

function deviceName(){
  const ua = navigator.userAgent || '';
  const os = /iPhone|iPad/.test(ua) ? 'iPhone/iPad'
           : /Android/.test(ua)     ? 'Android'
           : /Mac OS X/.test(ua)    ? 'Mac'
           : /Windows/.test(ua)     ? 'Windows'
           : /Linux/.test(ua)       ? 'Linux' : 'device';
  const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome'
           : /Safari\//.test(ua) ? 'Safari' : /Firefox\//.test(ua) ? 'Firefox' : 'browser';
  return os + ' · ' + br;
}

async function api(path, opts){
  const o = Object.assign({ credentials:'same-origin', headers:{} }, opts||{});
  o.headers = Object.assign({ 'x-aifz':'1' }, o.headers);
  if(o.body && typeof o.body !== 'string'){
    o.headers['content-type'] = 'application/json';
    o.body = JSON.stringify(o.body);
  }
  const res = await fetch(path, o);
  let body = null;
  try{ body = await res.json(); }catch(e){}
  return { ok: res.ok, status: res.status, body };
}

/* Is there a backend behind this page at all? One probe per load. */
async function probe(){
  if(available !== null) return available;
  try{
    const r = await api('/api/health');
    available = !!(r.ok && r.body && r.body.ok);
    if(available) available = { signIn: !!r.body.signIn,
      database: !!r.body.database, dbReady: !!r.body.dbReady, dbError: r.body.dbError || null };
  }catch(e){ available = false; }
  return available;
}

async function me(){
  const a = await probe();
  if(!a) return null;
  try{
    const r = await api('/api/me');
    user = (r.ok && r.body && r.body.user) ? r.body.user : null;
    return user;
  }catch(e){ return null; }
}

const loginUrl = () => '/api/auth/login';
async function logout(){
  try{ await api('/api/auth/logout', {method:'POST'}); }catch(e){}
  clearMeta(); user = null;
}

async function pull(){
  const r = await api('/api/state');
  if(r.status === 401) return {signedOut:true};
  if(!r.ok) throw new Error('load failed (' + r.status + ')');
  return r.body;                          // {version, updatedAt, data}
}

/* Writes carry the version they were based on, so a device that has been idle
   cannot overwrite newer work from another one — the server refuses and returns
   its copy instead. */
async function push(data, baseVersion){
  const r = await api('/api/state', {method:'PUT',
    body:{ baseVersion, data, device: deviceName() }});
  if(r.status === 401) return {signedOut:true};
  if(r.status === 409) return {conflict:true, server:r.body};
  if(r.status === 413) return {tooLarge:true};
  if(!r.ok) throw new Error('save failed (' + r.status + ')');
  return {version:r.body.version, updatedAt:r.body.updatedAt};
}

async function history(){
  const r = await api('/api/history');
  return r.ok && r.body ? (r.body.versions || []) : [];
}
async function restore(version){
  const r = await api('/api/restore', {method:'POST', body:{version}});
  if(!r.ok) throw new Error('restore failed (' + r.status + ')');
  return r.body;
}

return { probe, me, logout, loginUrl, pull, push, history, restore,
         meta, setMeta, clearMeta, deviceName,
         get user(){ return user; },
         get available(){ return available; } };
})();

/* Where the curriculum comes from.

   The chapters, skills, questions, exercises and processes are data, not code.
   When a backend is present they are loaded from its database, so editing them
   in the portal takes effect on the next load — no rebuild, no redeploy. The
   copy bundled into this file is the fallback: it is what a backend-less build
   uses, what seeds the database on first boot, and what the app falls back to
   if the network is unavailable before the cache is warm. */

window.CONTENT = (function(){
const CKEY = 'aifz2027:content';
let source = 'built-in';        // built-in | server | cache
let versions = {};
let editor = false;

/* The built-ins, captured before anything overwrites the globals. */
const BUILT_IN = {
  chapters: (window.PARTS || []).reduce((a, p) => a.concat(window['PART' + p.n] || []), []),
  skills: window.SKILLS || [],
  items: [].concat(window.ITEMS1 || [], window.ITEMS2 || [], window.ITEMS3 || [], window.ITEMS4 || []),
  exercises: window.EXERCISES || [],
  processes: window.PROCESSES || [],
  reference: {
    DOMAINS: window.DOMAINS, PARTS: window.PARTS, RULES: window.RULES,
    SETUP: window.SETUP, GLOSSARY: window.GLOSSARY, VENDOR: window.VENDOR,
    LATER: window.LATER, PIPELINE: window.PIPELINE, REDMARKS: window.REDMARKS,
    LEVEL_NAMES: window.LEVEL_NAMES, LEVEL_BANDS: window.LEVEL_BANDS
  }
};

/* Publish a content set into the globals the rest of the app reads. */
function apply(c){
  const ch = c.chapters && c.chapters.length ? c.chapters : BUILT_IN.chapters;
  window.CHAPTERS = ch;
  /* Republish one global per part, however many parts there are. */
  const parts = (c.reference && c.reference.PARTS) || BUILT_IN.reference.PARTS || [];
  parts.forEach(p => { window['PART' + p.n] = ch.filter(x => x.part === p.n); });
  window.SKILLS = (c.skills && c.skills.length) ? c.skills : BUILT_IN.skills;
  window.ALL_ITEMS = (c.items && c.items.length) ? c.items : BUILT_IN.items;
  window.EXERCISES = c.exercises || BUILT_IN.exercises;
  window.PROCESSES = c.processes || BUILT_IN.processes;
  const ref = c.reference || BUILT_IN.reference;
  Object.keys(BUILT_IN.reference).forEach(k => {
    window[k] = ref[k] !== undefined ? ref[k] : BUILT_IN.reference[k];
  });
}

function cached(){
  try{ return JSON.parse(localStorage.getItem(CKEY) || 'null'); }catch(e){ return null; }
}
function cache(c, v){
  try{ localStorage.setItem(CKEY, JSON.stringify({at:Date.now(), versions:v, content:c})); }
  catch(e){ /* quota: the built-ins still work */ }
}

async function fetchServer(){
  const r = await fetch('/api/content', {credentials:'same-origin', headers:{'x-aifz':'1'}});
  if(!r.ok) throw new Error('content ' + r.status);
  const j = await r.json();
  const c = {}, v = {};
  Object.entries(j.content || {}).forEach(([kind, row]) => { c[kind] = row.data; v[kind] = row; });
  if(!Object.keys(c).length) throw new Error('content empty');
  editor = !!j.editor;
  return {content:c, versions:v};
}

/* Called once before the app boots. Never rejects: the built-ins always work. */
async function load(){
  const c0 = cached();
  try{
    const {content, versions:v} = await fetchServer();
    versions = v; source = 'server';
    apply(content); cache(content, v);
    return {source};
  }catch(e){
    if(c0 && c0.content){
      versions = c0.versions || {}; source = 'cache';
      apply(c0.content);
      return {source, error:e.message};
    }
    source = 'built-in';
    apply(BUILT_IN);
    return {source, error:e.message};
  }
}

/* Editor writes. Returns {version} or throws with a readable message. */
async function save(kind, data, baseVersion){
  const r = await fetch('/api/content', {method:'PUT', credentials:'same-origin',
    headers:{'content-type':'application/json','x-aifz':'1'},
    body: JSON.stringify({kind, baseVersion, data})});
  const j = await r.json().catch(() => ({}));
  if(r.status === 403) throw new Error('You are not an editor on this deployment.');
  if(r.status === 422) throw new Error(j.detail || 'That content did not validate.');
  if(r.status === 409) throw new Error('Someone else saved this first — reload and redo your edit.');
  if(!r.ok) throw new Error(j.error || ('save failed (' + r.status + ')'));
  versions[kind] = Object.assign(versions[kind] || {}, {version:j.version, updatedAt:j.updatedAt});
  return j;
}
async function reset(kind){
  const r = await fetch('/api/content?reset=' + encodeURIComponent(kind),
    {method:'POST', credentials:'same-origin', headers:{'x-aifz':'1'}});
  if(!r.ok) throw new Error('reset failed (' + r.status + ')');
  return r.json();
}
function current(kind){
  const live = {chapters:window.CHAPTERS, skills:window.SKILLS, items:window.ALL_ITEMS,
    exercises:window.EXERCISES, processes:window.PROCESSES};
  if(kind === 'reference'){
    const o = {}; Object.keys(BUILT_IN.reference).forEach(k => o[k] = window[k]); return o;
  }
  return live[kind];
}
function versionOf(kind){ return (versions[kind] || {}).version || 0; }

return {load, save, reset, apply, current, versionOf, BUILT_IN,
  get source(){ return source; },
  get versions(){ return versions; },
  get editor(){ return editor; }};
})();

/* The Content Studio.

   Everything the app teaches — chapters, skills, questions, exercises,
   processes, reference tables — is data held in the database, not code baked
   into the bundle. This is the screen that edits it. A save here is a row
   update; the next page load anywhere reads it. Nothing is rebuilt and nothing
   is redeployed.

   Edits are held as a local draft first, so a half-finished chapter survives a
   closed tab and nobody publishes a paragraph by accident. Publishing sends the
   whole kind with the version it was based on, so two editors cannot silently
   overwrite each other. */

window.STUDIO = (function(){
const h=(t,a,c)=>{const e=document.createElement(t);
  if(a)for(const k in a){if(k==='html')e.innerHTML=a[k];else if(k==='text')e.textContent=a[k];
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)e.setAttribute(k,a[k]);}
  if(c)(Array.isArray(c)?c:[c]).forEach(x=>{if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x);});
  return e;};
const CT=()=>window.CONTENT;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const clone=x=>JSON.parse(JSON.stringify(x));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

const KINDS=[
  ['chapters','Chapters','The reading. Each one is a story, a vocabulary list, hands-on steps, homework and comprehension questions.'],
  ['skills'  ,'Skills'  ,'The thirty things you are actually trying to get good at. Mastery is tracked per skill, so this list is the spine of the tracker.'],
  ['items'   ,'Questions','The practice bank. Every question names the skill it measures and the difficulty it sits at.'],
  ['exercises','Exercises','Longer pieces of real work, with a rubric you score yourself against.'],
  ['processes','Processes','Recurring loops you run on a cadence rather than finish once.'],
  ['reference','Reference','The supporting tables: domains, glossary, vendor claims, failure map, setup, level names.']];
const KINDNAME=Object.fromEntries(KINDS.map(k=>[k[0],k[1]]));

/* ============ draft store ============ */
const DKEY='aifz2027:drafts';
let drafts={};
try{ drafts=JSON.parse(localStorage.getItem(DKEY)||'{}')||{}; }catch(e){ drafts={}; }
function persist(){ try{ localStorage.setItem(DKEY,JSON.stringify(drafts)); }catch(e){} }

const pub=kind=>CT()?CT().current(kind):null;
function draft(kind){
  if(!drafts[kind]) drafts[kind]={base:CT().versionOf(kind),at:Date.now(),data:clone(pub(kind))};
  return drafts[kind].data;
}
function touch(kind){ if(drafts[kind]){drafts[kind].at=Date.now();persist();} }
function dirty(kind){ return !!drafts[kind]&&!same(drafts[kind].data,pub(kind)); }
function discard(kind){ delete drafts[kind]; persist(); }
const dirtyKinds=()=>KINDS.map(k=>k[0]).filter(dirty);

/* The published copy this device knows about may have moved on while a draft
   sat here. Rebasing is only safe when the draft has not diverged. */
function staleDraft(kind){
  return !!drafts[kind]&&drafts[kind].base!==CT().versionOf(kind);
}

/* Publishing republishes into the running app too, so the change is visible on
   the very next click rather than after a reload. */
async function publish(kind){
  const d=drafts[kind];
  if(!d) throw new Error('nothing to publish');
  const bad=validate(kind,d.data);
  if(bad.length) throw new Error(bad[0]);
  const res=await CT().save(kind,d.data,d.base);
  const all={};
  KINDS.forEach(k=>all[k[0]]=pub(k[0]));
  all[kind]=clone(d.data);
  CT().apply(all);
  if(window.BIND_CONTENT) window.BIND_CONTENT();
  discard(kind);
  return res;
}

/* ============ validation (mirrors the server, so errors show before a save) ============ */
const TYPES=['mcq','multi','num','order','judge'];
function validate(kind,data){
  const e=[];
  const need=(c,m)=>{ if(!c) e.push(m); };
  if(kind==='chapters'){
    need(Array.isArray(data)&&data.length,'Chapters must be a non-empty list.');
    (data||[]).forEach((c,i)=>{
      ['id','title','concept'].forEach(k=>need(typeof c[k]==='string'&&c[k],`Chapter ${i+1} needs a ${k}.`));
      need(typeof c.num==='number',`Chapter ${c.id||i+1} needs a number.`);
      ['story','words','handson','homework','check'].forEach(k=>
        need(Array.isArray(c[k]),`Chapter ${c.id||i+1} needs ${k} as a list.`));
    });
    const ids=(data||[]).map(c=>c.id);
    need(new Set(ids).size===ids.length,'Two chapters share an id.');
  }
  if(kind==='skills'){
    need(Array.isArray(data)&&data.length,'Skills must be a non-empty list.');
    (data||[]).forEach((s,i)=>{
      need(typeof s.id==='string'&&s.id,`Skill ${i+1} needs an id.`);
      need(typeof s.n==='string'&&s.n,`Skill ${s.id||i+1} needs a name.`);
      need(Array.isArray(s.L)&&s.L.length===4,`Skill ${s.id||i+1} needs four level descriptions.`);
    });
  }
  if(kind==='items'){
    need(Array.isArray(data)&&data.length,'Questions must be a non-empty list.');
    const seen=new Set();
    (data||[]).forEach((it,i)=>{
      if(!Array.isArray(it)||it.length<7){ e.push(`Question ${i+1} is malformed.`); return; }
      const [id,sk,diff,type,stem,opts,ans]=it;
      need(typeof id==='string'&&id,`Question ${i+1} needs an id.`);
      need(!seen.has(id),`Two questions share the id ${id}.`); seen.add(id);
      need([1,2,3].includes(diff),`Question ${id} needs a difficulty of 1, 2 or 3.`);
      need(TYPES.includes(type),`Question ${id} has an unknown type.`);
      need(typeof stem==='string'&&stem,`Question ${id} needs a question.`);
      if(type==='mcq'){
        need(Array.isArray(opts)&&opts.length>=2,`Question ${id} needs at least two options.`);
        need(typeof ans==='number'&&ans>=0&&ans<(opts||[]).length,`Question ${id} needs one option marked correct.`);
      }
      if(type==='multi'){
        need(Array.isArray(opts)&&Array.isArray(ans)&&ans.length,`Question ${id} needs at least one correct option.`);
      }
      if(type==='order'){
        need(Array.isArray(opts)&&Array.isArray(ans)&&ans.length===opts.length,`Question ${id}'s order answer must cover every option.`);
      }
      if(type==='num') need(Array.isArray(ans)&&typeof ans[0]==='number',`Question ${id} needs a numeric answer.`);
      if(type==='judge') need(typeof ans==='string'&&ans,`Question ${id} needs a model answer.`);
      else need(typeof it[7]==='string'&&it[7],`Question ${id} needs an explanation.`);
    });
  }
  if(kind==='exercises'){
    need(Array.isArray(data),'Exercises must be a list.');
    (data||[]).forEach((x,i)=>{
      need(typeof x.id==='string'&&x.id,`Exercise ${i+1} needs an id.`);
      need(Array.isArray(x.rubric),`Exercise ${x.id||i+1} needs a rubric.`);
      (x.rubric||[]).forEach(r=>need(Array.isArray(r.l)&&r.l.length===4,
        `A rubric row in ${x.id||i+1} does not have four levels.`));
    });
  }
  if(kind==='processes') need(Array.isArray(data),'Processes must be a list.');
  if(kind==='reference') need(data&&typeof data==='object'&&!Array.isArray(data),'Reference must be an object.');
  return e;
}
/* Links the editors can break without noticing. */
function warnings(){
  const items=pub('items')||[], skills=pub('skills')||[], chs=pub('chapters')||[];
  const dI=drafts.items?drafts.items.data:items, dS=drafts.skills?drafts.skills.data:skills;
  const ids=new Set(dS.map(s=>s.id));
  const w=[];
  const orph=[...new Set(dI.filter(it=>!ids.has(it[1])).map(it=>it[1]))];
  if(orph.length) w.push('Questions point at skills that do not exist: '+orph.join(', '));
  const bare=dS.filter(s=>!dI.some(it=>it[1]===s.id)).map(s=>s.id);
  if(bare.length) w.push('Skills with no questions, so mastery can never be measured: '+bare.join(', '));
  const nums=new Set(chs.map(c=>c.num));
  const badRef=[...new Set(dS.flatMap(s=>(s.ch||[])).filter(n=>!nums.has(n)))];
  if(badRef.length) w.push('Skills cite chapters that do not exist: '+badRef.join(', '));
  return w;
}

/* ============ small form pieces ============ */
function fld(label,node,hint){
  return h('div',{class:'sfield'},[h('label',{text:label}),node,
    hint?h('span',{class:'shint',text:hint}):null]);
}
function inp(v,on,ph){
  const e=h('input',{type:'text',placeholder:ph||null}); e.value=v==null?'':String(v);
  e.addEventListener('input',()=>on(e.value)); return e;
}
function ta(v,on,rows,ph){
  const e=h('textarea',{rows:String(rows||4),placeholder:ph||null}); e.value=v==null?'':String(v);
  e.addEventListener('input',()=>on(e.value)); return e;
}
function numin(v,on,step,ph){
  const e=h('input',{type:'number',step:step||'1',placeholder:ph||null});
  e.value=v==null?'':String(v);
  e.addEventListener('input',()=>on(e.value===''?null:Number(e.value))); return e;
}
function sel(v,opts,on){
  const e=h('select',{});
  opts.forEach(([val,lab])=>{
    const o=h('option',{value:String(val),text:lab});
    if(String(val)===String(v))o.setAttribute('selected','selected');
    e.appendChild(o);});
  e.value=String(v);
  e.addEventListener('change',()=>on(e.value)); return e;
}
const btn=(label,on,cls)=>h('button',{class:cls||'sm',onclick:on},label);

/* A repeating list with add, delete and reorder. `row(item,i)` renders one
   entry's editor; `blank()` makes a new one. */
function repeat(arr,row,blank,on,label,hint,addLabel){
  const box=h('div',{class:'srepeat'});
  const draw=()=>{
    box.innerHTML='';
    arr.forEach((it,i)=>{
      box.appendChild(h('div',{class:'srow'},[
        h('div',{class:'srowtools'},[
          h('span',{class:'sidx',text:String(i+1)}),
          btn('↑',()=>{if(i){arr.splice(i-1,0,arr.splice(i,1)[0]);on();draw();}}),
          btn('↓',()=>{if(i<arr.length-1){arr.splice(i+1,0,arr.splice(i,1)[0]);on();draw();}}),
          btn('×',()=>{arr.splice(i,1);on();draw();},'sm red')]),
        h('div',{class:'srowbody'},[row(it,i)])]));
    });
    box.appendChild(btn('+ '+(addLabel||'Add'),()=>{arr.push(blank());on();draw();}));
  };
  draw();
  return label?fld(label,box,hint):box;
}
/* Plain list of strings, one per line — the cheapest editor that fits. */
function linesField(label,arr,on,hint,rows){
  return fld(label,ta(arr.join('\n'),v=>{
    arr.length=0; v.split('\n').forEach(x=>arr.push(x)); on();},rows||4),
    hint||'One per line.');
}
function csvField(label,arr,on,hint,numeric){
  return fld(label,inp(arr.join(', '),v=>{
    const parts=v.split(',').map(s=>s.trim()).filter(Boolean);
    arr.length=0; parts.forEach(x=>arr.push(numeric?Number(x):x)); on();}),
    hint||'Comma separated.');
}

/* ============ prose blocks ============ */
const BLOCKS=[['p','Paragraph'],['key','Key line'],['l','Bullets'],['n','Numbered'],
  ['c','Callout'],['code','Code'],['x','What you should see'],['tb','Table'],
  ['q','Checkpoint — questions'],['pred','Checkpoint — predict'],
  ['try','Checkpoint — your turn'],['lab','Interactive lab']];
/* The interactive blocks carry an object or an id list rather than prose, so
   converting one to a paragraph cannot keep its text. */
const INTERACTIVE=['q','pred','try','lab'];
function blockText(b){
  if(b[0]==='l'||b[0]==='n') return (b[1]||[]).join('\n');
  if(b[0]==='c') return b[2]||'';
  if(b[0]==='tb'||INTERACTIVE.includes(b[0])) return '';
  return b[1]||'';
}
function newId(prefix){
  return prefix + '-' + Math.random().toString(36).slice(2,7);
}
function recast(b,t){
  const txt=blockText(b);
  b.length=0; b.push(t);
  if(t==='l'||t==='n') b.push(txt?txt.split('\n'):['']);
  else if(t==='c') b.push('A note',txt);
  else if(t==='tb') b.push(['Column A','Column B'],[['','']]);
  else if(t==='q') b.push((window.ALL_ITEMS&&window.ALL_ITEMS[0]&&window.ALL_ITEMS[0][0])||'I001');
  else if(t==='lab') b.push(Object.keys(window.LABS||{})[0]||'tokenizer');
  else if(t==='pred') b.push({id:newId('pred'),short:true,ask:txt||'What do you think happens?',
    reveal:'What actually happens.',ph:'Your prediction'});
  else if(t==='try') b.push({id:newId('try'),task:txt||'Write the thing.',ph:'Write it here',
    after:'What a strong answer contains.',rows:4});
  else b.push(txt);
}
function tableEditor(b,on){
  const heads=b[1]||(b[1]=['Column A','Column B']);
  const rows =b[2]||(b[2]=[]);
  const box=h('div',{class:'stable'});
  const draw=()=>{
    box.innerHTML='';
    const g='grid-template-columns:repeat('+heads.length+',minmax(110px,1fr)) 2.2rem';
    const hr=h('div',{class:'stbrow',style:g});
    heads.forEach((x,i)=>hr.appendChild(inp(x,v=>{heads[i]=v;on();},'Heading')));
    hr.appendChild(btn('−',()=>{ if(heads.length>1){heads.pop();rows.forEach(r=>r.pop());on();draw();} },'sm red'));
    box.appendChild(hr);
    rows.forEach((r,ri)=>{
      while(r.length<heads.length) r.push('');
      const rr=h('div',{class:'stbrow',style:g});
      heads.forEach((_,ci)=>rr.appendChild(inp(r[ci],v=>{r[ci]=v;on();})));
      rr.appendChild(btn('×',()=>{rows.splice(ri,1);on();draw();},'sm red'));
      box.appendChild(rr);
    });
    box.appendChild(h('div',{class:'srowtools'},[
      btn('+ Row',()=>{rows.push(heads.map(()=>''));on();draw();}),
      btn('+ Column',()=>{heads.push('Column '+(heads.length+1));rows.forEach(r=>r.push(''));on();draw();})]));
  };
  draw(); return box;
}
/* A checkpoint question is a reference into the question bank, not a copy of
   one — so it is edited once, in the question editor, and stays the same
   measured item wherever it is asked. */
function questionRefEditor(b,on){
  const box=h('div');
  const ids=b.slice(1).flat();
  const draw=()=>{
    box.innerHTML='';
    const known=window.ENG?window.ENG.byItem:{};
    box.appendChild(fld('question ids',inp(ids.join(', '),v=>{
      const list=v.split(',').map(x=>x.trim()).filter(Boolean);
      b.length=1; list.forEach(x=>b.push(x));
      ids.length=0; list.forEach(x=>ids.push(x));
      on(); preview();
    },'I001, I002'),'From the question bank. Several ids ask them one after another.'));
    const pv=h('div',{class:'slist'});
    box.appendChild(pv);
    function preview(){
      pv.innerHTML='';
      b.slice(1).flat().forEach(id=>{
        const it=known[id];
        pv.appendChild(h('div',{class:'sitem'},[
          h('span',{class:'sitemm mono '+(it?'dim':'')  ,text:id}),
          h('span',{class:'sitemd',style:'flex:1',
            text:it?String(it.stem).replace(/<[^>]+>/g,'').slice(0,90)
                  :'not in the bank — this checkpoint will not render'}),
          it?h('a',{class:'backlink',href:'#/studio/items/'+encodeURIComponent(id),text:'edit'}):null]));
      });
    }
    preview();
  };
  draw(); return box;
}

function checkpointEditor(b,on){
  const o=b[1]||(b[1]={});
  const box=h('div',{class:'sform',style:'gap:.7rem'});
  box.appendChild(fld('id',inp(o.id,v=>{o.id=v;on();}),
    'Where the answer is stored. Changing it forgets what was written here.'));
  if(b[0]==='pred'){
    box.appendChild(fld('what to predict',ta(o.ask,v=>{o.ask=v;on();},3),'HTML allowed.'));
    box.appendChild(fld('what actually happens',ta(o.reveal,v=>{o.reveal=v;on();},4),
      'Shown only after they commit.'));
    box.appendChild(fld('and therefore',ta(o.then,v=>{o.then=v;on();},2),

    box.appendChild(h('div',{class:'sgrid2'},[
      fld('placeholder',inp(o.ph,v=>{o.ph=v;on();})),

        v=>{o.short=v==='1';on();}))]));
  } else {
    box.appendChild(fld('the task',ta(o.task,v=>{o.task=v;on();},4),'HTML allowed.'));
    box.appendChild(fld('what a strong answer contains',ta(o.after,v=>{o.after=v;on();},4),
      'Unlocks once they have written something of their own.'));
    box.appendChild(h('div',{class:'sgrid3'},[
      fld('placeholder',inp(o.ph,v=>{o.ph=v;on();})),

      fld('box height',numin(o.rows,v=>{o.rows=v;on();}),'Rows.')]));

function blockEditor(b,on){
  const box=h('div',{class:'sblock'});
  const draw=()=>{
    box.innerHTML='';
    box.appendChild(h('div',{class:'sblockhead'},[
      sel(b[0],BLOCKS,v=>{recast(b,v);on();draw();}),
      h('span',{class:'shint',text:
        b[0]==='p'?'HTML is allowed: <em>, <strong>, <code>.':
        b[0]==='key'?'Pulled out as the sentence that must survive.':
        b[0]==='c'?'A boxed aside with its own small heading.':
        b[0]==='x'?'What the learner should see after running the step.':
        b[0]==='code'?'Shown as a copyable code block.':''})]));
    if(b[0]==='l'||b[0]==='n'){
      const arr=b[1]||(b[1]=['']);
      box.appendChild(ta(arr.join('\n'),v=>{arr.length=0;v.split('\n').forEach(x=>arr.push(x));on();},4));
      box.appendChild(h('span',{class:'shint',text:'One bullet per line. HTML allowed.'}));
    } else if(b[0]==='c'){
      box.appendChild(inp(b[1],v=>{b[1]=v;on();},'Callout heading'));
      box.appendChild(ta(b[2],v=>{b[2]=v;on();},3,'Callout text'));
    } else if(b[0]==='tb'){
      box.appendChild(tableEditor(b,on));
    } else if(b[0]==='q'){
      box.appendChild(questionRefEditor(b,on));
    } else if(b[0]==='lab'){
      const labs=Object.keys(window.LABS||{}).map(k=>[k,(window.LABS[k].title||k)]);
      box.appendChild(fld('which lab',sel(b[1],labs.length?labs:[[b[1],b[1]]],v=>{b[1]=v;on();}),
        'Dropped into the reading at this point.'));
    } else if(b[0]==='pred'||b[0]==='try'){
      box.appendChild(checkpointEditor(b,on));
    } else {
      box.appendChild(ta(b[1],v=>{b[1]=v;on();},b[0]==='code'?6:4));
    }
  };
  draw(); return box;
}
const blocksField=(label,arr,on,hint)=>
  repeat(arr,b=>blockEditor(b,on),()=>['p',''],on,label,hint,'Block');

/* ============ page furniture ============ */
function phead(eyebrow,title,sub){
  return h('header',{class:'phead'},[
    h('div',{class:'eyebrow'},[h('span',{text:eyebrow})]),
    h('h1',{text:title}), sub?h('p',{html:sub}):null]);
}
function rel(t){
  if(!t) return 'never';
  const s=Math.floor((Date.now()-t)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+' min ago';
  if(s<86400) return Math.floor(s/3600)+' h ago';
  return Math.floor(s/86400)+' d ago';
}
const reroute=()=>{ window.dispatchEvent(new HashChangeEvent('hashchange')); };

/* The one place that explains, in plain terms, why an edit may not be publishable. */
function statusBanner(){
  const c=CT();
  const src=c?c.source:'built-in';
  const editor=!!(c&&c.editor);
  if(src==='server'&&editor) return null;
  const lines=[];
  if(src==='built-in') lines.push(
    'This page is not talking to a database — it is running on the copy built into the file. '+
    'Edits below are kept in this browser and can be downloaded as JSON, but there is nowhere to publish them to.');
  else if(src==='cache') lines.push(
    'The database did not answer, so this is the last copy this browser saw. Publishing is off until it responds again.');
  else if(!editor) lines.push(
    'You are reading the live content but you are not an editor on this deployment, so Publish is off. '+
    'Add your GitHub login to the <code>CONTENT_EDITORS</code> environment variable (or <code>ALLOWED_LOGINS</code>) '+
    'in your hosting dashboard and sign in again. Your drafts are kept here in the meantime.');
  return h('div',{class:'callout'},[
    h('span',{class:'lbl',text:'Read-only'}),
    h('p',{html:lines.join(' ')})]);
}

function draftBar(kind,onChanged){
  const bar=h('div',{class:'sbar'});
  /* Held outside draw() so the result of a publish survives the redraw that
     follows it — otherwise the one message worth reading disappears. */
  let note={cls:'',text:''};
  const draw=()=>{
    bar.innerHTML='';
    const d=dirty(kind), c=CT(), can=c&&c.source==='server'&&c.editor;
    const errs=d?validate(kind,drafts[kind].data):[];
    const msg=h('span',{class:'sbarmsg '+note.cls,text:note.text});
    bar.appendChild(h('span',{class:'pill '+(d?'red':'ok'),
      text:d?'unpublished draft':'published v'+(c?c.versionOf(kind):0)}));
    if(d&&staleDraft(kind)) bar.appendChild(h('span',{class:'pill red',text:'based on an older version'}));
    bar.appendChild(h('span',{class:'sp'}));
    if(errs.length) bar.appendChild(h('span',{class:'sbarmsg bad',text:errs.length+' problem'+(errs.length>1?'s':'')+' — '+errs[0]}));
    bar.appendChild(msg);
    const pubBtn=h('button',{class:'primary sm',onclick:async()=>{
      pubBtn.disabled=true;
      note={cls:'',text:'Publishing…'}; msg.className='sbarmsg'; msg.textContent=note.text;
      try{
        const r=await publish(kind);
        note={cls:'ok',text:'Published as v'+r.version+
          ((r.warnings&&r.warnings.length)?' — '+r.warnings.join('; '):'')};
        if(onChanged)onChanged();
        draw();
      }catch(err){
        note={cls:'bad',text:err.message};
        msg.className='sbarmsg bad'; msg.textContent=note.text; pubBtn.disabled=false;
      }
    }},'Publish');
    if(!d||!can||errs.length) pubBtn.disabled=true;
    pubBtn.setAttribute('title', !d?'No changes to publish':
      !can?'Publishing needs a database and editor rights':
      errs.length?'Fix the problems first':'Send this to the database');
    bar.appendChild(pubBtn);
    if(d) bar.appendChild(btn('Discard draft',()=>{
      if(!confirm('Throw away your unpublished changes to '+KINDNAME[kind].toLowerCase()+'?'))return;
      discard(kind); note={cls:'',text:''}; if(onChanged)onChanged(); draw(); reroute();},'sm red'));
    bar.appendChild(btn('Download JSON',()=>download(kind)));
  };
  draw(); return bar;
}

function download(kind){
  const data=dirty(kind)?drafts[kind].data:pub(kind);
  const text=JSON.stringify(data,null,2);
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    a.download='aifz-'+kind+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }catch(e){
    navigator.clipboard&&navigator.clipboard.writeText(text);
    alert('Download is blocked here, so the JSON was copied to your clipboard instead.');
  }
}

function idOf(kind,x,i){ return x&&x.id!=null?x.id:(Array.isArray(x)?x[0]:String(i)); }
function summary(kind,x){
  if(kind==='chapters') return [x.num+'. '+x.title,x.concept||'',(x.story||[]).length+' blocks · '+(x.check||[]).length+' checks'];
  if(kind==='skills')   return [x.id+' · '+x.n,x.core||'',(x.ch||[]).join(', ')];
  if(kind==='items')    return [x[0]+' · '+String(x[4]||'').slice(0,90),(x[1]||'')+' · '+(x[3]||''),'L'+x[2]];
  if(kind==='exercises')return [x.id+' · '+x.t,x.brief||'',(x.mins||0)+' min'];
  if(kind==='processes')return [x.id+' · '+x.n,x.why||'',x.cad||''];
  return [String(x),'',''];
}
function nextId(prefix,taken,width){
  let n=1; const pad=v=>String(v).padStart(width,'0');
  while(taken.has(prefix+pad(n))) n++;
  return prefix+pad(n);
}
function blankOf(kind,arr){
  if(kind==='chapters'){
    const nums=arr.map(c=>c.num||0);
    const n=(nums.length?Math.max.apply(null,nums):0)+1;
    return {id:nextId('ch',new Set(arr.map(c=>c.id)),0)||('ch'+n),num:n,part:1,minutes:45,labs:[],
      title:'Untitled chapter',concept:'One sentence a reader could repeat a week later.',
      story:[['p','']],words:[],handson:[],wrong:[],homework:[],check:[],red:[]};
  }
  if(kind==='skills') return {id:nextId('S',new Set(arr.map(s=>s.id)),2),d:(window.DOMAINS&&window.DOMAINS[0]||{}).id||'mech',
    n:'Untitled skill',ch:[],labs:[],core:'What someone can do when they have this.',
    L:['Has heard of it','Can follow it with help','Can do it unaided','Can defend it under challenge']};
  if(kind==='items') return [nextId('I',new Set(arr.map(i=>i[0])),3),
    (window.SKILLS&&window.SKILLS[0]||{}).id||'S01',1,'mcq','New question',
    ['Option A','Option B'],0,'Why the right answer is right.'];
  if(kind==='exercises') return {id:nextId('E',new Set(arr.map(x=>x.id)),2),t:'Untitled exercise',
    sk:[],ch:1,mins:30,tier:1,brief:'',deliverable:'',steps:[],
    rubric:[{c:'A dimension to score yourself on',l:['Not yet','Partly','Solidly','Convincingly']}],iterate:''};
  return {id:nextId('P',new Set(arr.map(x=>x.id)),2),n:'Untitled process',cad:'Weekly',
    why:'',metric:'',phases:[{n:'Phase one',s:[['Step','What to actually do.']]}]};
}
function reid(kind,x,arr){
  if(kind==='items') x[0]=nextId('I',new Set(arr.map(i=>i[0])),3);
  else if(x.id) x.id=nextId(x.id.replace(/[0-9]+$/,''),new Set(arr.map(y=>y.id)),
    (x.id.match(/[0-9]+$/)||[''])[0].length||2);
  if(kind==='chapters') x.num=(arr.length?Math.max.apply(null,arr.map(c=>c.num||0)):0)+1;
}

function retype(it,t){
  const from=it[3]; if(from===t) return;
  it[3]=t;
  if(t==='mcq'){ if(!Array.isArray(it[5]))it[5]=['','']; it[6]=Array.isArray(it[6])?(it[6][0]||0):0; }
  else if(t==='multi'){ if(!Array.isArray(it[5]))it[5]=['','']; it[6]=typeof it[6]==='number'?[it[6]]:[]; }
  else if(t==='order'){ if(!Array.isArray(it[5]))it[5]=['','']; it[6]=it[5].map((_,i)=>i); }
  else if(t==='num'){ it[5]=['','']; it[6]=[0,10]; }
  else if(t==='judge'){ it[5]=null; it[6]=typeof it[6]==='string'?it[6]:(it[7]||''); }
  if(t!=='judge'&&typeof it[7]!=='string') it[7]='';
}

/* A JSON textarea that refuses to hand back anything unparseable. */
function editorFor(get,set,kind){
  const box=h('div');
  const t=h('textarea',{rows:'26',spellcheck:'false',style:'width:100%'});
  t.value=JSON.stringify(get(),null,2);
  const msg=h('div',{class:'sbarmsg'});
  const apply=()=>{
    let v; try{ v=JSON.parse(t.value); }
    catch(err){ msg.className='sbarmsg bad'; msg.textContent='Not valid JSON: '+err.message; return; }
    if(kind){ const errs=validate(kind,v);
      if(errs.length){ msg.className='sbarmsg bad'; msg.textContent=errs[0]; return; } }
    set(v); msg.className='sbarmsg ok'; msg.textContent='Applied to your draft. Publish to make it live.';
  };
  box.appendChild(t);
  box.appendChild(h('div',{style:'display:flex;gap:.5rem;margin:.6rem 0;align-items:center;flex-wrap:wrap'},[
    h('button',{class:'sm primary',onclick:apply},'Apply to draft'),
    btn('Reformat',()=>{ try{ t.value=JSON.stringify(JSON.parse(t.value),null,2);
      msg.className='sbarmsg';msg.textContent=''; }catch(e){ msg.className='sbarmsg bad';msg.textContent='Not valid JSON.'; } }),
    btn('Revert',()=>{ t.value=JSON.stringify(get(),null,2); msg.className='sbarmsg'; msg.textContent=''; }),
    msg]));
  return box;
}

const $=(s,r)=>(r||document).querySelector(s);
const fmt=(n,d)=>Number(n).toFixed(d===undefined?2:d);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function ctl(label,node){return h('div',{},[h('label',{text:label}),node]);}
function slider(min,max,val,step,oninput){
  const i=h('input',{type:'range',min,max,step:step||1,value:val});
  i.addEventListener('input',()=>oninput(parseFloat(i.value)));return i;}
function stats(items){
  return h('div',{class:'stats'},items.map(([l,v,cls,s])=>
    h('div',{class:'stat'},[h('span',{class:'l',text:l}),
      h('span',{class:'v '+(cls||''),text:v}),s?h('span',{class:'s',text:s}):h('span')])));}
function seeded(s){let x=s;return()=>{x=(x*1103515245+12345)&0x7fffffff;return x/0x7fffffff;};}

/* ---------------- 1. Tokenizer & receipt ---------------- */
function tokenize(text){
  // Approximation of BPE behaviour: common short words stay whole,
  // long/rare words split. Good enough to make the ¾-of-a-word rule visible.
  const out=[];
  text.split(/(\s+)/).forEach(w=>{
    if(!w.trim()){if(w)out.push({t:w,ws:true});return;}
    const lead=w.match(/^[^\w]*/)[0], tail=w.match(/[^\w]*$/)[0];
    const core=w.slice(lead.length,w.length-tail.length||undefined);
    if(lead)out.push({t:lead});
    if(core.length<=4)out.push({t:core});
    else{let i=0;const n=core.length<=7?2:Math.ceil(core.length/4);
      const size=Math.ceil(core.length/n);
      while(i<core.length){out.push({t:core.slice(i,i+size),sub:i>0});i+=size;}}
    if(tail)out.push({t:tail});
  });
  return out.filter(x=>!x.ws&&x.t!=='');
}
const LABS={};

LABS.tokenizer={title:'The receipt, read live',k:'lab 1.1',
  note:'A close approximation of how models split text. The exact boundaries vary by model; the ratio does not. Notice which words survive whole and which shatter — and try a sentence in a second language.',
  render(el){
    const ta=h('textarea',{rows:3},'The reimbursement of approved claim amounts shall be effected within sixty days.');
    const viz=h('div',{class:'toks'}), out=h('div');
    const rate=h('input',{type:'number',value:'0.20',step:'0.05',min:'0'});
    const rout=h('input',{type:'number',value:'0.60',step:'0.05',min:'0'});
    const outLen=h('input',{type:'number',value:'220',min:'0',step:'10'});
    function run(){
      const toks=tokenize(ta.value);
      viz.innerHTML='';
      toks.slice(0,220).forEach(t=>viz.appendChild(h('span',{class:'tok'+(t.sub?' alt':''),text:t.t})));
      if(toks.length>220)viz.appendChild(h('span',{class:'tok dim',text:'… +'+(toks.length-220)}));
      const words=ta.value.trim().split(/\s+/).filter(Boolean).length;
      const ci=parseFloat(rate.value)||0, co=parseFloat(rout.value)||0;
      const ol=parseInt(outLen.value)||0;
      const per=(toks.length/1e6)*ci+(ol/1e6)*co;
      out.innerHTML='';
      out.appendChild(stats([
        ['tokens in',toks.length],
        ['words',words],
        ['tokens/word',words?fmt(toks.length/words):'—','',
          words&&toks.length/words>1.45?'above the 1.33 rule':'near the 1.33 rule'],
        ['cost / query','₹'+fmt(per,5)],
        ['at 10k queries','₹'+fmt(per*10000,0),'red','per month']
      ]));
    }
    ta.addEventListener('input',run);[rate,rout,outLen].forEach(i=>i.addEventListener('input',run));
    el.append(ta,viz,h('div',{class:'ctl'},[
      ctl('input rate / 1M',rate),ctl('output rate / 1M',rout),ctl('answer tokens',outLen)]),out);
    run();
  }};

LABS.receipt={title:'Why message 50 costs more than message 1',k:'lab 1.2',
  note:'The stage trick, metered. Each turn re-sends everything before it, so cost grows with the square of the conversation — not with the number of messages.',
  render(el){
    const n=h('span',{class:'readout',text:'30'}), per=h('span',{class:'readout',text:'180'});
    const cv=h('canvas',{height:'150'}); cv.style.width='100%';
    const out=h('div');
    let N=30,P=180;
    function draw(){
      const w=cv.clientWidth||600; cv.width=w*2; cv.height=300; cv.style.height='150px';
      const g=cv.getContext('2d'); g.scale(2,2); g.clearRect(0,0,w,150);
      const cs=getComputedStyle(document.documentElement);
      const red=cs.getPropertyValue('--red').trim(), rule=cs.getPropertyValue('--rule').trim();
      const mut=cs.getPropertyValue('--muted').trim();
      let cum=0; const pts=[];
      for(let i=1;i<=N;i++){cum+=i*P;pts.push(cum);}
      const max=pts[pts.length-1]||1;
      g.strokeStyle=rule;g.lineWidth=1;
      for(let i=0;i<=4;i++){const y=140-i*32;g.beginPath();g.moveTo(28,y);g.lineTo(w-4,y);g.stroke();}
      g.strokeStyle=red;g.lineWidth=2;g.beginPath();
      pts.forEach((p,i)=>{const x=28+(i/(N-1||1))*(w-34),y=140-(p/max)*128;
        i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
      g.fillStyle=mut;g.font='9px ui-monospace,monospace';
      g.fillText('cumulative tokens',30,12);
      g.fillText('turn '+N,w-46,150);
      out.innerHTML='';
      out.appendChild(stats([
        ['tokens, turn 1',P],
        ['tokens, turn '+N,N*P],
        ['conversation total',(pts[pts.length-1]||0).toLocaleString()],
        ['vs. flat billing','×'+fmt((pts[pts.length-1]||0)/(N*P)),'red','the compounding']
      ]));
    }
    el.append(h('div',{class:'ctl'},[
      ctl('messages',(()=>{const s=slider(2,60,30,1,v=>{N=v;n.textContent=v;draw();});
        return h('div',{},[s,n]);})()),
      ctl('tokens per message',(()=>{const s=slider(40,600,180,20,v=>{P=v;per.textContent=v;draw();});
        return h('div',{},[s,per]);})())
    ]),cv,out);
    setTimeout(draw,30); window.addEventListener('resize',()=>draw());
  }};

LABS.temperature={title:'The variety dial',k:'lab 2.1',
  note:'Real sampling mathematics on a fixed candidate set. At 0 the top continuation wins every time; raise it and the distribution flattens until the unlikely becomes routine.',
  render(el){
    const CAND=[['Move More. Live Better.',3.2],['Fit for Work, Fit for Life',2.6],
      ['Your Health, Our Priority',2.1],['Step Up Every Day',1.7],['Stronger Together at Work',1.2],
      ['Sweat Equity',0.5],['The Corridor Marathon',0.1]];
    const t=h('span',{class:'readout',text:'0.0'}), bars=h('div'), samp=h('div');
    let T=0, rnd=seeded(7);
    function probs(){
      const tt=Math.max(T,0.001);
      // subtract the max logit before exponentiating, or tt→0 overflows to Infinity
      const mx=Math.max.apply(null,CAND.map(c=>c[1]));
      const ex=CAND.map(c=>Math.exp((c[1]-mx)/tt)); const s=ex.reduce((a,b)=>a+b,0);
      return ex.map(e=>e/s);
    }
    function draw(){
      const p=probs(); bars.innerHTML='';
      CAND.forEach((c,i)=>{
        bars.appendChild(h('div',{style:'display:flex;gap:.6rem;align-items:center;margin:.25rem 0'},[
          h('span',{style:'flex:1;font-size:.83rem',text:c[0]}),
          h('span',{style:'width:120px;height:7px;background:var(--sunk);border-radius:2px;overflow:hidden'},
            [h('i',{style:`display:block;height:100%;width:${(p[i]*100).toFixed(1)}%;background:var(--red)`})]),
          h('span',{class:'readout dim',style:'font-size:.72rem;width:3.2em;text-align:right',
            text:(p[i]*100).toFixed(1)+'%'})]));
      });
      const p2=probs(); samp.innerHTML='';
      samp.appendChild(h('label',{text:'three runs at this setting'}));
      for(let r=0;r<3;r++){
        let x=rnd(),acc=0,pick=CAND[0][0];
        for(let i=0;i<CAND.length;i++){acc+=p2[i];if(x<=acc){pick=CAND[i][0];break;}}
        samp.appendChild(h('div',{class:'mono',style:'font-size:.8rem;padding:.15rem 0',text:'→ '+pick}));
      }
    }
    el.append(h('div',{class:'ctl'},[ctl('temperature',
      (()=>{const s=slider(0,1.2,0,0.05,v=>{T=v;t.textContent=fmt(v,2);draw();});
        return h('div',{},[s,t]);})()),
      h('div',{style:'flex:0'},[h('label',{text:' '}),
        h('button',{class:'sm',onclick:()=>{rnd=seeded(Math.floor(Math.random()*9999));draw();}},'Re-run')])
    ]),bars,h('hr',{class:'hr',style:'margin:1rem 0'}),samp);
    draw();
  }};

/* ---------------- 3. Chunker ---------------- */
/* A back-reference anywhere near the opening of a chunk means the chunk depends on
   text that may no longer travel with it. Tested against the opening clause only — a back-reference later in a chunk
   usually has its antecedent inside the same chunk. */
const ORPHAN=/(the aforesaid|the foregoing|notwithstanding|in continuation|as stated above|the same shall|thereof|therein|hereinabove|said (amount|limit|clause|section)|such (cases|requests|amount)|accordingly|as mentioned)/i;
LABS.chunker={title:'Scissors, with a damage report',k:'lab 3.1',
  note:'Paste your own document. The orphan test flags chunks opening with a back-reference; the boundary test flags chunks that begin or end mid-sentence. These are the two injuries Chapter 3 asks you to hunt by hand.',
  render(el){
    const DEF=`4.1 Reimbursement of Travel Expenses. Employees shall be reimbursed for expenses incurred during authorised business travel. The maximum claimable amount for domestic travel is INR 25,000 per trip.\n\n4.2 Exceptions. Notwithstanding the foregoing, the aforesaid limit shall not apply where prior written approval has been obtained from the Head of Department. In such cases the limit shall be INR 60,000.\n\n4.3 Timelines. Disbursement of approved claim amounts shall be effected within sixty days of submission of a complete claim. Incomplete claims shall be returned within ten working days.\n\n5.1 Equipment. Requests for equipment exceeding INR 40,000 require procurement review. Such requests shall be submitted through the standard requisition form.`;
    const ta=h('textarea',{rows:6},DEF);
    const mode=h('select',{},[h('option',{value:'fixed'},'Fixed size'),
      h('option',{value:'semantic'},'Semantic (split on structure)')]);
    const sz=h('span',{class:'readout',text:'30'}), ov=h('span',{class:'readout',text:'0'});
    const out=h('div'), rep=h('div');
    let S=30,O=0;
    function chunk(){
      const txt=ta.value;
      if(mode.value==='semantic')
        return txt.split(/\n\s*\n/).flatMap(b=>b.split(/(?=\n?\s*\d+\.\d+\s)/))
                  .map(s=>s.trim()).filter(Boolean);
      const w=txt.split(/\s+/).filter(Boolean); const out=[];
      const stepSz=Math.max(1,S-O);
      for(let i=0;i<w.length;i+=stepSz){out.push(w.slice(i,i+S).join(' '));if(i+S>=w.length)break;}
      return out;
    }
    function run(){
      const cs=chunk(); out.innerHTML=''; let orph=0,brk=0;
      cs.forEach((c,i)=>{
        const isOrph=ORPHAN.test(c.slice(0,50));
        const startsMid=!/^\s*(\d|[A-Z"“(])/.test(c);
        const endsMid=!/[.:;!?]["”)]?\s*$/.test(c.trim());
        if(isOrph)orph++; if(startsMid||endsMid)brk++;
        const tags=[];
        if(isOrph)tags.push(h('span',{class:'pill red',text:'orphan'}));
        if(startsMid)tags.push(h('span',{class:'pill red',text:'starts mid'}));
        if(endsMid)tags.push(h('span',{class:'pill red',text:'ends mid'}));
        if(!tags.length)tags.push(h('span',{class:'pill ok',text:'intact'}));
        out.appendChild(h('div',{class:'card',style:'padding:.6rem .8rem'},[
          h('div',{style:'display:flex;gap:.5rem;align-items:center;margin-bottom:.3rem'},
            [h('span',{class:'mono dim',style:'font-size:.65rem',text:'chunk '+i}),...tags]),
          h('div',{style:'font-size:.82rem;line-height:1.5;color:var(--ink-2)',
            text:c.length>230?c.slice(0,230)+'…':c})]));
      });
      rep.innerHTML='';
      rep.appendChild(stats([['chunks',cs.length],
        ['orphans',orph,orph?'red':'ok'],
        ['boundary breaks',brk,brk?'red':'ok'],
        ['avg words',cs.length?Math.round(cs.reduce((a,c)=>a+c.split(/\s+/).length,0)/cs.length):0]]));
    }
    ta.addEventListener('input',run); mode.addEventListener('change',run);
    el.append(ta,h('div',{class:'ctl'},[
      ctl('method',mode),
      ctl('chunk size (words)',(()=>{const s=slider(15,120,30,5,v=>{S=v;sz.textContent=v;run();});
        return h('div',{},[s,sz]);})()),
      ctl('overlap (words)',(()=>{const s=slider(0,40,0,5,v=>{O=v;ov.textContent=v;run();});
        return h('div',{},[s,ov]);})())
    ]),rep,h('div',{class:'cards'},[out]));
    run();
  }};
