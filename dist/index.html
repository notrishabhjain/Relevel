LABS.meaningmap={title:'Meaning as geometry',k:'lab 5.1',
  note:'A two-dimensional stand-in for a 1024-dimensional map, with the neighbourhoods placed to match what an embedding model actually produces. Pick any two terms; the cosine is computed live, exactly as in the chapter\'s one line of code.',
  render(el){
    const cv=h('canvas'); cv.style.width='100%'; cv.style.cursor='crosshair';
    const a=h('select'),b=h('select'); const out=h('div');
    MAPTERMS.forEach((t,i)=>{a.appendChild(h('option',{value:i},t[0]));
      b.appendChild(h('option',{value:i},t[0]));});
    a.value=6;b.value=5;
    function cos(p,q){const d=p[0]*q[0]+p[1]*q[1];
      return d/(Math.hypot(p[0],p[1])*Math.hypot(q[0],q[1]));}
    function draw(){
      const w=cv.clientWidth||600,ht=340; cv.width=w*2;cv.height=ht*2;cv.style.height=ht+'px';
      const g=cv.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,w,ht);
      const cs=getComputedStyle(document.documentElement);
      const red=cs.getPropertyValue('--red').trim(),rule=cs.getPropertyValue('--rule').trim(),
            ink=cs.getPropertyValue('--ink').trim(),mut=cs.getPropertyValue('--muted').trim();
      const X=v=>18+v*(w-40),Y=v=>ht-24-v*(ht-48);
      g.strokeStyle=rule;g.lineWidth=1;
      g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(1),Y(0));g.moveTo(X(0),Y(0));g.lineTo(X(0),Y(1));g.stroke();
      const ai=+a.value,bi=+b.value;
      // arrows from origin for the two selected
      [[ai,red],[bi,red]].forEach(([i,c])=>{
        g.strokeStyle=c;g.lineWidth=1.5;g.globalAlpha=.55;g.beginPath();
        g.moveTo(X(0),Y(0));g.lineTo(X(MAPTERMS[i][1][0]),Y(MAPTERMS[i][1][1]));g.stroke();g.globalAlpha=1;});
      MAPTERMS.forEach((t,i)=>{
        const sel=i===ai||i===bi;
        g.fillStyle=sel?red:mut;
        g.beginPath();g.arc(X(t[1][0]),Y(t[1][1]),sel?4.5:2.8,0,7);g.fill();
        g.fillStyle=sel?ink:mut;g.font=(sel?'600 ':'')+'10px system-ui,sans-serif';
        const lbl=t[0].length>26?t[0].slice(0,24)+'…':t[0];
        const tw=g.measureText(lbl).width;
        let lx=X(t[1][0])+7; if(lx+tw>w-4)lx=X(t[1][0])-tw-7;
        g.fillText(lbl,lx,Y(t[1][1])+3.5);
      });
      const c=cos(MAPTERMS[ai][1],MAPTERMS[bi][1]);
      out.innerHTML='';
      out.appendChild(stats([['cosine similarity',fmt(c,3),c>.9?'ok':(c<.6?'red':''),
        c>.9?'same neighbourhood':(c<.6?'distant suburb':'related')]]));
    }
    a.addEventListener('change',draw);b.addEventListener('change',draw);
    el.append(h('div',{class:'ctl'},[ctl('text A',a),ctl('text B',b)]),cv,out);
    setTimeout(draw,30);window.addEventListener('resize',draw);
  }};

const TOYQ=[
  {q:'reimbursement timeline',rel:[2,7]},{q:'travel limit',rel:[0]},
  {q:'approval exception',rel:[1]},{q:'equipment threshold',rel:[9]},
  {q:'incomplete claim handling',rel:[7]},{q:'who approves overruns',rel:[1,3]},
  {q:'when do I get money back',rel:[2]},{q:'procurement review trigger',rel:[9]},
  {q:'notice for cancellation',rel:[5]}
];
// simulated ranking: correct chunks appear at varying depths
const RANKS=[[1,4],[1],[2],[3],[6],[1,8],[4],[2],[7]];
LABS.prdial={title:'The trade-off, under your own hand',k:'lab 6.1',
  note:'Nine answerable questions with the correct chunks planted at realistic depths. Move k and watch recall climb while precision — and your bill — move the other way. This is the most-cited chart in applied AI, produced in one slider.',
  render(el){
    const kk=h('span',{class:'readout',text:'3'}); const out=h('div'),tbl=h('div');
    let K=3;
    function run(){
      let hits=0,rel=0,fetched=0;
      const rows=[];
      TOYQ.forEach((q,i)=>{
        const inTop=RANKS[i].filter(r=>r<=K);
        if(inTop.length)hits++;
        rel+=inTop.length; fetched+=K;
        rows.push([q.q,RANKS[i].join(', '),inTop.length?'✓':'—']);
      });
      const recall=hits/TOYQ.length, prec=rel/fetched;
      out.innerHTML='';
      out.appendChild(stats([
        ['k',K],
        ['recall-style',hits+'/9',recall>=.78?'ok':'red',(recall*100).toFixed(0)+'%'],
        ['precision-style',rel+'/'+fetched,prec>=.35?'ok':'red',(prec*100).toFixed(0)+'%'],
        ['token cost','×'+K,'red','vs k=1, forever']
      ]));
      tbl.innerHTML='';
      const t=h('table');
      t.appendChild(h('thead',{},h('tr',{},[h('th',{text:'question'}),
        h('th',{text:'correct chunk at rank'}),h('th',{text:'in top-k'})])));
      const tb=h('tbody');
      rows.forEach(r=>tb.appendChild(h('tr',{},[h('td',{text:r[0]}),
        h('td',{class:'num',text:r[1]}),
        h('td',{html:r[2]==='✓'?'<span style="color:var(--verified)">✓</span>'
          :'<span style="color:var(--red)">—</span>'})])));
      t.appendChild(tb); tbl.appendChild(h('div',{class:'tblwrap'},t));
    }
    el.append(h('div',{class:'ctl'},[ctl('top-k',
      (()=>{const s=slider(1,10,3,1,v=>{K=v;kk.textContent=v;run();});return h('div',{},[s,kk]);})())]),
      out,tbl);
    run();
  }};

LABS.schema={title:'The trap you build yourself',k:'lab 8.1',
  note:'Twenty simulated extractions against a document that contains no amount. Watch the invention rate respond to one schema decision — whether the model has a legal way to say "not present".',
  render(el){
    const nullable=h('input',{type:'checkbox'}), refusal=h('input',{type:'checkbox'});
    const constrained=h('input',{type:'checkbox',checked:'checked'});
    const out=h('div'),log=h('div');
    function run(){
      const rnd=seeded(41); const rows=[];
      let invented=0,parsefail=0,refused=0;
      for(let i=0;i<20;i++){
        let r;
        if(!constrained.checked&&rnd()<0.22){r={k:'parse',v:'```json\\n{…'};parsefail++;}
        else if(nullable.checked||refusal.checked){
          if(rnd()<0.08&&!refusal.checked){r={k:'inv',v:'amount: 42000'};invented++;}
          else{r={k:'ok',v:refusal.checked?'status: insufficient_evidence':'amount: null'};refused++;}
        } else {
          const amt=[42000,35000,25000,40000][Math.floor(rnd()*4)];
          r={k:'inv',v:'amount: '+amt};invented++;
        }
        rows.push(r);
      }
      out.innerHTML='';
      out.appendChild(stats([
        ['invented values',invented+'/20',invented?'red':'ok'],
        ['parse failures',parsefail+'/20',parsefail?'red':'ok'],
        ['honest refusals',refused+'/20',refused?'ok':''],
        ['schema safe',invented+parsefail===0?'yes':'no',invented+parsefail?'red':'ok']
      ]));
      log.innerHTML='';
      log.appendChild(h('div',{class:'toks'},rows.map(r=>
        h('span',{class:'tok'+(r.k==='ok'?'':' alt'),text:r.v}))));
    }
    [nullable,refusal,constrained].forEach(c=>c.addEventListener('change',run));
    const cb=(n,l)=>h('label',{style:'display:flex;gap:.5rem;align-items:center;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:.85rem;color:var(--ink)'},
      [n,document.createTextNode(l)]);
    el.append(h('div',{style:'display:grid;gap:.45rem;margin-bottom:1rem'},[
      cb(constrained,'Constrained decoding (schema enforced by the provider)'),
      cb(nullable,'amount is nullable'),
      cb(refusal,'status enum includes insufficient_evidence')]),out,log);
    run();
  }};

LABS.agentloop={title:'Step through the loop',k:'lab 9.1',
  note:'The whole of agency: model asks, your code runs, result goes back. Break one thing at a time and watch which failure you get — including the one that matters most, where the agent narrates a success that never happened.',
  render(el){
    const vague=h('input',{type:'checkbox'}), fail=h('input',{type:'checkbox'});
    const nobudget=h('input',{type:'checkbox'});
    const out=h('div'),trace=h('div');
    function run(){
      const steps=[]; let status='ok',tokens=0,base=420;
      const push=(s,t,d)=>{tokens+=base+steps.length*180;steps.push([s,t,d]);};
      if(vague.checked){
        push('1','get_exchange_rate({"frm":"equipment","to":"INR"})','→ {"rate": null}');
        push('2','get_exchange_rate({"frm":"USD","to":"policy"})','→ {"rate": null}');
        push('3','final','"I was unable to determine the limit."');
        status='wrong-tool';
      } else if(fail.checked){
        push('1','get_exchange_rate({"frm":"USD","to":"INR"})','→ {"error":"service unavailable"}');
        push('2','get_policy_limit({"category":"equipment"})','→ {"limit": 60000}');
        push('3','final','"USD 300 is approximately INR 26,460 — within the INR 60,000 limit."');
        status='narrated';
      } else if(nobudget.checked){
        for(let i=1;i<=12;i++)
          push(String(i),'get_policy_limit({"category":"interstellar travel"})','→ {"limit": null}');
        push('…','budget would have stopped this at step 5','runaway');
        status='runaway';
      } else {

LABS.contextrot={title:'Needle in your haystack',k:'lab 10.1',
  note:'Recovery rate by depth, following the curve these models actually exhibit: strong at the edges, sagging in the middle, and worsening as the context grows. Note that the ceiling is never reached — degradation arrives long before capacity does.',
  render(el){
    const cv=h('canvas');cv.style.width='100%';
    const ln=h('span',{class:'readout',text:'32k'}); const out=h('div');
    let L=32;
    const recovery=(depth,len)=>{
      const stress=clamp((len-4)/200,0,1);
      const mid=1-Math.pow(Math.abs(depth-0.5)*2,1.7);       // 1 at middle, 0 at edges
      return clamp(1-stress*(0.15+0.62*mid),0,1);
    };
    function draw(){
      const w=cv.clientWidth||600,ht=190;cv.width=w*2;cv.height=ht*2;cv.style.height=ht+'px';
      const g=cv.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,w,ht);
      const cs=getComputedStyle(document.documentElement);
      const red=cs.getPropertyValue('--red').trim(),rule=cs.getPropertyValue('--rule').trim(),
            mut=cs.getPropertyValue('--muted').trim(),ok=cs.getPropertyValue('--verified').trim();
      const X=d=>34+d*(w-46),Y=v=>ht-24-v*(ht-46);
      g.strokeStyle=rule;g.lineWidth=1;
      [0,.25,.5,.75,1].forEach(v=>{g.beginPath();g.moveTo(34,Y(v));g.lineTo(w-8,Y(v));g.stroke();
        g.fillStyle=mut;g.font='9px ui-monospace,monospace';g.fillText((v*100)+'%',4,Y(v)+3);});
      g.strokeStyle=red;g.lineWidth=2;g.beginPath();
      for(let i=0;i<=100;i++){const d=i/100,y=Y(recovery(d,L));i?g.lineTo(X(d),y):g.moveTo(X(d),y);}
      g.stroke();
      [[.05,'5%'],[.5,'50%'],[.95,'95%']].forEach(([d,lbl])=>{
        const v=recovery(d,L);g.fillStyle=v>.8?ok:red;
        g.beginPath();g.arc(X(d),Y(v),4,0,7);g.fill();
        g.fillStyle=mut;g.font='9px ui-monospace,monospace';g.fillText(lbl,X(d)-8,ht-8);});
      out.innerHTML='';
      out.appendChild(stats([
        ['at 5% depth',(recovery(.05,L)*100).toFixed(0)+'%',recovery(.05,L)>.8?'ok':'red'],
        ['at 50% depth',(recovery(.5,L)*100).toFixed(0)+'%',recovery(.5,L)>.8?'ok':'red','the middle'],
        ['at 95% depth',(recovery(.95,L)*100).toFixed(0)+'%',recovery(.95,L)>.8?'ok':'red'],
        ['context used',L+'k','', 'ceiling not reached']]));
    }
    el.append(h('div',{class:'ctl'},[ctl('context length',
      (()=>{const s=slider(4,200,32,4,v=>{L=v;ln.textContent=v+'k';draw();});
        return h('div',{},[s,ln]);})())]),cv,out);
    setTimeout(draw,30);window.addEventListener('resize',draw);
  }};

/* Tracking engine. Pure logic, no DOM.
   Mastery with decay, SM-2 spaced repetition, calibration scoring,
   session construction, and the analytics the dashboard reads. */

window.ENG = (function(){
/* Content is loaded before boot and can be re-edited from the portal, so these
   are rebuilt on demand rather than captured when this file parses. The
   containers are mutated in place: views hold references to them. */
let ITEMS=[];
const byItem={}, bySkill={}, SK={};
function reinit(){
  const raw = window.ALL_ITEMS ||
    [].concat(window.ITEMS1||[], window.ITEMS2||[], window.ITEMS3||[]);
  ITEMS = raw.map(a=>({id:a[0], sk:a[1], diff:a[2], type:a[3],
                       stem:a[4], opts:a[5], ans:a[6], why:a[7]}));
  Object.keys(byItem).forEach(k=>delete byItem[k]);
  Object.keys(bySkill).forEach(k=>delete bySkill[k]);
  Object.keys(SK).forEach(k=>delete SK[k]);
  ITEMS.forEach(i=>{ byItem[i.id]=i; (bySkill[i.sk]=bySkill[i.sk]||[]).push(i); });
  (window.SKILLS||[]).forEach(s=>SK[s.id]=s);
}
reinit();

const DAY=86400000;
const now=()=>Date.now();
const days=(a,b)=>(b-a)/DAY;

/* ---------- mastery ---------- */
/* Raw mastery moves on evidence; displayed mastery decays with time since last
   practice, to a floor of 70% of raw. Decay is what puts a skill back in the
   review queue without pretending you forgot everything. */
function decayFactor(daysSince){
  if(daysSince<=3) return 1;
  return 1 - 0.30*(1 - Math.exp(-(daysSince-3)/45));
}
const blankSkill = () => ({m:0, n:0, ok:0, last:0, hist:[], peak:0});
/* Reading must not write. The dashboard and the matrix ask for all thirty
   skills on every render; creating a zeroed record for each one made the state
   look changed on a page view, which saved it, pushed it, and bumped the
   server's version for a device that had done nothing — and that version churn
   made other devices collide over work neither had done. */
function skillState(S, id){ return S.sk[id] || blankSkill(); }
/* The one place a record is meant to come into existence. */
function skillRecord(S, id){ return S.sk[id] || (S.sk[id] = blankSkill()); }
function shown(S, id){
  const st=skillState(S,id);
  if(!st.n) return 0;
  return Math.round(st.m * decayFactor(days(st.last, now())));
}
function levelOf(m){
  const B=window.LEVEL_BANDS;
  let L=0; for(let i=1;i<B.length;i++) if(m>=B[i]) L=i;
  return L;
}
function nextBand(m){
  const B=window.LEVEL_BANDS;
  for(let i=1;i<B.length;i++) if(m<B[i]) return B[i];
  return 100;
}

/* Gain is larger for harder items and smaller as mastery rises, so the last
   twenty points require analysis-level items rather than more recall items. */
function applyResult(S, item, correct){
  const st=skillRecord(S, item.sk);
  const head = Math.max(0, 100 - st.m) / 100;
  if(correct){
    const gain = (3.5 + item.diff*3.2) * (0.35 + 0.65*head);
    st.m = Math.min(100, st.m + gain);
  } else {
    const loss = (4.5 - item.diff*0.7) * (0.4 + 0.6*(st.m/100));
    st.m = Math.max(0, st.m - loss);
  }
  st.n++; if(correct) st.ok++;
  st.last = now();
  st.peak = Math.max(st.peak||0, st.m);
  const last = st.hist[st.hist.length-1];
  if(!last || now()-last.t > 6*3600000) st.hist.push({t:now(), m:Math.round(st.m)});
  else last.m = Math.round(st.m);
  if(st.hist.length>120) st.hist.splice(0, st.hist.length-120);
}

/* ---------- spaced repetition (SM-2, trimmed) ---------- */
function srs(S, itemId){
  return S.srs[itemId] || (S.srs[itemId]={ease:2.5, ivl:0, reps:0, due:0});
}
function scheduleItem(S, itemId, quality){   // quality 0..5
  const c=srs(S,itemId);
  if(quality<3){ c.reps=0; c.ivl=1; }
  else {
    c.reps++;
    if(c.reps===1) c.ivl=1;
    else if(c.reps===2) c.ivl=4;
    else c.ivl=Math.round(c.ivl*c.ease);
    c.ease = Math.max(1.3, c.ease + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
  }
  c.ivl = Math.min(c.ivl, 180);
  c.due = now() + c.ivl*DAY;
  c.seen = now();
  return c;
}
function dueList(S){
  const t=now();
  return ITEMS.filter(i=>{const c=S.srs[i.id]; return c && c.due && c.due<=t;});
}
function dueForecast(S, nDays){
  const out=new Array(nDays).fill(0);
  const t=now();
  ITEMS.forEach(i=>{const c=S.srs[i.id]; if(!c||!c.due)return;
    const d=Math.floor((c.due-t)/DAY);
    if(d<0) out[0]++; else if(d<nDays) out[d]++;});
  return out;
}

/* ---------- calibration ---------- */
const CONF=[0.25,0.50,0.75,0.95];
function recordCalibration(S, conf, correct){
  S.cal.push({t:now(), c:conf, k:correct?1:0});
  if(S.cal.length>800) S.cal.splice(0, S.cal.length-800);
}
function calibrationCurve(S){
  const buckets=CONF.map(c=>({c, n:0, ok:0}));
  S.cal.forEach(e=>{
    let bi=0, best=9;
    CONF.forEach((c,i)=>{const d=Math.abs(c-e.c); if(d<best){best=d;bi=i;}});
    buckets[bi].n++; buckets[bi].ok+=e.k;
  });
  return buckets.map(b=>({...b, rate: b.n? b.ok/b.n : null, gap: b.n? (b.ok/b.n)-b.c : null}));
}
function brier(S){
  if(!S.cal.length) return null;
  return S.cal.reduce((a,e)=>a+Math.pow(e.c-e.k,2),0)/S.cal.length;
}
function overconfidence(S){
  const cur=calibrationCurve(S).filter(b=>b.n>=3);
  if(!cur.length) return null;
  const w=cur.reduce((a,b)=>a+b.n,0);
  return cur.reduce((a,b)=>a+b.gap*b.n,0)/w;   // negative = overconfident
}

/* ---------- session construction ---------- */
function weakest(S, n){
  return window.SKILLS
    .map(s=>({s, m:shown(S,s.id), st:skillState(S,s.id)}))
    .sort((a,b)=>{
      if(!a.st.n && b.st.n) return -1;
      if(a.st.n && !b.st.n) return 1;
      return a.m-b.m;
    }).slice(0,n);
}
function pickItems(S, pool, n){
  /* prefer unseen, then least-recently-seen, then harder items as mastery rises */
  const scored = pool.map(i=>{
    const c=S.srs[i.id];
    const seen = c && c.seen ? days(c.seen, now()) : 999;
    const m = shown(S, i.sk);
    const fit = 1 - Math.abs((m/100) - (i.diff-1)/2) * 0.5;   // match difficulty to level
    return {i, score: seen*0.6 + fit*40 + Math.random()*8};
  }).sort((a,b)=>b.score-a.score);
  return scored.slice(0,n).map(x=>x.i);
}
function buildSession(S, mode, opts){
  opts=opts||{};
  const n=opts.n||10;
  if(mode==='due'){
    const d=dueList(S);
    return d.slice(0, Math.max(n, Math.min(d.length, 25)));
  }
  if(mode==='skill'){
    return pickItems(S, bySkill[opts.skill]||[], n);
  }
  if(mode==='domain'){
    const ids=window.SKILLS.filter(s=>s.d===opts.domain).map(s=>s.id);
    return pickItems(S, ITEMS.filter(i=>ids.includes(i.sk)), n);
  }
  if(mode==='weak'){
    const w=weakest(S,6).map(x=>x.s.id);
    return pickItems(S, ITEMS.filter(i=>w.includes(i.sk)), n);
  }
  if(mode==='analysis'){
    return pickItems(S, ITEMS.filter(i=>i.diff===3), n);
  }
  if(mode==='exam'){
    /* one item per skill where possible, difficulty-weighted */
    const out=[];
    window.SKILLS.forEach(s=>{
      const p=bySkill[s.id]||[];
      if(p.length) out.push(pickItems(S,p,1)[0]);
    });
    return out.filter(Boolean);
  }
  if(mode==='diagnostic'){
    /* short placement: 2 per domain, mid difficulty, biased to untested skills */
    const out=[];
    window.DOMAINS.forEach(d=>{
      const ids=window.SKILLS.filter(s=>s.d===d.id).map(s=>s.id);
      const p=ITEMS.filter(i=>ids.includes(i.sk) && i.diff>=2);
      out.push(...pickItems(S,p,3));
    });
    return out;
  }
  return pickItems(S, ITEMS, n);   // mixed
}

/* ---------- grading ---------- */
function grade(item, response){
  if(item.type==='mcq') return response===item.ans;
  if(item.type==='multi'){
    if(!Array.isArray(response)) return false;
    const a=[...item.ans].sort().join(','), b=[...response].sort().join(',');
    return a===b;
  }
  if(item.type==='num'){
    const v=parseFloat(response); if(isNaN(v)) return false;
    const [target,tolPct]=item.ans;
    return Math.abs(v-target) <= Math.abs(target)*(tolPct/100) + 1e-9;
  }
  if(item.type==='order'){
    if(!Array.isArray(response)) return false;
    return response.join(',')===item.ans.join(',');
  }
  return null;   // judge items are self-scored
}

/* ---------- recording ---------- */
function submit(S, item, response, conf, ms, selfScore){
  let correct;
  if(item.type==='judge') correct = selfScore>=2;      // 0-3 self score
  else correct = grade(item, response);
  applyResult(S, item, correct);
  const q = correct ? (conf>=0.75?5:4) : (conf>=0.75?1:2);
  scheduleItem(S, item.id, q);
  if(item.type!=='judge') recordCalibration(S, conf, correct);
  S.att.push({t:now(), i:item.id, sk:item.sk, k:correct?1:0, c:conf, ms, d:item.diff});
  if(S.att.length>2000) S.att.splice(0, S.att.length-2000);
  return correct;
}

/* ---------- analytics ---------- */
function accuracyByDay(S, nDays){
  const t=now(), out=[];
  for(let d=nDays-1; d>=0; d--){
    const lo=t-(d+1)*DAY, hi=t-d*DAY;
    const a=S.att.filter(x=>x.t>lo&&x.t<=hi);
    out.push({d, n:a.length, ok:a.reduce((s,x)=>s+x.k,0)});
  }
  return out;
}
function streak(S){
  const set=new Set(S.att.map(x=>Math.floor(x.t/DAY)));
  (S.sess||[]).forEach(s=>set.add(Math.floor(s.t/DAY)));
  let d=Math.floor(now()/DAY), n=0;
  if(!set.has(d)) d--;                       // today not yet practised is fine
  while(set.has(d)){ n++; d--; }
  return n;
}
function domainMastery(S){
  return window.DOMAINS.map(dm=>{
    const sk=window.SKILLS.filter(s=>s.d===dm.id);
    const vals=sk.map(s=>shown(S,s.id));
    const tested=sk.filter(s=>skillState(S,s.id).n>0).length;
    return {...dm, m: vals.reduce((a,b)=>a+b,0)/sk.length, tested, total:sk.length};
  });
}
function overall(S){
  const vals=window.SKILLS.map(s=>shown(S,s.id));
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function velocity(S){
  /* Mastery points gained in the last 7 days vs the 7 before.
     The baseline is the last reading at or before the window opens — sampling
     only points inside the window reads zero whenever nothing was logged in it. */
  const t=now();
  const at=(hist,when)=>{
    let v=null;
    for(const p of hist){ if(p.t<=when) v=p.m; else break; }
    return v;
  };
  const gain=(lo,hi)=>{
    let g=0;
    window.SKILLS.forEach(s=>{
      const hs=skillState(S,s.id).hist;
      if(!hs.length) return;
      const start = at(hs,lo);
      const end = at(hs,hi);
      if(end==null) return;
      g += end - (start==null ? 0 : start);
    });
    return g;
  };
  return {now:gain(t-7*DAY,t), prev:gain(t-14*DAY,t-7*DAY)};
}
function timeInvested(S){
  const ms=S.att.reduce((a,x)=>a+(x.ms||0),0);
  const ex=Object.values(S.ex||{}).reduce((a,e)=>a+(e.iters||[]).length*0,0);
  return ms;
}
function recommend(S){
  /* the single next action — what the dashboard leads with */
  const out=[];
  const d=dueList(S).length;
  const untested=window.SKILLS.filter(s=>!skillState(S,s.id).n).length;
  if(untested===window.SKILLS.length)
    out.push({k:'diagnostic', t:'Take the placement check', d:'18 questions across all six domains. It sets your starting profile so everything after it is measured against something.', h:'#/practice/diagnostic'});
  if(d>0)
    out.push({k:'due', t:d+' item'+(d>1?'s':'')+' due for review', d:'Spaced repetition keeps mastery from decaying. This is the shortest useful session you can run.', h:'#/practice/due'});
  const w=weakest(S,3).filter(x=>skillState(S,x.s.id).n>0);
  if(w.length && w[0].m<70)
    out.push({k:'weak', t:'Drill your weakest skills', d:'Currently '+w.map(x=>x.s.n).join(', ')+'.', h:'#/practice/weak'});
  if(untested>0 && untested<window.SKILLS.length)
    out.push({k:'gap', t:untested+' skills still untested', d:'Untested is not the same as weak — you cannot tell which until you measure.', h:'#/skills'});
  const nextEx=readyExercise(S);
  if(nextEx)
    out.push({k:'ex', t:'Exercise: '+nextEx.t, d:nextEx.brief.slice(0,120)+'…', h:'#/exercises#'+nextEx.id});
  return out;
}
function readyExercise(S){
  return window.EXERCISES.find(e=>{
    const st=(S.ex||{})[e.id];
    if(st && st.iters && st.iters.length) return false;
    if(e.needs){ const p=(S.ex||{})[e.needs]; if(!p||!p.iters||!p.iters.length) return false; }
    return true;
  });
}
function exScore(e, iter){
  if(!iter || !iter.r) return null;
  const vals=e.rubric.map((_,i)=>iter.r[i]).filter(v=>typeof v==='number');
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/(e.rubric.length*3)*100);
}

return {get ITEMS(){return ITEMS;}, byItem, bySkill, SK, DAY, reinit,
  shown, levelOf, nextBand, skillState, decayFactor,
  buildSession, grade, submit, scheduleItem, srs, dueList, dueForecast,
  calibrationCurve, brier, overconfidence, CONF,
  accuracyByDay, streak, domainMastery, overall, velocity, timeInvested,
  weakest, recommend, readyExercise, exScore};
})();

/* Durability layer.

   localStorage alone is per-origin, per-device, and disappears when someone
   clears site data — so progress gets three defences:
     1. a rolling local backup taken at the start of every session
     2. export / import of a plain JSON file (works anywhere, needs no account)
     3. optional sync to a *private* GitHub Gist, which gives cross-device
        continuity with no server and no cost

   Gist sync talks straight from the browser to api.github.com. That request is
   blocked by the Content-Security-Policy inside a Claude Artifact, so sync only
   works on the hosted build; the UI says so rather than failing silently. */

window.SYNC = (function(){
const FILE = 'ai-from-zero-progress.json';
const API  = 'https://api.github.com';
const KEY  = () => (window.STORE && window.STORE.KEY) || 'aifz2027';
const GKEY = () => KEY() + ':gh';
const BKEY = () => KEY() + ':bak';

/* ---------- local backup ---------- */
function takeSessionBackup(){
  try{
    const cur = localStorage.getItem(KEY());
    if(!cur) return;
    JSON.parse(cur);                              // only back up parseable state
    localStorage.setItem(BKEY(), JSON.stringify({at:Date.now(), data:cur}));
  }catch(e){}
}
function backupInfo(){
  try{
    const raw = localStorage.getItem(BKEY());
    if(!raw) return null;
    const b = JSON.parse(raw);
    return {at:b.at, bytes:b.data.length};
  }catch(e){ return null; }
}
function restoreBackup(){
  const raw = localStorage.getItem(BKEY());
  if(!raw) throw new Error('No backup found.');
  const b = JSON.parse(raw);
  JSON.parse(b.data);
  if(window.STORE) window.STORE.suspend();
  localStorage.setItem(KEY(), b.data);
  return b.at;
}

/* ---------- export / import ---------- */
function snapshot(){
  return {app:'ai-from-zero', v:1, exportedAt:Date.now(),
    data: window.STORE ? window.STORE.S : JSON.parse(localStorage.getItem(KEY())||'{}')};
}
function exportText(){
  if(window.STORE) window.STORE.flush();
  return JSON.stringify(snapshot(), null, 2);
}
function exportName(){
  return 'ai-from-zero-' + new Date().toISOString().slice(0,10) + '.json';
}
/* Some hosts (the Claude artifact viewer among them) never grant a page
   download permission, so a link click is inert. Callers must offer the
   clipboard path as well — see canDownload. */
function exportFile(){
  const s = exportText();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([s],{type:'application/json'}));
  a.download = exportName();
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},0);
  return s.length;
}
function canDownload(){
  /* the artifact viewer runs the page in a sandboxed frame without downloads */
  try{
    if(window.self !== window.top) return false;
  }catch(e){ return false; }
  return 'download' in document.createElement('a');
}
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text); return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove();
    return ok;
  }catch(e){ return false; }
}
function parsePayload(text){
  const j = JSON.parse(text);
  const data = j && j.app === 'ai-from-zero' ? j.data : j.data ? j.data : j;
  if(!data || typeof data !== 'object' || !('sk' in data || 'done' in data))
    throw new Error('That file does not look like AI From Zero progress.');
  return {data, exportedAt: j.exportedAt || 0};
}
function applyState(data){
  takeSessionBackup();                             // never overwrite without a copy
  if(window.STORE) window.STORE.suspend();         // stop the stale in-memory copy writing back
  localStorage.setItem(KEY(), JSON.stringify(data));
}
function importText(text){
  const {data} = parsePayload(text);
  applyState(data);
  return summarise(data);
}
function summarise(d){
  const skills = Object.values(d.sk||{}).filter(s=>s.n>0).length;
  return {skills, attempts:(d.att||[]).length, chapters:Object.keys(d.done||{}).length,
    exercises:Object.keys(d.ex||{}).length, updatedAt:d.updatedAt||0};
}

/* ---------- storage diagnostics ---------- */
function usable(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }
  catch(e){ return false; }
}
function stats(){
  let bytes = 0;
  try{ bytes = (localStorage.getItem(KEY())||'').length; }catch(e){}
  const d = window.STORE ? window.STORE.S : {};
  return {ok:usable(), bytes, backup:backupInfo(), summary:summarise(d),
    origin: location.origin === 'null' ? 'local file' : location.origin,
    persistent: null};
}
/* Ask the browser to exempt this origin from storage eviction. */
function requestPersistence(){
  if(navigator.storage && navigator.storage.persist) return navigator.storage.persist();
  return Promise.resolve(false);
}

/* ---------- GitHub Gist sync ---------- */
function ghConfig(){
  try{ return JSON.parse(localStorage.getItem(GKEY())||'{}'); }catch(e){ return {}; }
}
function ghSave(c){ localStorage.setItem(GKEY(), JSON.stringify(c)); }
function ghClear(){ localStorage.removeItem(GKEY()); }

async function ghCall(path, opts){
  const c = ghConfig();
  if(!c.token) throw new Error('No token saved.');
  let r;
  try{
    r = await fetch(API + path, Object.assign({
      headers:{ 'Authorization':'Bearer ' + c.token,
                'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28' }
    }, opts||{}));
  }catch(e){
    throw new Error('Could not reach api.github.com. Inside the Claude artifact this ' +
      'is blocked by its content policy — sync works on the hosted version.');
  }
  if(r.status === 401) throw new Error('GitHub rejected the token (401). It may be expired or lack the gist scope.');
  if(r.status === 403) throw new Error('GitHub refused the request (403). Check the token has gist read and write.');
  if(r.status === 404) throw new Error('Gist not found (404). It may have been deleted — disconnect and reconnect to make a new one.');
  if(!r.ok) throw new Error('GitHub returned ' + r.status + '.');
  return r.json();
}

async function ghVerify(token){
  const r = await fetch(API + '/user', {headers:{
    'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json'}});
  if(!r.ok) throw new Error('Token rejected (' + r.status + ').');
  const u = await r.json();
  return u.login;
}

/* A second device knows the token but not the gist id, so find the existing one
   rather than creating a rival. Without this, setting up a phone would make a new
   empty gist and the laptop's record would be orphaned. */
async function ghFindGist(){
  const list = await ghCall('/gists?per_page=100');
  if(!Array.isArray(list)) return null;
  const hit = list.find(g => g && g.files && g.files[FILE]);
  return hit ? hit.id : null;
}

/* Connecting must never blindly upload: on a fresh device that would push an
   empty state over everything already synced. Adopt first, decide second. */
async function ghConnect(token, auto){
  ghSave({token: token, auto: !!auto});
  let login;
  try{ login = await ghVerify(token); }
  catch(e){ ghClear(); throw e; }
  let id;
  try{ id = await ghFindGist(); }
  catch(e){ ghClear(); throw e; }

  const local = window.STORE ? window.STORE.S : {};
  if(id){
    const c = ghConfig(); c.gistId = id; ghSave(c);
    const rem = await ghRemote();
    const remoteHasWork = rem && !isEmptyState(rem.data);
    if(remoteHasWork && isEmptyState(local)){
      takeSessionBackup();
      if(window.STORE && window.STORE.replace){
        window.STORE.replace(rem.data); markSynced();
        return {login, action:'pulled', summary:rem.summary};
      }
      return {login, action:'behind', summary:rem.summary};
    }
    if(remoteHasWork && !isEmptyState(local))
      return {login, action:'conflict', summary:rem.summary};
    await ghPush();
    return {login, action:'pushed'};
  }
  await ghPush();
  return {login, action:'created'};
}

async function ghPush(){
  if(window.STORE) window.STORE.flush();
  const c = ghConfig();
  const content = JSON.stringify(snapshot(), null, 2);
  const files = {}; files[FILE] = {content};
  let g;
  if(c.gistId){
    g = await ghCall('/gists/' + c.gistId, {method:'PATCH', body:JSON.stringify({files})});
  } else {
    g = await ghCall('/gists', {method:'POST', body:JSON.stringify({
      description:'AI From Zero — skill tracker progress (private)',
      public:false, files})});
    c.gistId = g.id;
  }
  c.lastPushAt = Date.now();
  ghSave(c);
  markSynced();
  return {id:c.gistId, url:g.html_url, bytes:content.length, at:Date.now()};
}

async function ghRemote(){
  const c = ghConfig();
  if(!c.gistId) return null;
  const g = await ghCall('/gists/' + c.gistId);
  const f = g.files && g.files[FILE];
  if(!f) throw new Error('The gist has no ' + FILE + ' file.');
  let text = f.content;
  if(f.truncated && f.raw_url){
    const r = await fetch(f.raw_url); text = await r.text();
  }
  const p = parsePayload(text);
  return {exportedAt:p.exportedAt, summary:summarise(p.data), data:p.data,
    updatedAt:g.updated_at, url:g.html_url};
}

async function ghPull(){
  const rem = await ghRemote();
  if(!rem) throw new Error('Nothing synced yet — push first.');
  applyState(rem.data);
  const c = ghConfig();
  c.lastPullAt = Date.now();
  c.syncedAt = rem.data.updatedAt || 0;      // STORE is suspended; mark from the payload
  c.lastSync = Date.now();
  ghSave(c);
  return rem.summary;
}

/* Has this device moved since the last successful sync?
   Compared by exact marker, not by clock: a time tolerance either swallows real
   changes made moments after a sync, or reports phantom ones. `syncedAt` records
   the precise S.updatedAt value that was last pushed or pulled. */
function markSynced(){
  const c = ghConfig();
  const d = window.STORE ? window.STORE.S : {};
  c.syncedAt = d.updatedAt || 0;
  c.lastSync = Date.now();
  ghSave(c);
}
/* A device with nothing on it cannot lose anything, so pulling into it is always
   safe — this is the ordinary "set up my phone" case, where there is no sync
   marker yet and the general rule would otherwise cry conflict. */
function isEmptyState(d){
  if(!d) return true;
  if((d.att||[]).length) return false;
  if(Object.values(d.sk||{}).some(s=>s && s.n>0)) return false;
  if(Object.values(d.notes||{}).some(v=>v && String(v).trim())) return false;
  if(Object.keys(d.ex||{}).length) return false;
  if(Object.keys(d.proc||{}).length) return false;
  if((d.pred||[]).length) return false;
  if(Object.keys(d.marks||{}).some(k=>d.marks[k])) return false;
  /* Reading is work too. Chapters marked done, chapter self-grades, parked
     LATER questions, the system card, glossary drills and reading sittings are
     all things a person would be dismayed to lose, so a record holding only
     those is not an empty one. */
  if(Object.keys(d.done||{}).some(k=>d.done[k])) return false;
  if(Object.keys(d.grades||{}).some(k=>d.grades[k])) return false;
  if(Object.keys(d.later||{}).some(k=>d.later[k])) return false;
  if(Object.keys(d.card||{}).some(k=>d.card[k])) return false;
  if(Object.keys(d.drill||{}).some(k=>d.drill[k])) return false;
  if((d.sittings||[]).length) return false;
  if(Object.values(d.cp||{}).some(v=>v && String(v.v||'').trim())) return false;
  return true;
}
function localChangedSinceSync(){
  const c = ghConfig();
  const d = window.STORE ? window.STORE.S : {};
  if(!c.lastSync) return true;
  return (d.updatedAt || 0) !== (c.syncedAt || 0);
}

/* Push on the way out. keepalive lets the request outlive the page, which a
   plain fetch does not; sendBeacon cannot carry an Authorization header. */
function pushOnExit(){
  const c = ghConfig();
  if(!c.token || !c.auto || !c.gistId) return;
  if(!localChangedSinceSync()) return;
  try{
    const files = {}; files[FILE] = {content: exportText()};
    fetch(API + '/gists/' + c.gistId, {
      method:'PATCH', keepalive:true, body:JSON.stringify({files}),
      headers:{'Authorization':'Bearer ' + c.token,
               'Accept':'application/vnd.github+json'}});
    markSynced();
  }catch(e){}
}

/* Runs once on load when sync is connected.
     remote ahead, local untouched since last sync  → pull silently (lossless)
     local ahead, remote unchanged                  → push
     both moved                                     → conflict, hand it to the user
   Returns a status the toolbar renders. */
async function autoSync(){
  const c = ghConfig();
  if(!c.token) return {state:'off'};
  if(!c.gistId){
    try{ await ghPush(); return {state:'synced', at:Date.now()}; }
    catch(e){ return {state:'error', msg:e.message}; }
  }
  let rem;
  try{ rem = await ghRemote(); }
  catch(e){ return {state:'error', msg:e.message}; }
  if(!rem) return {state:'error', msg:'Gist is empty.'};

  const local = window.STORE ? window.STORE.S : {};
  const localEmpty = isEmptyState(local);
  const localMoved = !localEmpty && localChangedSinceSync();
  const remoteAhead = localEmpty
    ? !isEmptyState(rem.data)
    : (rem.exportedAt || 0) > (local.updatedAt || 0);

  if(remoteAhead && !localMoved){
    if(window.STORE && window.STORE.replace){
      takeSessionBackup();
      window.STORE.replace(rem.data);
      markSynced();
      return {state:'pulled', at:Date.now(), summary:rem.summary};
    }
    return {state:'behind', summary:rem.summary};
  }
  if(remoteAhead && localMoved) return {state:'conflict', summary:rem.summary};
  if(localMoved && c.auto){
    try{ await ghPush(); return {state:'pushed', at:Date.now()}; }
    catch(e){ return {state:'error', msg:e.message}; }
  }
  return {state:'synced', at:c.lastSync};
}

return {takeSessionBackup, backupInfo, restoreBackup,
        exportFile, exportText, exportName, canDownload, copyText,
        importText, snapshot, summarise,
        stats, usable, requestPersistence,
        /* entry points the app calls on boot and on the way out */
        autoSync, pushOnExit, markSynced, isEmptyState,
        gh:{config:ghConfig, save:ghSave, clear:ghClear, verify:ghVerify,
            connect:ghConnect, find:ghFindGist,
            push:ghPush, pull:ghPull, remote:ghRemote, localChangedSinceSync}};
})();

function ring(v){
  const c=h('canvas',{width:'220',height:'220',class:'ringc'});
  setTimeout(()=>{
    const g=c.getContext('2d'); const cs=getComputedStyle(document.documentElement);
    const rule=cs.getPropertyValue('--rule').trim(), ok=cs.getPropertyValue('--verified').trim();
    const red=cs.getPropertyValue('--red').trim(), ink=cs.getPropertyValue('--ink').trim();
    g.clearRect(0,0,220,220);
    g.lineWidth=14; g.lineCap='round';
    g.strokeStyle=rule; g.beginPath(); g.arc(110,110,86,0,Math.PI*2); g.stroke();
    g.strokeStyle = v>=70?ok : v>=45?ink : red;
    g.beginPath(); g.arc(110,110,86,-Math.PI/2,-Math.PI/2+Math.PI*2*(v/100)); g.stroke();
    g.fillStyle=ink; g.textAlign='center';
    g.font='600 46px ui-monospace,monospace'; g.fillText(Math.round(v),110,122);
  },30);
  return c;
}
function dayBars(acc){
  const wrap=h('div',{class:'daybars'});
  acc.forEach(d=>{
    const r=d.n? d.ok/d.n : null;
    const bar=h('span',{class:'db'+(d.n?'':' empty'),

    }
    wrap.appendChild(bar);
  });
  return wrap;
}

/* ================= PRACTICE RUNNER ================= */
/* One question, asked properly.

   The same ask -> commit -> verdict -> explanation loop wherever a question
   appears: in a drill, and inline in the middle of a chapter. Sharing it is the
   whole point — a question met while reading is the same measured thing as one
   met in a drill. It moves the same mastery, enters the same review schedule,
   and lands in the same calibration record. There is no such thing here as a
   question that does not count. */
function questionCard(it, o){
  o = o || {};
  const st=S(), eng=E();
  const card=h('div',{class:'qcard'+(o.inline?' inline':'')});
  if(!it){ card.appendChild(h('p',{class:'empty',text:'That question is not in the bank.'})); return card; }
  const sk=eng.SK[it.sk];
  const qt0=Date.now();

  const meta=h('div',{class:'qmeta'});
  if(o.showSkill!==false && sk) meta.appendChild(h('a',{class:'pill',href:'#/skill/'+sk.id,text:sk.n}));
  meta.appendChild(h('span',{class:'pill d'+it.diff,
    text:['recall','application','analysis'][it.diff-1]}));
  card.appendChild(meta);
  card.appendChild(h('div',{class:'qstem',html:it.stem}));

  let response=null, conf=null;
  const body=h('div',{class:'qbody'});

  if(it.type==='mcq'){
    it.opts.forEach((op,i)=>{
      const b=h('button',{class:'opt',onclick:()=>{response=i;
        [...body.querySelectorAll('.opt')].forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel'); enable();}},
        [h('span',{class:'ok',text:String.fromCharCode(65+i)}),h('span',{html:op})]);
      body.appendChild(b);
    });
  } else if(it.type==='multi'){
    response=[];
    card.appendChild(h('p',{class:'qhint',text:'Select all that apply.'}));
    it.opts.forEach((op,i)=>{
      const b=h('button',{class:'opt',onclick:()=>{
        const p=response.indexOf(i);
        if(p<0){response.push(i);b.classList.add('sel');}else{response.splice(p,1);b.classList.remove('sel');}
        enable();}},[h('span',{class:'ok',text:'✓'}),h('span',{html:op})]);
      body.appendChild(b);
    });
  } else if(it.type==='num'){
    const inp=h('input',{type:'number',step:'any',placeholder:it.opts[1]||'Your answer'});
    inp.addEventListener('input',()=>{response=inp.value;enable();});
    body.appendChild(h('div',{class:'numrow'},[inp,h('span',{class:'unit',text:it.opts[0]||''})]));
    if(it.opts[1])body.appendChild(h('p',{class:'qhint',text:it.opts[1]}));
  } else if(it.type==='order'){
    response=[];
    card.appendChild(h('p',{class:'qhint',text:'Click in order, highest first.'}));
    const pool=h('div',{class:'orderpool'});
    it.opts.forEach((op,i)=>{
      const b=h('button',{class:'opt',onclick:()=>{
        if(response.includes(i))return;
        response.push(i); b.classList.add('sel');
        b.querySelector('.ok').textContent=response.length; enable();}},
        [h('span',{class:'ok',text:'·'}),h('span',{html:op})]);
      pool.appendChild(b);
    });
    body.appendChild(pool);
    body.appendChild(h('button',{class:'sm',style:'margin-top:.5rem',onclick:()=>{
      response=[];[...pool.querySelectorAll('.opt')].forEach(x=>{x.classList.remove('sel');
        x.querySelector('.ok').textContent='·';});enable();}},'Reset order'));
  } else if(it.type==='judge'){
    const ta=h('textarea',{rows:o.inline?5:6,
      placeholder:'Write your answer before revealing the model answer. Rough is fine — this is judged on reasoning, not polish.'});
    ta.addEventListener('input',()=>{response=ta.value;enable();});
    body.appendChild(ta);
  }
  card.appendChild(body);

  const confRow=h('div',{class:'confrow'},[h('span',{class:'clab',text:'How sure are you?'})]);
  ['Guessing','Leaning','Fairly sure','Certain'].forEach((l,i)=>{
    const b=h('button',{class:'sm conf',onclick:()=>{conf=eng.CONF[i];
      [...confRow.querySelectorAll('.conf')].forEach(x=>x.classList.remove('on'));
      b.classList.add('on');enable();}},l);
    confRow.appendChild(b);
  });
  card.appendChild(confRow);

  const go=h('button',{class:'primary big',disabled:'true',onclick:()=>reveal()},
    it.type==='judge'?'Reveal model answer':'Submit');
  card.appendChild(go);

  function enable(){
    const has = it.type==='multi'||it.type==='order' ? response.length>0
      : it.type==='judge' ? (response||'').trim().length>10
      : response!==null && response!=='';
    go.disabled = !(has && conf!=null);
  }

  function reveal(){
    const ms=Date.now()-qt0;
    go.remove(); confRow.remove();
    card.querySelectorAll('button,input,textarea').forEach(x=>x.disabled=true);

    if(it.type==='judge'){
      card.appendChild(h('div',{class:'model'},[
        h('span',{class:'lbl',text:'Model answer'}),h('p',{html:it.ans})]));
      const sc=h('div',{class:'selfscore'},[h('span',{class:'clab',text:'How did yours compare?'})]);
      ['Missed it','Partial','Solid','Sharper than the model'].forEach((l,i)=>{
        sc.appendChild(h('button',{class:'sm',onclick:()=>{
          const ok=eng.submit(st,it,response,conf,ms,i);
          save(); sc.remove(); if(o.onAnswered)o.onAnswered(ok,it,conf); after(ok);}},l));
      });
      card.appendChild(sc);
      return;
    }

    const ok=eng.submit(st,it,response,conf,ms,null);
    save();
    const opts=[...card.querySelectorAll('.opt')];
    if(it.type==='mcq') opts.forEach((x,i)=>{
      if(i===it.ans)x.classList.add('right');
      else if(i===response)x.classList.add('wrong');});
    if(it.type==='multi') opts.forEach((x,i)=>{
      if(it.ans.includes(i))x.classList.add('right');
      else if(response.includes(i))x.classList.add('wrong');});
    if(it.type==='order') opts.forEach((x,i)=>{
      x.querySelector('.ok').textContent=it.ans.indexOf(i)+1;
      x.classList.add(response[it.ans.indexOf(i)]===i?'right':'wrong');});
    if(o.onAnswered)o.onAnswered(ok,it,conf);
    after(ok);
  }

  function after(ok){
    card.appendChild(h('div',{class:'verdict '+(ok?'good':'bad')},[
      h('span',{class:'vt',text:ok?'Correct':'Not quite'}),
      it.type==='num'&&!ok?h('span',{class:'vs',text:'Answer: '+it.ans[0]+' (±'+it.ans[1]+'%)'}):null,
      conf>=0.75&&!ok?h('span',{class:'vs',text:'— and you were confident. Worth noting.'}):null,
      conf<=0.5&&ok?h('span',{class:'vs',text:'— correct but unsure. Also worth noting.'}):null]));
    if(it.why) card.appendChild(h('div',{class:'why'},[
      h('span',{class:'lbl',text:'Why'}),h('p',{html:it.why})]));
    if(o.onNext) card.appendChild(h('button',{class:'primary big',onclick:o.onNext},
      o.nextLabel||'Next question'));
    if(o.scrollOnReveal) card.scrollIntoView({block:'start'});
    if(o.onSettled) o.onSettled(ok);
    if(window.updateProgress) window.updateProgress();
  }

  enable();
  return card;
}

function practice(mode, arg){
  const st=S(), eng=E();
  const w=h('div',{class:'wrap'});
  const items=eng.buildSession(st, mode, {skill:arg, domain:arg,
    n: mode==='exam'?30 : mode==='diagnostic'?18 : 10});
  if(!items.length){
    w.appendChild(phead('Practice','Nothing queued',
      'No items match this session type right now. Try a mixed set, or come back when reviews fall due.'));
    w.appendChild(h('a',{class:'chip',href:'#/practice',text:'← Practice modes'}));
    return w;
  }

  const TITLES={diagnostic:'Placement check',due:'Review — due today',weak:'Weakest skills',
    exam:'Full assessment',analysis:'Analytical items only',mixed:'Mixed practice',
    skill:'Skill drill',domain:'Domain drill'};
  let idx=0, correctN=0, t0=Date.now();
  const before={}; window.SKILLS.forEach(s=>before[s.id]=eng.shown(st,s.id));
  const results=[];

  const bar=h('div',{class:'qbar'},[h('i')]);
  const head=h('div',{class:'qhead'},[
    h('span',{class:'qcount'}), h('span',{class:'qtitle',text:TITLES[mode]||'Practice'}),
    h('button',{class:'sm',onclick:()=>{if(confirm('End this session? Answers so far are already saved.'))finish();}},'End')]);
  const stage=h('div',{class:'stage'});
  w.append(h('div',{class:'qwrap'},[head,bar,stage]));

  function render(){
    const it=items[idx];
    stage.innerHTML='';
    bar.querySelector('i').style.width=(idx/items.length*100)+'%';
    head.querySelector('.qcount').textContent=(idx+1)+' / '+items.length;
    stage.appendChild(questionCard(it,{
      onAnswered:(ok,item,c)=>{ results.push({it:item, ok, conf:c}); if(ok)correctN++; },
      nextLabel: idx+1>=items.length?'See results':'Next question',
      onNext:()=>{ idx++; if(idx>=items.length)finish(); else render(); },
      scrollOnReveal:true
    }));
  }

  function finish(){
    const mins=Math.round((Date.now()-t0)/60000);
    st.sess.push({t:Date.now(),mode,n:results.length,ok:correctN,ms:Date.now()-t0});
    save();
    stage.innerHTML=''; bar.querySelector('i').style.width='100%';
    head.querySelector('.qcount').textContent='done';
    const rate=results.length?Math.round(correctN/results.length*100):0;
    stage.appendChild(h('div',{class:'donehead'},[
      h('div',{class:'bigscore',text:correctN+'/'+results.length}),
      h('p',{class:'donesub',text:rate+'% correct · '+(mins||'<1')+' min'})]));

    /* skill movement */
    const moved=window.SKILLS.map(s=>({s,b:before[s.id],a:eng.shown(st,s.id)}))
      .filter(x=>Math.abs(x.a-x.b)>=1).sort((a,b)=>(b.a-b.b)-(a.a-a.b));
    if(moved.length){
      stage.appendChild(h('h3',{class:'sec2',text:'Skills that moved'}));
      stage.appendChild(h('div',{class:'moves'},moved.map(x=>{
        const d=x.a-x.b;
        return h('div',{class:'move'},[
          h('span',{class:'mn',text:x.s.n}),
          meter(x.a, x.a>=70?'ok':x.a>=45?'':'low'),
          h('span',{class:'md '+(d>0?'up':'down'),text:(d>0?'+':'')+Math.round(d)})]);
      })));
    }
    /* misses */
    const misses=results.filter(r=>!r.ok);
    if(misses.length){
      stage.appendChild(h('h3',{class:'sec2',text:'Review these'}));
      stage.appendChild(h('div',{class:'marks'},misses.map(r=>{
        const sk=eng.SK[r.it.sk];
        return h('div',{class:'mark got'},[
          h('span',{class:'mc',text:sk.id}),
          h('span',{class:'mt'},[h('span',{html:r.it.stem}),
            h('div',{class:'dim',style:'font-size:.78rem;margin-top:.2rem',
              text:sk.n+' · chapters '+sk.ch.join(', ')})]),
          h('a',{class:'chip',href:'#/skill/'+sk.id,text:'Skill'})]);
      })));
    }
    const overconf=results.filter(r=>!r.ok&&r.conf>=0.75).length;
    if(overconf>=2) stage.appendChild(h('div',{class:'callout'},[
      h('span',{class:'lbl',text:'Calibration note'}),
      h('p',{text:'You were confident and wrong on '+overconf+' items in this session. That pattern is more useful than the score — it tells you which of your intuitions to stop trusting.'})]));

    stage.appendChild(h('div',{style:'display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.5rem'},[
      h('a',{class:'chip',style:'padding:.5rem .9rem',href:'#/',text:'← Dashboard'}),
      h('a',{class:'chip',style:'padding:.5rem .9rem',href:'#/analytics',text:'Analytics'}),
      h('button',{class:'primary',onclick:()=>{location.hash='#/practice/'+mode+(arg?'/'+arg:'');
        setTimeout(()=>location.reload(),40);}},'Another set')]));
    window.scrollTo(0,0);
  }

  render();
  return w;
}

function trendChart(hist){
  const c=h('canvas'); c.style.width='100%';
  setTimeout(()=>{
    const wd=c.clientWidth||600, ht=140;
    c.width=wd*2; c.height=ht*2; c.style.height=ht+'px';
    const g=c.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.clearRect(0,0,wd,ht);
    const cs=getComputedStyle(document.documentElement);
    const rule=cs.getPropertyValue('--rule').trim(), ok=cs.getPropertyValue('--verified').trim();
    const mut=cs.getPropertyValue('--muted').trim();
    const X=i=>26+(i/Math.max(1,hist.length-1))*(wd-34);
    const Y=v=>ht-18-(v/100)*(ht-30);
    g.strokeStyle=rule; g.lineWidth=1;
    [0,50,100].forEach(v=>{g.beginPath();g.moveTo(26,Y(v));g.lineTo(wd-6,Y(v));g.stroke();
      g.fillStyle=mut;g.font='9px ui-monospace,monospace';g.fillText(String(v),4,Y(v)+3);});
    g.strokeStyle=ok; g.lineWidth=2; g.beginPath();
    hist.forEach((p,i)=>{i?g.lineTo(X(i),Y(p.m)):g.moveTo(X(i),Y(p.m));}); g.stroke();
    const last=hist[hist.length-1];
    g.fillStyle=ok; g.beginPath(); g.arc(X(hist.length-1),Y(last.m),4,0,7); g.fill();
  },30);
  return c;
}

function calChart(cur){
  const c=h('canvas'); c.style.width='100%';
  setTimeout(()=>{
    const wd=c.clientWidth||600, ht=220;
    c.width=wd*2;c.height=ht*2;c.style.height=ht+'px';
    const g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,wd,ht);
    const cs=getComputedStyle(document.documentElement);
    const rule=cs.getPropertyValue('--rule').trim(),red=cs.getPropertyValue('--red').trim(),
      mut=cs.getPropertyValue('--muted').trim(),ok=cs.getPropertyValue('--verified').trim();
    const P=34, W=wd-P-14, H=ht-P-16;
    const X=v=>P+v*W, Y=v=>ht-P+6-v*H;
    g.strokeStyle=rule;g.lineWidth=1;
    [0,.25,.5,.75,1].forEach(v=>{g.beginPath();g.moveTo(P,Y(v));g.lineTo(P+W,Y(v));g.stroke();
      g.fillStyle=mut;g.font='9px ui-monospace,monospace';g.fillText(Math.round(v*100)+'%',4,Y(v)+3);});
    /* perfect calibration diagonal */
    g.strokeStyle=mut;g.setLineDash([3,3]);g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(1),Y(1));g.stroke();
    g.setLineDash([]);
    const pts=cur.filter(b=>b.n>0);
    g.strokeStyle=red;g.lineWidth=2;g.beginPath();
    pts.forEach((b,i)=>{const x=X(b.c),y=Y(b.rate);i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
    pts.forEach(b=>{g.fillStyle=Math.abs(b.gap)<0.1?ok:red;
      g.beginPath();g.arc(X(b.c),Y(b.rate),5,0,7);g.fill();
      g.fillStyle=mut;g.font='9px ui-monospace,monospace';
      g.fillText('n='+b.n,X(b.c)-8,Y(b.rate)-10);});
    g.fillStyle=mut;g.font='9px ui-monospace,monospace';
    ['Guessing','Leaning','Fairly sure','Certain'].forEach((l,i)=>{
      g.fillText(l,X(window.ENG.CONF[i])-14,ht-8);});
    g.fillText('stated confidence →',P,14);
  },30);
  return c;
}
function radar(dm){
  const c=h('canvas'); c.style.width='100%';
  setTimeout(()=>{
    const wd=c.clientWidth||600, ht=300;
    c.width=wd*2;c.height=ht*2;c.style.height=ht+'px';
    const g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,wd,ht);
    const cs=getComputedStyle(document.documentElement);
    const rule=cs.getPropertyValue('--rule').trim(),ok=cs.getPropertyValue('--verified').trim(),
      mut=cs.getPropertyValue('--muted').trim(),ink=cs.getPropertyValue('--ink').trim();
    const cx=wd/2, cy=ht/2+6, R=Math.min(wd,ht)/2-52;
    const N=dm.length;
    const ang=i=>-Math.PI/2 + i*2*Math.PI/N;
    g.strokeStyle=rule;g.lineWidth=1;
    [0.25,0.5,0.75,1].forEach(f=>{g.beginPath();
      for(let i=0;i<=N;i++){const a=ang(i%N),x=cx+Math.cos(a)*R*f,y=cy+Math.sin(a)*R*f;
        i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();});
    for(let i=0;i<N;i++){const a=ang(i);g.beginPath();g.moveTo(cx,cy);
      g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);g.stroke();}
    g.beginPath();
    dm.forEach((d,i)=>{const a=ang(i),f=Math.max(0.02,d.m/100);
      const x=cx+Math.cos(a)*R*f,y=cy+Math.sin(a)*R*f; i?g.lineTo(x,y):g.moveTo(x,y);});
    g.closePath();
    g.fillStyle=ok+'33'; g.fill(); g.strokeStyle=ok; g.lineWidth=2; g.stroke();
    dm.forEach((d,i)=>{const a=ang(i),f=Math.max(0.02,d.m/100);
      g.fillStyle=ok;g.beginPath();g.arc(cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f,3.5,0,7);g.fill();
      const lx=cx+Math.cos(a)*(R+26), ly=cy+Math.sin(a)*(R+22);
      g.fillStyle=ink;g.font='600 10px system-ui,sans-serif';g.textAlign='center';
      g.fillText(d.name,lx,ly);
      g.fillStyle=mut;g.font='9px ui-monospace,monospace';
      g.fillText(Math.round(d.m)+'%',lx,ly+11);});
  },30);
  return c;
}

    p.phases.forEach((ph,pi)=>{
      const sec=h('div',{class:'phase'});
      sec.appendChild(h('h4',{text:ph.n}));
      ph.s.forEach((s,si)=>{
        const key=pi+'.'+si;
        const cb=h('input',{type:'checkbox'});
        cb.checked=!!ps.step[key];
        cb.addEventListener('change',()=>{ps.step[key]=cb.checked;save();
          const n=Object.values(ps.step).filter(Boolean).length;
          body.querySelector('.bar i').style.width=(n/total*100)+'%';
          card.querySelector('.exmeta span:last-child').textContent=n+' / '+total+' steps';
          row.classList.toggle('did',cb.checked);});
        const row=h('label',{class:'pstep'+(cb.checked?' did':'')},[cb,
          h('span',{},[h('strong',{text:s[0]}),h('span',{class:'ph',text:s[1]})])]);
        sec.appendChild(row);
      });
      body.appendChild(sec);
    });
    body.appendChild(h('div',{style:'display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap'},[
      h('button',{class:'primary',onclick:()=>{
        ps.run=(ps.run||0)+1;
        ps.log.push({t:Date.now(),done:Object.values(ps.step).filter(Boolean).length,total});
        ps.step={}; save(); location.reload();
      }},'Complete run '+((ps.run||0)+1)+' and reset'),
      ps.log.length?h('span',{class:'dim',style:'font-size:.8rem',
        text:'Last run '+new Date(ps.log[ps.log.length-1].t).toLocaleDateString()+
             ' · '+ps.log[ps.log.length-1].done+'/'+ps.log[ps.log.length-1].total+' steps'}):null]));
    card.appendChild(body);
    w.appendChild(card);
  });
  return w;
}

  return box;

function esc2(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function sectionHead2(idx,title,note){
  return h('div',{class:'parthead'},[h('span',{class:'idx',text:idx}),h('h2',{text:title}),
    note?h('span',{class:'t',text:note}):null]);
}
function rel(t){
  if(!t)return 'never';
  const s=(Date.now()-t)/1000;
  if(s<90)return 'just now';
  if(s<5400)return Math.round(s/60)+' min ago';
  if(s<172800)return Math.round(s/3600)+' h ago';
  return Math.round(s/86400)+' days ago';
}

function ghPanel(){
  const SY=window.SYNC;
  const box=h('div');
  function render(){
    box.innerHTML='';
    const c=SY.gh.config();
    const msg=h('div',{style:'margin-top:.9rem'});
    const say=(ok,t,d)=>{msg.innerHTML='';
      msg.appendChild(h('div',{class:'verdict '+(ok?'good':'bad')},
        [h('span',{class:'vt',text:t}),d?h('span',{class:'vs',text:d}):null]));};

    if(!c.token){
      box.appendChild(h('div',{class:'exsteps'},[
        h('span',{class:'lbl',text:'One-time setup'}),
        h('ol',{class:'num'},[
          h('li',{html:'Open <a href="https://github.com/settings/tokens/new?scopes=gist&description=AI%20From%20Zero%20progress%20sync" target="_blank" rel="noopener">github.com/settings/tokens/new</a> — the link pre-selects the right scope.'}),
          h('li',{html:'Tick <strong>gist</strong> only. Nothing else. Set an expiry you are happy with.'}),
          h('li',{text:'Generate, copy the token, and paste it below.'})])]));
      const inp=h('input',{type:'password',placeholder:'ghp_… (stored only in this browser)'});
      const auto=h('input',{type:'checkbox',checked:'checked'});
      box.appendChild(h('div',{style:'display:grid;gap:.6rem;max-width:460px'},[
        h('div',{},[h('label',{text:'GitHub token (gist scope)'}),inp]),
        h('label',{style:'display:flex;gap:.5rem;align-items:center;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:.85rem;color:var(--ink)'},
          [auto,document.createTextNode('Push automatically after changes')]),
        h('button',{class:'primary',onclick:async()=>{
          const t=inp.value.trim(); if(!t)return;
          say(true,'Checking…');
          try{
            const r=await SY.gh.connect(t, auto.checked);
            if(r.action==='pulled'){
              say(true,'Connected as '+r.login,
                'Found your existing record and loaded it: '+r.summary.skills+
                ' skills, '+r.summary.attempts+' answers. Reloading…');
              setTimeout(()=>location.reload(),1400); return;
            }
            if(r.action==='conflict'){
              say(false,'Connected as '+r.login+' — but both sides have work',
                'Your gist holds '+r.summary.skills+' skills / '+r.summary.attempts+
                ' answers, and this browser has its own progress. Nothing has been '+
                'changed. Use “Compare with gist” below to choose which one wins.');
              if(window.REFRESH_SYNC)window.REFRESH_SYNC();
              setTimeout(render,2600); return;
            }
            say(true,'Connected as '+r.login,
              r.action==='created' ? 'Created a secret gist and pushed your progress.'
                                   : 'Progress pushed to your existing gist.');
            if(window.REFRESH_SYNC)window.REFRESH_SYNC();
            setTimeout(render,1400);
          }catch(e){ say(false,'Could not connect',e.message); }
        }},'Connect')]));
      box.appendChild(h('p',{class:'labnote',html:
        '<strong>What this token can do:</strong> read and write <em>your gists</em>, nothing else — not your repositories, not your account. '+
        'It is stored in this browser only. Anyone with access to this browser profile could read it, so use a token with an expiry and '+
        '<a href="https://github.com/settings/tokens" target="_blank" rel="noopener">revoke it</a> if the device is lost. '+
        'Sync does not work inside the Claude artifact — its content policy blocks outbound requests — so use your hosted link.'}));
      box.appendChild(msg);
      return;
    }

    /* connected */
    const stat=h('div',{class:'stats'},[
      tile('status','connected','ok'),
      tile('last sync',rel(c.lastSync)),
      tile('auto-push',c.auto?'on':'off',c.auto?'ok':'')]);
    box.appendChild(stat);
    const remoteBox=h('div');
    box.appendChild(h('div',{style:'display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem'},[
      h('button',{class:'primary',onclick:async()=>{
        say(true,'Pushing…');
        try{const r=await SY.gh.push(); say(true,'Pushed',(r.bytes/1024).toFixed(1)+' KB saved to your gist.');
          if(window.REFRESH_SYNC)window.REFRESH_SYNC();
          setTimeout(render,1200);}
        catch(e){say(false,'Push failed',e.message);}
      }},'Push now'),
      h('button',{onclick:async()=>{
        say(true,'Checking the gist…');
        try{
          const rem=await SY.gh.remote();
          if(!rem){say(false,'Nothing stored yet','Push first.');return;}
          const local=SY.stats().summary;
          const risky=SY.gh.localChangedSinceSync();
          remoteBox.innerHTML='';
          remoteBox.appendChild(h('div',{class:'tblwrap',style:'margin-top:.8rem'},[(()=>{
            const t=h('table');
            t.appendChild(h('thead',{},h('tr',{},[h('th',{text:''}),h('th',{text:'This browser'}),h('th',{text:'In the gist'})])));
            t.appendChild(h('tbody',{},[
              row('skills measured',local.skills,rem.summary.skills),
              row('answers logged',local.attempts,rem.summary.attempts),
              row('exercises',local.exercises,rem.summary.exercises),
              row('last written',rel(local.updatedAt),rel(rem.exportedAt))]));
            return t;})()]));
          remoteBox.appendChild(h('div',{style:'display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap;align-items:center'},[
            h('button',{class:'red',onclick:async()=>{
              if(risky&&!confirm('This browser has changes made since the last sync. Pulling replaces them with the gist copy. A local snapshot is kept. Continue?'))return;
              try{const sum=await SY.gh.pull();
                alert('Pulled: '+sum.skills+' skills, '+sum.attempts+' answers. Reloading.');
                location.reload();}
              catch(e){say(false,'Pull failed',e.message);}
            }},'Replace this browser with the gist copy'),
            risky?h('span',{class:'pill red',text:'local has unsynced changes'}):null]));
          say(true,'Compared','Choose which copy wins.');
        }catch(e){say(false,'Could not read the gist',e.message);}
      }},'Compare with gist'),
      h('button',{onclick:()=>{
        const cc=SY.gh.config(); cc.auto=!cc.auto; SY.gh.save(cc); render();
      }},c.auto?'Turn auto-push off':'Turn auto-push on'),
      h('button',{class:'red',onclick:()=>{
        if(!confirm('Disconnect sync? The gist and your progress both stay where they are; only the saved token is removed from this browser.'))return;
        SY.gh.clear(); render();
      }},'Disconnect')]));

/* ---------------- never a dead end ----------------

   The single most common moment a reader gives up is meeting a word they do not
   know and having nowhere to go with it. So the first time a chapter uses a
   term that is defined anywhere in this book, the word itself becomes tappable:
   a plain-language definition appears in place, with the chapter that teaches it
   properly. Forward references are marked as such rather than hidden, because
   "you will build this in Chapter 7" is itself an answer — it tells you that not
   knowing it yet is expected rather than a gap in you. */

let TERMS=null;
function termIndex(){
  if(TERMS) return TERMS;
  const map=new Map();
  const add=(raw,def,ch)=>{
    /* "Model / LLM" and "Top-k (k)" name the same idea more than one way */
    String(raw).split(/\s*\/\s*/).forEach(part=>{
      const forms=[part.replace(/\s*\([^)]*\)\s*/g,' ').trim()];
      const paren=part.match(/\(([^)]+)\)/);
      if(paren) forms.push(paren[1].trim());
      forms.filter(f=>f.length>2).forEach(f=>{
        const k=f.toLowerCase();
        if(!map.has(k)) map.set(k,{term:f,def,ch});
      });
    });
  };
  (window.GLOSSARY||[]).forEach(([t,d,ch])=>add(t,d,ch));
  /* a chapter's own vocabulary list covers anything the glossary misses */
  (window.CHAPTERS||[]).forEach(c=>(c.words||[]).forEach(([t,d])=>{
    if(!map.has(String(t).toLowerCase())) add(t,d,c.num);
  }));
  TERMS=[...map.values()].sort((a,b)=>b.term.length-a.term.length);
  return TERMS;
}

let popEl=null;

document.addEventListener('click',e=>{ if(popEl && !popEl.contains(e.target) && !e.target.closest('.term')) closeTerm(); });

function openTerm(btn,entry,here){

const SKIP_TERMS=new Set(['PRE','CODE','BUTTON','A','TEXTAREA','INPUT','DT','SUMMARY']);
/* Enough marks that nothing goes unexplained, few enough that a paragraph still
   reads as prose rather than as a field of links. */
const PER_BLOCK=4;
/* `seen` is shared across a whole chapter, so a term is marked once — enough to
   be discoverable, not so often the page looks like a minefield. */
function markTerms(root, seen, here){
  const terms=termIndex();
  if(!terms.length) return root;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode(n){
      if(!n.nodeValue||n.nodeValue.length<3) return NodeFilter.FILTER_REJECT;
      for(let p=n.parentNode;p&&p!==root;p=p.parentNode)
        if(SKIP_TERMS.has(p.nodeName)||(p.classList&&p.classList.contains('noterm')))
          return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
  const targets=[];
  while(walker.nextNode()) targets.push(walker.currentNode);
  const esc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const button=(entry,word)=>{
    const btn=h('button',{class:'term',type:'button',title:'What does this mean?',
      onclick:e=>{e.stopPropagation();
        if(btn.querySelector('.termpop')) closeTerm(); else openTerm(btn,entry,here);}},word);
    return btn;
  };
  targets.forEach(node=>{
    const text=node.nodeValue;
    const marks=[];
    for(const entry of terms){
      if(marks.length>=PER_BLOCK) break;
      const k=entry.term.toLowerCase();
      if(seen.has(k)) continue;
      const m=new RegExp('\\b'+esc(entry.term)+'\\b','i').exec(text);
      if(!m) continue;
      const start=m.index, end=start+m[0].length;
      /* terms are sorted longest first, so a longer phrase claims its span
         before a word inside it can */
      if(marks.some(x=>start<x.end&&end>x.start)) continue;
      marks.push({start,end,entry,word:m[0]});
      seen.add(k);
    }
    if(!marks.length) return;
    marks.sort((a,b)=>a.start-b.start);
    const frag=document.createDocumentFragment();
    let pos=0;
    marks.forEach(mk=>{
      if(mk.start>pos) frag.appendChild(document.createTextNode(text.slice(pos,mk.start)));
      frag.appendChild(button(mk.entry,mk.word));
      pos=mk.end;
    });
    if(pos<text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag,node);
  });
  return root;
}

function sittingGuard(){

  if(S.pred.length){

    S.pred.forEach(p=>md+='| '+p.ch+' | '+p.what+' | '+p.pred+' | '+(p.act||'—')+' | '+
      (p.act!==''&&p.act!=null?(Number(p.act)-Number(p.pred)).toFixed(1):'—')+' |\n');

function route(){

  const parts=hash.split('/').filter(Boolean);
  const main=$('#main');main.innerHTML='';
  let node,crumb='Dashboard';
  if(parts[0]==='ch'&&byId[parts[1]]){
    const c=byId[parts[1]];node=renderChapter(c);
    crumb='Part '+ROMAN(c.part)+' · Chapter '+c.num;
    document.title=c.num+'. '+c.title+' — AI From Zero';
  } else if(parts[0]==='practice'){
    node = parts[1] ? V().practice(parts[1],parts[2]) : V().practiceMenu();
    crumb='Practice'+(parts[1]?' · '+parts[1]:'');
    document.title='Practice — AI From Zero';
  } else if(parts[0]==='studio'){
    node=window.STUDIO.studio(parts);
    crumb='Content Studio'+(parts[1]?' · '+parts[1]:'');
    document.title='Content Studio — AI From Zero';
  } else if(parts[0]==='skill'&&parts[1]){
    node=V().skillPage(parts[1]);
    crumb='Skill · '+parts[1];
    document.title='Skill — AI From Zero';
  } else {
    const f=ROUTES[parts[0]||''];
    node=(f||(()=>V().dashboard()))();
    crumb=CRUMB[parts[0]||'']||(parts[0]?parts[0][0].toUpperCase()+parts[0].slice(1):'Dashboard');
    document.title='AI From Zero — 2027 Edition';
  }

  const cb=$('#crumb');if(cb)cb.textContent=crumb;
  renderRail();

function buildIndex(){
  const idx=[];
  idx.push({k:'page',t:'Dashboard',h:'#/'},{k:'page',t:'Practice',h:'#/practice'},
    {k:'page',t:'Skill Matrix',h:'#/skills'},{k:'page',t:'Analytics',h:'#/analytics'},
    {k:'page',t:'Exercises',h:'#/exercises'},{k:'page',t:'Processes',h:'#/processes'},
    {k:'page',t:'Library — '+CH.length+' chapters',h:'#/library'},
    {k:'page',t:'Progress & Backup',h:'#/data'},
    {k:'page',t:'Content Studio — edit the curriculum',h:'#/studio'},
    {k:'page',t:'Setup',h:'#/setup'},
    {k:'page',t:'The Labs',h:'#/labs'},{k:'page',t:'Red-Mark Map',h:'#/map'},
    {k:'page',t:'Prediction Ledger',h:'#/ledger'},{k:'page',t:'Notebook',h:'#/notebook'},
    {k:'page',t:'System Card',h:'#/card'},{k:'page',t:'Vendor Deck',h:'#/vendor'},
    {k:'page',t:'Glossary',h:'#/glossary'},{k:'page',t:'LATER Page',h:'#/later'},
    {k:'page',t:'Where You Are',h:'#/progress'});
  CH.forEach(c=>{
    idx.push({k:'ch '+c.num,t:c.title,d:c.concept,h:'#/ch/'+c.id});
    c.words.forEach(([t,d])=>idx.push({k:'term',t,d:'Ch '+c.num+' · '+d.replace(/<[^>]+>/g,''),h:'#/ch/'+c.id}));
    c.check.forEach(q=>idx.push({k:'question',t:q[0],d:'Ch '+c.num,h:'#/ch/'+c.id}));
  });
  window.VENDOR.forEach(v=>idx.push({k:'claim',t:v.claim,d:'Ch '+v.ch,h:'#/vendor'}));
  window.REDMARKS.forEach(r=>idx.push({k:'failure',t:r.t,d:'Ch '+r.ch,h:'#/map'}));
  window.SKILLS.forEach(s=>idx.push({k:'skill',t:s.n,d:s.core,h:'#/skill/'+s.id}));
  window.EXERCISES.forEach(e=>idx.push({k:'exercise',t:e.t,d:'~'+e.mins+' min',h:'#/exercises#'+e.id}));
  window.PROCESSES.forEach(p=>idx.push({k:'process',t:p.n,d:p.cad,h:'#/processes#'+p.id}));
  return idx;
}

function palMove(d){

    else if(e.key==='Enter'){const a=$('#palres a.cur');if(a){location.hash=a.getAttribute('href');closePal();}}
  });
  applyTheme();
  window.addEventListener('hashchange',route);
  route();
  ACCOUNT.boot().then(()=>{ if(ACCOUNT.state==='off') runAutoSync(); });
}
function setSyncPill(state,text,cls){
  const el=$('#syncpill'); if(!el)return;
  if(state==='off'){el.hidden=true;return;}
  el.hidden=false; el.textContent=text;
  el.className='syncpill'+(cls?' '+cls:'');
}
/* ---------------- account sync ----------------
   The server is the record when signed in; this device is a cache. On open we
   pull, on change we push, and a version mismatch means another device wrote
   first — we never resolve that silently. */
const ACCOUNT=(function(){
  let state='off';          // off | signedout | syncing | ok | offline | conflict | error
  let detail='';
  let pushT=null, inFlight=false, dirty=false, serverCopy=null;

  const M=()=>window.REMOTE.meta();
  const setM=m=>window.REMOTE.setMeta(m);
  const marker=()=>S.updatedAt||0;
  /* version 0 is a real, synced state — the server simply has no row yet — so
     "never synced" has to be the absence of a version, not a falsy one. */
  const localChanged=()=>{const m=M();
    return m.version==null || (S.updatedAt||0)!==(m.marker||0);};

  function show(st,d){ state=st; detail=d||''; paint(); }
  function paint(){
    const el=$('#syncpill'); if(!el)return;
    const map={
      off:      null,
      signedout:['Sign in to sync','warn'],
      syncing:  ['syncing…','busy'],
      ok:       ['synced','ok'],
      pulled:   ['synced — loaded your latest','ok'],
      offline:  ['offline — will sync later','warn'],
      conflict: ['another device wrote first — open','warn'],
      error:    ['sync problem — open','warn']
    };
    const v=map[state];
    if(!v){el.hidden=true;return;}
    el.hidden=false; el.textContent=v[0]; el.className='syncpill '+v[1];
  }

  /* The page renders before this probe resolves, so any view that shows account
     state has to be redrawn once we know it. */
  function reroute(){ if(location.hash.indexOf('#/data')===0) route(); }
  async function boot(){
    if(!window.REMOTE) return;
    const a=await window.REMOTE.probe();
    if(!a){ show('off'); reroute(); return; }
    const u=await window.REMOTE.me();
    if(!u){ clearIfStale(); show('signedout'); reroute(); return; }
    show('syncing');
    try{
      const srv=await window.REMOTE.pull();
      if(srv.signedOut){ show('signedout'); return; }
      await reconcile(srv);
    }catch(e){ show(navigator.onLine?'error':'offline', e.message); }
    reroute();
  }
  /* Signed out on a device that had synced: keep the data, drop the pointer. */
  function clearIfStale(){ const m=M(); if(m.version) window.REMOTE.clearMeta(); }

  async function reconcile(srv){
    const m=M();
    const localEmpty=window.SYNC.isEmptyState(S);
    const serverEmpty=!srv.data || window.SYNC.isEmptyState(srv.data);

    if(serverEmpty && !localEmpty) return pushNow(srv.version, 'ok');
    if(serverEmpty && localEmpty){ setM({version:srv.version, marker:marker()}); return show('ok'); }

    if(localEmpty || !localChanged()){
      window.SYNC.takeSessionBackup();
      replace(srv.data);
      setM({version:srv.version, marker:marker()});
      route();
      return show(localEmpty?'pulled':'ok');
    }
    /* both sides moved */
    if((m.version||0) === srv.version) return pushNow(srv.version, 'ok');
    serverCopy=srv; show('conflict');
  }

  async function pushNow(baseVersion, okState){
    if(inFlight){ dirty=true; return; }
    inFlight=true;
    try{
      const r=await window.REMOTE.push(S, baseVersion);
      if(r.signedOut){ show('signedout'); return; }
      if(r.tooLarge){ show('error','Progress is too large to save.'); return; }
      if(r.conflict){ serverCopy=r.server; show('conflict'); return; }
      setM({version:r.version, marker:marker()});
      show(okState||'ok');
    }catch(e){ show(navigator.onLine?'error':'offline', e.message); }
    finally{
      inFlight=false;
      if(dirty){ dirty=false; onChange(true); }
    }
  }

  /* Nothing to send is not the same as something to send. Coming back online,
     or leaving a page, used to push an unchanged copy — which spent a version
     and could collide with a device that had actually done some work. */
  function onChange(immediate){
    if(state==='off'||state==='signedout'||state==='conflict') return;
    clearTimeout(pushT);
    const go=()=>{ const m=M();
      if(m.version==null || !localChanged()) return; pushNow(m.version); };
    if(immediate) go(); else pushT=setTimeout(go, 2500);
  }
  function flush(){
    if(state==='off'||state==='signedout'||state==='conflict') return;
    const m=M(); if(m.version==null || !localChanged()) return;
    clearTimeout(pushT);
    /* keepalive lets this outlive the page so the last answers are not stranded */
    try{
      fetch('/api/state',{method:'PUT',keepalive:true,credentials:'same-origin',
        headers:{'content-type':'application/json','x-aifz':'1'},
        body:JSON.stringify({baseVersion:m.version,data:S,device:window.REMOTE.deviceName()})});
    }catch(e){}
  }

  async function takeServer(){
    if(!serverCopy) return;
    window.SYNC.takeSessionBackup();
    replace(serverCopy.data);
    setM({version:serverCopy.version, marker:marker()});
    serverCopy=null; route(); show('pulled');
  }
  async function takeLocal(){
    if(!serverCopy) return;
    const v=serverCopy.version; serverCopy=null;
    await pushNow(v,'ok');
  }

  return {boot, onChange, flush, paint, takeServer, takeLocal,
    get state(){return state;}, get detail(){return detail;},
    get server(){return serverCopy;}, get user(){return window.REMOTE&&window.REMOTE.user;},
    refresh:boot};
})();
window.ACCOUNT=ACCOUNT;

window.REFRESH_SYNC=function(){ runAutoSync(); };
function runAutoSync(){
  if(!window.SYNC)return;
  const c=window.SYNC.gh.config();
  if(!c.token){setSyncPill('off');return;}
  setSyncPill('busy','syncing…','busy');
  window.SYNC.autoSync().then(r=>{
    if(r.state==='pulled'){
      setSyncPill('ok','synced — pulled newer progress','ok');
      route();                                   // re-render with the pulled state
    }
    else if(r.state==='pushed') setSyncPill('ok','synced','ok');
    else if(r.state==='synced') setSyncPill('ok','synced','ok');
    else if(r.state==='conflict') setSyncPill('warn','this device and your gist differ — compare','warn');
    else if(r.state==='behind') setSyncPill('warn','newer progress in your gist — open to pull','warn');
    else setSyncPill('warn','sync failed — open','warn');
  }).catch(()=>setSyncPill('warn','sync failed — open','warn'));
}
/* Content first, then render — the whole app is built from it. */
function start(){
  const go=()=>{
    const p = window.CONTENT ? window.CONTENT.load() : Promise.resolve({source:'built-in'});
    p.then(()=>{ bindContent(); boot(); })
     .catch(()=>{ bindContent(); boot(); });
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go);
  else go();
}
start();
})();

</script>
