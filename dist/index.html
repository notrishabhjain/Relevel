<style>
/* ============================================================
   AI From Zero — 2027 Edition
   Identity: a technical field manual. Ink on graph paper.
   The accent red is reserved for failure marks and evidence —
   the book's own thesis is that the red ink is the credential.
   ============================================================ */

:root{
  /* light — cool oat-grey pad stock, not cream */
  --paper:#ECEEEA;
  --raised:#F6F7F4;
  --sunk:#E2E5E0;
  --ink:#14181C;
  --ink-2:#3D454A;
  --muted:#697169;
  --rule:#C9CDC5;
  --rule-soft:#D9DCD5;
  --red:#B33A2B;
  --red-wash:#B33A2B14;
  --verified:#1F6F5C;
  --verified-wash:#1F6F5C14;
  --amber:#8A6212;
  --grid:#14181C0A;
  --shadow:0 1px 2px #14181C0F, 0 8px 24px -12px #14181C1F;

  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --measure:66ch;
  --rail:270px;
  --r:3px;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121517; --raised:#191D20; --sunk:#0D1012;
    --ink:#E4E7E2; --ink-2:#B4BBB6; --muted:#8A928C;
    --rule:#2E3438; --rule-soft:#232A2D;
    --red:#E8736A; --red-wash:#E8736A1A;
    --verified:#4FB89A; --verified-wash:#4FB89A1A;
    --amber:#D3A54A;
    --grid:#E4E7E207;
    --shadow:0 1px 2px #0006, 0 8px 24px -12px #0008;
  }
}
:root[data-theme="dark"]{
  --paper:#121517; --raised:#191D20; --sunk:#0D1012;
  --ink:#E4E7E2; --ink-2:#B4BBB6; --muted:#8A928C;
  --rule:#2E3438; --rule-soft:#232A2D;
  --red:#E8736A; --red-wash:#E8736A1A;
  --verified:#4FB89A; --verified-wash:#4FB89A1A;
  --amber:#D3A54A;
  --grid:#E4E7E207;
  --shadow:0 1px 2px #0006, 0 8px 24px -12px #0008;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
/* grid items default to min-width:auto and refuse to shrink below their content */
.shell>*{min-width:0}
.rail{
  border-right:1px solid var(--rule); background:var(--raised);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:0 0 3rem;
  scrollbar-width:thin;
}
.main{min-width:0;padding:0 0 6rem}
.wrap{max-width:var(--measure);margin:0 auto;padding:0 1.75rem}
.wrap-wide{max-width:1080px;margin:0 auto;padding:0 1.75rem}

/* ---------- masthead ---------- */
.brand{padding:1.5rem 1.25rem 1.15rem;border-bottom:1px solid var(--rule)}
.brand h1{
  font-family:var(--serif);font-size:1.32rem;line-height:1.12;margin:0;
  font-weight:500;letter-spacing:-.012em;
}
.brand .ed{
  font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-top:.5rem;display:block;
}
.brand .prog{margin-top:.85rem}
.bar{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--verified);transition:width .4s}
.brand .pct{font-family:var(--mono);font-size:.63rem;color:var(--muted);margin-top:.4rem;display:block}

/* ---------- rail nav ---------- */
.railsec{padding:1rem 1.25rem .3rem}
.railsec h2{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin:0 0 .55rem;font-weight:500;
}
.navlist{list-style:none;margin:0;padding:0}
.navlist a{
  display:flex;gap:.6rem;align-items:baseline;padding:.32rem .5rem;margin:0 -.5rem;
  color:var(--ink-2);text-decoration:none;border-radius:var(--r);font-size:.83rem;line-height:1.35;
}
.navlist a:hover{background:var(--sunk);color:var(--ink)}
.navlist a.on{background:var(--ink);color:var(--paper)}
.navlist a.on .nnum{color:var(--paper);opacity:.65}
.nnum{font-family:var(--mono);font-size:.68rem;color:var(--muted);min-width:1.35em;flex:none;
  font-variant-numeric:tabular-nums}
.ndone{margin-left:auto;color:var(--verified);font-size:.72rem;flex:none}
.navlist a.on .ndone{color:var(--paper)}

/* ---------- generic type ---------- */
h1,h2,h3,h4{text-wrap:balance}
.prose{font-family:var(--serif);font-size:1.075rem;line-height:1.72;color:var(--ink)}
.prose p{margin:0 0 1.15rem}
.prose strong{font-weight:600}
.prose em{font-style:italic}
.prose code,code{font-family:var(--mono);font-size:.86em;background:var(--sunk);
  padding:.1em .34em;border-radius:2px;border:1px solid var(--rule-soft)}
kbd{font-family:var(--mono);font-size:.8em;background:var(--sunk);border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:3px;padding:.05em .35em}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}

/* ---------- chapter head ---------- */
.chead{border-bottom:1px solid var(--rule);padding:3.25rem 0 2rem;margin-bottom:2.25rem}
.eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:flex;gap:.85rem;align-items:center;flex-wrap:wrap}
.eyebrow .dot{width:3px;height:3px;background:var(--rule);border-radius:50%}
.chnum{font-family:var(--serif);font-size:4.2rem;line-height:.82;font-weight:300;
  color:var(--rule);margin:.7rem 0 .1rem;font-variant-numeric:lining-nums}
.chead h1{font-family:var(--serif);font-size:2.35rem;line-height:1.08;font-weight:500;
  letter-spacing:-.02em;margin:.2rem 0 .8rem}
.concept{font-family:var(--serif);font-size:1.1rem;font-style:italic;color:var(--ink-2);
  line-height:1.55;margin:0;max-width:52ch}

/* ---------- section anchors (the seven parts) ---------- */
.part{margin:3.25rem 0 0;scroll-margin-top:1rem}
.parthead{display:flex;align-items:baseline;gap:.75rem;margin-bottom:1.25rem;
  border-bottom:1px solid var(--rule);padding-bottom:.5rem}
.parthead .idx{font-family:var(--mono);font-size:.7rem;color:var(--red);flex:none;
  font-variant-numeric:tabular-nums}
.parthead h2{font-family:var(--sans);font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;
  font-weight:600;margin:0;color:var(--ink)}
.parthead .t{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted);flex:none}

/* ---------- content blocks ---------- */
.keyline{
  font-family:var(--serif);font-size:1.16rem;line-height:1.6;
  border-left:2px solid var(--red);padding:.15rem 0 .15rem 1.15rem;margin:1.6rem 0;
  color:var(--ink);
}
.callout{
  background:var(--raised);border:1px solid var(--rule);border-left:2px solid var(--ink-2);
  border-radius:var(--r);padding:.95rem 1.1rem;margin:1.5rem 0;
}
.callout .lbl{font-family:var(--mono);font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:.4rem}
.callout p{margin:0;font-family:var(--serif);font-size:1rem;line-height:1.62}
ul.bul,ol.num{font-family:var(--serif);font-size:1.05rem;line-height:1.68;padding-left:1.3rem;margin:1.2rem 0}
ul.bul li,ol.num li{margin-bottom:.65rem}
ul.bul li::marker{color:var(--rule)}
ol.num li::marker{color:var(--muted);font-family:var(--mono);font-size:.85rem}

pre{
  font-family:var(--mono);font-size:.795rem;line-height:1.62;background:var(--sunk);
  border:1px solid var(--rule);border-radius:var(--r);padding:.95rem 1.05rem;
  overflow-x:auto;margin:1.35rem 0;tab-size:4;
}
pre code{background:none;border:none;padding:0;font-size:1em}

.expect{
  display:flex;gap:.7rem;background:var(--verified-wash);border:1px solid var(--verified);
  border-radius:var(--r);padding:.75rem .95rem;margin:1.2rem 0;font-size:.93rem;line-height:1.6;
}
.expect .tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--verified);flex:none;padding-top:.22rem;font-weight:600}
.expect div:last-child{color:var(--ink-2)}

.tblwrap{overflow-x:auto;margin:1.4rem 0;border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--raised)}
th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--rule-soft);
  vertical-align:top;line-height:1.5}
th{font-family:var(--sans);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;background:var(--sunk);border-bottom:1px solid var(--rule)}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- hands-on steps ---------- */
.step{margin:1.9rem 0}
.step > h3{
  font-family:var(--sans);font-size:.95rem;font-weight:600;margin:0 0 .8rem;
  padding-bottom:.4rem;border-bottom:1px dashed var(--rule);color:var(--ink);
}

/* ---------- words you now own ---------- */
.words{display:grid;gap:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.word{display:grid;grid-template-columns:minmax(120px,.32fr) 1fr;gap:1rem;
  padding:.65rem .9rem;border-bottom:1px solid var(--rule-soft);background:var(--raised);font-size:.9rem}
.word:last-child{border-bottom:none}
.word dt{font-family:var(--sans);font-weight:600;margin:0;color:var(--ink)}
.word dd{margin:0;color:var(--ink-2);line-height:1.55}
@media (max-width:620px){.word{grid-template-columns:1fr;gap:.2rem}}

/* ---------- check yourself ---------- */
.qa{border:1px solid var(--rule);border-radius:var(--r);margin:.7rem 0;background:var(--raised);
  overflow:hidden}
.qa > summary{padding:.8rem 1rem;cursor:pointer;font-weight:500;list-style:none;
  display:flex;gap:.7rem;align-items:flex-start;font-size:.95rem}
.qa > summary::-webkit-details-marker{display:none}
.qa > summary::before{content:'?';font-family:var(--mono);color:var(--red);flex:none;
  font-size:.85rem;padding-top:.1rem}
.qa[open] > summary{border-bottom:1px solid var(--rule-soft);background:var(--sunk)}
.qa .ans{padding:.85rem 1rem 1rem 2.4rem;font-family:var(--serif);font-size:1rem;
  line-height:1.62;color:var(--ink-2)}
.grade{display:flex;gap:.4rem;padding:0 1rem 1rem 2.4rem;align-items:center}
.grade span{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-right:.2rem}

/* ---------- buttons ---------- */
button{font-family:var(--sans);font-size:.82rem;cursor:pointer;border-radius:var(--r);
  border:1px solid var(--rule);background:var(--raised);color:var(--ink);padding:.38rem .75rem;
  transition:background .12s,border-color .12s}
button:hover{background:var(--sunk);border-color:var(--muted)}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.primary:hover{opacity:.86;background:var(--ink)}
button.on{background:var(--verified);border-color:var(--verified);color:#fff}
button.red{color:var(--red);border-color:var(--red)}
button.red.on{background:var(--red);color:#fff}
button.sm{font-size:.72rem;padding:.24rem .55rem}

input,textarea,select{font-family:var(--sans);font-size:.88rem;background:var(--paper);
  color:var(--ink);border:1px solid var(--rule);border-radius:var(--r);padding:.45rem .6rem;
  width:100%}
textarea{font-family:var(--mono);font-size:.82rem;line-height:1.6;resize:vertical}
label{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
input[type=range]{padding:0;accent-color:var(--red)}

/* ---------- labs ---------- */
.lab{background:var(--raised);border:1px solid var(--rule);border-radius:var(--r);
  margin:1.8rem 0;overflow:hidden;box-shadow:var(--shadow)}
.labhead{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;background:var(--sunk);
  border-bottom:1px solid var(--rule)}
.labhead .k{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--red);flex:none}
.labhead h4{margin:0;font-size:.9rem;font-weight:600;font-family:var(--sans)}
.labbody{padding:1rem}
.labnote{font-size:.82rem;color:var(--muted);line-height:1.55;margin:.8rem 0 0;
  padding-top:.8rem;border-top:1px dashed var(--rule)}
.ctl{display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem}
.ctl > div{flex:1 1 150px;min-width:130px}
.readout{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* token viz */
.toks{display:flex;flex-wrap:wrap;gap:2px;line-height:1;margin:.5rem 0}
.tok{font-family:var(--mono);font-size:.74rem;padding:.2rem .3rem;border-radius:2px;
  background:var(--sunk);border:1px solid var(--rule-soft)}
.tok.alt{background:var(--red-wash);border-color:var(--red)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.7rem;margin:.9rem 0}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:.6rem .7rem}
.stat .l{font-family:var(--mono);font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:.2rem}
.stat .v{font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .v.red{color:var(--red)}
.stat .v.ok{color:var(--verified)}
.stat .s{font-size:.7rem;color:var(--muted);display:block;margin-top:.1rem}

/* ---------- red-mark map ---------- */
.mapwrap{overflow-x:auto;background:var(--raised);border:1px solid var(--rule);
  border-radius:var(--r);padding:1rem;margin:1.4rem 0}
.pipe{display:flex;gap:.9rem;min-width:820px;align-items:stretch}
.pnode{flex:1;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);
  padding:.6rem .5rem;text-align:center;position:relative;cursor:pointer;
  transition:border-color .15s}
.pnode:hover{border-color:var(--ink-2)}
.pnode:not(:last-child)::after{content:'→';position:absolute;right:-.62rem;top:50%;
  transform:translateY(-50%);color:var(--rule);font-size:.7rem;z-index:1;line-height:1}
.pnode .pl{font-size:.78rem;font-weight:600;display:block;line-height:1.2}
.pnode .ps{font-size:.63rem;color:var(--muted);display:block;margin-top:.2rem;line-height:1.25}
.pnode .pc{font-family:var(--mono);font-size:.55rem;color:var(--muted);display:block;margin-top:.35rem}
.pnode .badge{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;
  font-family:var(--mono);font-size:.6rem;min-width:17px;height:17px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 3px}
.pnode.sel{border-color:var(--red);box-shadow:0 0 0 2px var(--red-wash)}
.marks{display:grid;gap:.35rem;margin-top:1rem}
.mark{display:flex;gap:.65rem;align-items:flex-start;padding:.5rem .7rem;background:var(--paper);
  border:1px solid var(--rule);border-radius:var(--r);font-size:.85rem;line-height:1.45}
.mark.got{border-color:var(--red);background:var(--red-wash)}
.mark .mc{font-family:var(--mono);font-size:.62rem;color:var(--muted);flex:none;padding-top:.15rem;
  min-width:2.6em}
.mark .mt{flex:1}
.mark input[type=checkbox]{width:auto;margin:.2rem 0 0}

/* ---------- cards / grids ---------- */
.cards{display:grid;gap:.8rem;margin:1.3rem 0}
.card{background:var(--raised);border:1px solid var(--rule);border-radius:var(--r);padding:.95rem 1.1rem}
.card h3{margin:0 0 .35rem;font-size:.95rem;font-family:var(--sans);font-weight:600}
.card p{margin:0;font-size:.88rem;color:var(--ink-2);line-height:1.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem}

.pill{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.15rem .45rem;border-radius:2px;border:1px solid var(--rule);color:var(--muted);
  background:var(--paper);white-space:nowrap}
.pill.red{color:var(--red);border-color:var(--red)}
.pill.ok{color:var(--verified);border-color:var(--verified)}

/* ---------- page heads for tools ---------- */
.phead{border-bottom:1px solid var(--rule);padding:3rem 0 1.5rem;margin-bottom:2rem}
.phead h1{font-family:var(--serif);font-size:2.1rem;font-weight:500;letter-spacing:-.02em;
  margin:.4rem 0 .6rem;line-height:1.1}
.phead p{margin:0;color:var(--ink-2);font-size:1rem;max-width:60ch;line-height:1.6;
  font-family:var(--serif)}

/* ---------- home ---------- */
.hero{padding:4.5rem 0 2.5rem}
.hero .kicker{font-family:var(--mono);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--red)}
.hero h1{font-family:var(--serif);font-size:clamp(2.6rem,6vw,4rem);line-height:.98;font-weight:500;
  letter-spacing:-.03em;margin:1rem 0 .9rem}
.hero .sub{font-family:var(--serif);font-size:1.2rem;line-height:1.6;color:var(--ink-2);
  max-width:56ch;margin:0 0 1.6rem}
.meta{display:flex;gap:2rem;flex-wrap:wrap;padding:1.2rem 0;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);margin:2rem 0}
.meta div{min-width:110px}
.meta .l{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);display:block}
.meta .v{font-size:.92rem;margin-top:.2rem;display:block}

.partcard{border:1px solid var(--rule);border-radius:var(--r);padding:1.2rem 1.3rem;
  background:var(--raised);margin-bottom:.9rem}
.partcard .pn{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--red)}
.partcard h3{font-family:var(--serif);font-size:1.3rem;font-weight:500;margin:.3rem 0 .4rem}
.partcard p{margin:0 0 .8rem;font-size:.9rem;color:var(--ink-2);line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{font-size:.75rem;padding:.22rem .5rem;border:1px solid var(--rule);border-radius:2px;
  text-decoration:none;color:var(--ink-2);background:var(--paper)}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip.done{border-color:var(--verified);color:var(--verified)}

/* ---------- notebook ---------- */
.nbentry{border:1px solid var(--rule);border-radius:var(--r);background:var(--raised);
  padding:1rem 1.1rem;margin-bottom:.9rem}
.nbentry h3{margin:0 0 .6rem;font-size:.92rem;font-family:var(--sans);font-weight:600;
  display:flex;gap:.6rem;align-items:center}
.fields{display:grid;gap:.75rem}
.saved{font-family:var(--mono);font-size:.6rem;color:var(--verified);letter-spacing:.1em;
  text-transform:uppercase;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}

/* ---------- toolbar ---------- */
.tbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
  display:flex;gap:.5rem;align-items:center;padding:.55rem 1.75rem;backdrop-filter:blur(6px)}
.tbar .sp{flex:1}
.tbar .crumb{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- command palette ---------- */
.pal{position:fixed;inset:0;background:#0008;display:none;z-index:100;padding:8vh 1rem 1rem;
  backdrop-filter:blur(2px)}
.pal.open{display:block}
.palbox{max-width:600px;margin:0 auto;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--r);box-shadow:0 20px 60px -12px #0009;overflow:hidden}
.palbox input{border:none;border-bottom:1px solid var(--rule);border-radius:0;padding:.85rem 1rem;
  font-size:.95rem;background:var(--raised)}
.palbox input:focus{outline:none}
.palres{max-height:52vh;overflow-y:auto}
.palres a{display:flex;gap:.7rem;align-items:baseline;padding:.55rem 1rem;text-decoration:none;
  color:var(--ink);border-bottom:1px solid var(--rule-soft);font-size:.87rem}
.palres a:hover,.palres a.cur{background:var(--sunk)}
.palres .pk{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);flex:none;min-width:4.6em}
.palres .pd{color:var(--muted);font-size:.78rem;margin-left:auto;flex:none}

/* ---------- misc ---------- */
.foot{border-top:1px solid var(--rule);margin-top:4rem;padding:1.5rem 0 0;
  display:flex;gap:1rem;justify-content:space-between;flex-wrap:wrap}
.foot a{font-size:.85rem;text-decoration:none;color:var(--ink-2)}
.foot a:hover{color:var(--ink)}
.empty{color:var(--muted);font-size:.88rem;font-style:italic;padding:1.2rem 0}
.hr{height:1px;background:var(--rule);margin:2.5rem 0;border:none}
.mono{font-family:var(--mono)}
.rt{text-align:right}
.dim{color:var(--muted)}

.railtoggle{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;width:280px;z-index:60;transform:translateX(-100%);
    transition:transform .2s;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .railtoggle{display:inline-flex}
  .wrap,.wrap-wide,.tbar{padding-left:1.1rem;padding-right:1.1rem}
  .chnum{font-size:3.2rem}
  .chead h1{font-size:1.85rem}
}

@media print{
  .rail,.tbar,.foot,.lab,button{display:none!important}
  .shell{display:block}
  body{background:#fff;color:#000}
  .wrap{max-width:none}
}

/* ============================================================
   TRACKER — dashboard, practice runner, skill matrix, analytics
   Level colours are a sequential ramp from the neutral ink toward
   the "measured" green; red stays reserved for failure and decay.
   ============================================================ */
:root{
  --l0:#C9CDC5; --l1:#9AA79B; --l2:#6E9080; --l3:#3F7C68; --l4:#1F6F5C;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --l0:#2E3438; --l1:#4A5B52; --l2:#3E7F6B; --l3:#45A387; --l4:#4FB89A;}}
:root[data-theme="dark"]{
  --l0:#2E3438; --l1:#4A5B52; --l2:#3E7F6B; --l3:#45A387; --l4:#4FB89A;}

h2.sec{font-family:var(--serif);font-size:1.35rem;font-weight:500;margin:2.4rem 0 .9rem;
  letter-spacing:-.01em}
h3.sec2{font-family:var(--sans);font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;
  font-weight:600;margin:2rem 0 .8rem;color:var(--muted)}

.meter{display:inline-block;height:5px;background:var(--sunk);border-radius:3px;
  overflow:hidden;flex:1;min-width:48px}
.meter i{display:block;height:100%;background:var(--ink-2);transition:width .5s}
.meter i.ok{background:var(--verified)}
.meter i.low{background:var(--red)}

.pill.lv0{color:var(--muted);border-color:var(--rule)}
.pill.lv1{color:var(--l1);border-color:var(--l1)}
.pill.lv2{color:var(--l2);border-color:var(--l2)}
.pill.lv3{color:var(--l3);border-color:var(--l3)}
.pill.lv4{color:#fff;background:var(--l4);border-color:var(--l4)}
.pill.d1{color:var(--muted)} .pill.d2{color:var(--ink-2)} .pill.d3{color:var(--red);border-color:var(--red)}

/* ---- dashboard ---- */
.dash-head{display:flex;gap:2rem;align-items:center;justify-content:space-between;
  padding:2.8rem 0 1.6rem;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.dash-head h1{font-family:var(--serif);font-size:2.4rem;font-weight:500;letter-spacing:-.022em;
  margin:.5rem 0 .5rem;line-height:1.05}
.dash-sub{margin:0;font-family:var(--serif);font-size:1.02rem;color:var(--ink-2);
  max-width:52ch;line-height:1.6}
.bigring{text-align:center;flex:none}
.ringc{width:150px;height:150px}
.ringlab{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-top:.2rem}

.card.act{text-decoration:none;color:inherit;display:block;transition:border-color .15s,transform .15s}
.card.act:hover{border-color:var(--ink-2)}
.card.act.lead{border-color:var(--red);background:var(--red-wash)}
.card.act.off{opacity:.5;pointer-events:none}
.card.act .go{display:inline-block;margin-top:.6rem;font-family:var(--mono);font-size:.7rem;
  letter-spacing:.08em;color:var(--red)}

.domgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.8rem}
.domcard{display:block;text-decoration:none;color:inherit;background:var(--raised);
  border:1px solid var(--rule);border-radius:var(--r);padding:.95rem 1.05rem;transition:border-color .15s}
.domcard:hover{border-color:var(--ink-2)}
.domtop{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.5rem}
.domtop h3{margin:0;font-size:.95rem;font-weight:600;flex:1}
.dommet{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.domblurb{margin:.6rem 0 .7rem;font-size:.82rem;color:var(--muted);line-height:1.5}
.sparks{display:flex;gap:2px;margin-bottom:.5rem}
.spark{width:100%;height:6px;border-radius:1px;background:var(--l0);flex:1}
.spark.l1{background:var(--l1)} .spark.l2{background:var(--l2)}
.spark.l3{background:var(--l3)} .spark.l4{background:var(--l4)}
.domsub{font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.06em}

.daybars{display:flex;gap:3px;align-items:flex-end;height:70px}
.db{flex:1;background:var(--sunk);border-radius:1px;display:flex;align-items:flex-end;min-height:4px}
.db.empty{background:var(--sunk);opacity:.45;height:4px;align-self:flex-end}
.db i{display:block;width:100%;border-radius:1px}

.legend{display:flex;gap:1.1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.lgi{display:flex;gap:.4rem;align-items:center;font-size:.75rem;color:var(--muted)}
.lgi .spark{width:16px;flex:none}

/* ---- practice runner ---- */
.qwrap{max-width:660px;margin:2rem auto 0}
.qhead{display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem}
.qcount{font-family:var(--mono);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qtitle{font-family:var(--sans);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:600;flex:1}
.qbar{height:2px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-bottom:2rem}
.qbar i{display:block;height:100%;background:var(--red);transition:width .35s}
.stage{min-height:60vh}
.qmeta{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.qstem{font-family:var(--serif);font-size:1.28rem;line-height:1.5;margin-bottom:1.4rem;
  letter-spacing:-.005em}
.qhint{font-size:.8rem;color:var(--muted);margin:0 0 .7rem}
.qbody{display:grid;gap:.45rem;margin-bottom:1.6rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;padding:.7rem .85rem;
  background:var(--raised);border:1px solid var(--rule);border-radius:var(--r);
  font-size:.93rem;line-height:1.5;width:100%;font-family:var(--sans);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink-2);background:var(--sunk)}
.opt .ok{font-family:var(--mono);font-size:.7rem;color:var(--muted);flex:none;
  width:1.4em;height:1.4em;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--rule);border-radius:2px;margin-top:.1rem}
.opt.sel{border-color:var(--ink);background:var(--sunk)}
.opt.sel .ok{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt.right{border-color:var(--verified);background:var(--verified-wash)}
.opt.right .ok{background:var(--verified);color:#fff;border-color:var(--verified)}
.opt.wrong{border-color:var(--red);background:var(--red-wash)}
.opt.wrong .ok{background:var(--red);color:#fff;border-color:var(--red)}
.opt:disabled{cursor:default;opacity:1}
.orderpool{display:grid;gap:.45rem}
.numrow{display:flex;gap:.6rem;align-items:center}
.numrow input{max-width:200px;font-family:var(--mono);font-size:1.05rem}
.numrow .unit{font-family:var(--mono);font-size:.85rem;color:var(--muted)}

.confrow{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:1.3rem;
  padding-top:1.1rem;border-top:1px dashed var(--rule)}
.clab{font-family:var(--mono);font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);margin-right:.4rem}
.conf.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.big{padding:.6rem 1.4rem;font-size:.9rem}
button:disabled{opacity:.4;cursor:not-allowed}

.verdict{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;padding:.7rem .9rem;
  border-radius:var(--r);margin:1.2rem 0 1rem}
.verdict.good{background:var(--verified-wash);border:1px solid var(--verified)}
.verdict.bad{background:var(--red-wash);border:1px solid var(--red)}
.verdict .vt{font-family:var(--sans);font-weight:600;font-size:.88rem}
.verdict.good .vt{color:var(--verified)} .verdict.bad .vt{color:var(--red)}
.verdict .vs{font-size:.82rem;color:var(--ink-2)}
.why,.model{background:var(--raised);border:1px solid var(--rule);border-left:2px solid var(--ink-2);
  border-radius:var(--r);padding:.85rem 1rem;margin-bottom:1.3rem}
.why .lbl,.model .lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.35rem}
.why p,.model p{margin:0;font-family:var(--serif);font-size:1rem;line-height:1.6}
.model{border-left-color:var(--verified)}
.selfscore{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:1.3rem}

.donehead{text-align:center;padding:1.5rem 0 2rem;border-bottom:1px solid var(--rule);margin-bottom:1.5rem}
.bigscore{font-family:var(--serif);font-size:3.6rem;line-height:1;font-weight:500;
  font-variant-numeric:tabular-nums}
.donesub{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin:.5rem 0 0}
.moves{display:grid;gap:.4rem}
.move{display:flex;gap:.8rem;align-items:center;padding:.45rem .7rem;background:var(--raised);
  border:1px solid var(--rule);border-radius:var(--r)}
.move .mn{font-size:.85rem;flex:1;min-width:0}
.move .md{font-family:var(--mono);font-size:.8rem;flex:none;width:3em;text-align:right;
  font-variant-numeric:tabular-nums}
.move .md.up{color:var(--verified)} .move .md.down{color:var(--red)}

/* ---- skill matrix ---- */
.skrows{display:grid;gap:.35rem}
.skrow{display:flex;gap:.75rem;align-items:center;padding:.55rem .8rem;background:var(--raised);
  border:1px solid var(--rule);border-radius:var(--r);text-decoration:none;color:inherit;
  transition:border-color .15s}
.skrow:hover{border-color:var(--ink-2)}
.skid{font-family:var(--mono);font-size:.65rem;color:var(--muted);flex:none;width:2.4em}
.skn{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.skn strong{font-size:.88rem;font-weight:600}
.skcore{font-size:.76rem;color:var(--muted);line-height:1.4}
.skm{display:flex;gap:.5rem;align-items:center;flex:none;width:130px}
.skpct{font-family:var(--mono);font-size:.72rem;width:2.6em;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--ink-2)}
.skrows.tight .skcore{display:none}
.skrows.tight .skrow{padding:.4rem .6rem}
@media (max-width:620px){.skcore{display:none}.skm{width:88px}}

.levels{display:grid;gap:.4rem}
.lvrow{display:flex;gap:.75rem;align-items:flex-start;padding:.6rem .8rem;background:var(--raised);
  border:1px solid var(--rule);border-radius:var(--r);font-size:.88rem;line-height:1.5}
.lvrow.cur{border-color:var(--verified);background:var(--verified-wash)}
.lvrow.past{opacity:.6}
.lvrow .pill{flex:none}

/* ---- analytics ---- */
.fcbars{display:flex;gap:2px;align-items:flex-end;height:60px}
.fb{flex:1;display:flex;align-items:flex-end;min-height:2px;background:var(--sunk);border-radius:1px}
.fb i{display:block;width:100%;background:var(--ink-2);border-radius:1px;min-height:2px}

/* ---- exercises ---- */
.excard,.proccard{background:var(--raised);border:1px solid var(--rule);border-radius:var(--r);
  margin-bottom:1rem;overflow:hidden;scroll-margin-top:1rem}
.excard.locked{opacity:.62}
.exhead,.prochead{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 1rem;
  background:var(--sunk);border-bottom:1px solid var(--rule)}
.extier{font-family:var(--mono);font-size:.66rem;color:var(--red);flex:none;padding-top:.15rem}
.exhead h3,.prochead h3{margin:0 0 .25rem;font-size:1rem;font-weight:600}
.exmeta{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;font-family:var(--mono);
  font-size:.64rem;color:var(--muted)}
.exmeta a{color:var(--muted);text-decoration:none}
.exmeta a:hover{color:var(--ink)}
.exmeta .dot{width:2px;height:2px;background:var(--rule);border-radius:50%}
.exbody,.procbody{padding:1rem}
.exbrief{font-family:var(--serif);font-size:1rem;line-height:1.6;margin:0 0 1rem;color:var(--ink)}
.exdel,.exsteps,.exhist,.exform{margin-bottom:1.1rem}
.exdel .lbl,.exsteps .lbl,.exhist .lbl,.exform .lbl{font-family:var(--mono);font-size:.6rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.4rem}
.exdel p{margin:0;font-size:.9rem;color:var(--ink-2);line-height:1.55}
.exsteps ol{margin:0;font-size:.9rem;font-family:var(--sans)}
.exsteps li{margin-bottom:.4rem;color:var(--ink-2)}
.vrow{display:flex;gap:.4rem;flex-wrap:wrap}
.vchip{display:flex;gap:.4rem;align-items:baseline;padding:.3rem .6rem;background:var(--paper);
  border:1px solid var(--rule);border-radius:var(--r);font-family:var(--mono);font-size:.72rem}
.rrow{display:flex;gap:.7rem;align-items:center;margin-bottom:.4rem;flex-wrap:wrap}
.rc{flex:1;min-width:180px;font-size:.85rem}
.rb{display:flex;gap:.2rem;flex:none}
.rb button{width:2em;padding:.2rem 0;font-family:var(--mono);font-size:.72rem}
.rl{font-size:.76rem;color:var(--muted);flex:none;width:170px}
@media (max-width:620px){.rl{width:100%}}
.exform textarea{margin:.6rem 0 .8rem}

/* ---- processes ---- */
.phase{margin-top:1.1rem}
.phase h4{margin:0 0 .5rem;font-family:var(--sans);font-size:.72rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--red);font-weight:600}
.pstep{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem .6rem;margin-bottom:.25rem;
  background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);cursor:pointer;
  text-transform:none;letter-spacing:0;font-family:var(--sans);color:var(--ink)}
.pstep:hover{border-color:var(--ink-2)}
.pstep.did{border-color:var(--verified);background:var(--verified-wash)}
.pstep.did strong{text-decoration:line-through;opacity:.7}
.pstep input{width:auto;flex:none;margin-top:.22rem}
.pstep strong{display:block;font-size:.86rem;font-weight:600;margin-bottom:.1rem}
.pstep .ph{display:block;font-size:.78rem;color:var(--muted);line-height:1.45}
.procbody .bar{margin:.8rem 0 0}

/* ---- save warning + backup page ---- */
.savewarn{font-family:var(--sans);font-size:.75rem;color:#fff;background:var(--red);
  padding:.2rem .55rem;border-radius:var(--r);text-decoration:none;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.savewarn:hover{opacity:.9}
.syncpill{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-decoration:none;
  padding:.2rem .5rem;border-radius:var(--r);border:1px solid var(--rule);color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.syncpill.ok{color:var(--verified);border-color:var(--verified)}
.syncpill.warn{color:var(--red);border-color:var(--red)}
.syncpill.busy{opacity:.6}
.acct{display:flex;gap:.8rem;align-items:center;background:var(--raised);border:1px solid var(--rule);
  border-radius:var(--r);padding:.75rem .9rem;margin-bottom:1rem}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;border:1px solid var(--rule)}
.btnlink{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;
  font-family:var(--sans);font-size:.85rem;padding:.5rem 1rem;border-radius:var(--r)}
.btnlink:hover{opacity:.88}

/* ---------- content studio ---------- */
.sp{flex:1}
.plain{list-style:none;margin:.4rem 0 0;padding:0;display:grid;gap:.35rem}
.plain li{font-size:.85rem;color:var(--ink-2);padding-left:1rem;position:relative}
.plain li::before{content:'—';position:absolute;left:0;color:var(--muted)}
.backlink{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted)}
.backlink:hover{color:var(--ink)}

.sbar{position:sticky;top:calc(var(--tbarh,3rem));z-index:15;display:flex;gap:.5rem;
  align-items:center;flex-wrap:wrap;padding:.6rem .75rem;margin:1rem 0 1.4rem;
  background:var(--raised);border:1px solid var(--rule);border-radius:var(--r)}
.sbarmsg{font-size:.78rem;color:var(--muted);flex-basis:100%;order:9}
.sbarmsg.ok{color:var(--verified)}
.sbarmsg.bad{color:var(--red)}

.sform{display:grid;gap:1.35rem;margin-top:.5rem}
.sfield{display:grid;gap:.3rem;min-width:0}
.sfield>label{margin:0}
.shint{font-size:.74rem;color:var(--muted);line-height:1.45}
.sgrid2,.sgrid3,.sgrid4{display:grid;gap:.6rem;min-width:0}
.sgrid2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.sgrid3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.sgrid4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

<script>
/* Part I — Foundations (Chapters 1–7)

window.PART1 = [
{
  id:'ch0', num:0, part:1, minutes:10, labs:[],
  title:'Start here',
  concept:'Ten minutes. Nothing to install, nothing to sign up for, and no prior knowledge assumed.',
  takeaway:[
    'Tell the difference between the app and the model — which is most of what lets you hold a design conversation.',
    'Know that you can tap any underlined word to find out what it means, without leaving the page.'
  ],
  story:[
    ['p','Most people who give up on a technical subject do not give up because it was hard. They give up because a word went past on page three that everyone else seemed to understand, and rather than stop, they kept reading — understanding a little less each paragraph until the whole thing felt like it was written for somebody else.'],
    ['key','If that has happened to you before, it was the writing’s fault, not yours. Two things here are built to stop it.'],
    ['p','<strong>Every word is tappable.</strong> The first time a term appears that means something specific, it gets a faint dotted underline. Tap it, and a plain explanation appears right there — you never leave the page or lose your place.'],
    ['p','Try it on this sentence, which contains four of them: an <strong>app</strong> sends a <strong>prompt</strong> to a <strong>model</strong> and is billed in <strong>tokens</strong>. Tap each one now, before reading on. Some will say <em>you build this in Chapter 9</em> — that means the course has named it early on purpose, and the one-line version is genuinely all you need.'],
    ['try',{id:'ch0-tap',mins:2,min:12,rows:2,
      task:'Now write it back, roughly. What is the difference between the <em>app</em> and the <em>model</em>? Two lines. Getting it half-wrong here costs nothing — writing before being told is the whole point.',
      ph:'The app is … the model is …',
      after:'The model is a program on somebody else’s computers that takes text and returns text. No buttons, no memory, no idea a person exists. The app is your product — the screens and the code that decide what to send it and what to do with the reply. Everything a user experiences as “the AI” is really your app arranging things around a model that does one narrow thing. Holding those two apart is most of what separates a product manager who can hold a design conversation from one who cannot.'}],

    ['p','<strong>The second thing: this course stops and asks.</strong> Every few paragraphs there is a box like the one you just used. Some ask you to guess before you are told. Some ask you to write something. Some are real questions that count.'],
    ['p','They exist because reading and understanding feel identical from the inside, and only one of them is real. And getting one wrong is worth more than getting it right — a wrong answer you were confident about has found a belief you did not know was false, which is the most useful thing that can happen in a study session. Nobody sees any of it. There is no grade and no pass mark.'],

    ['p','That is all you need to use this. A few practical notes, and then Chapter 1.'],
    ['l',[
      '<strong>Nothing to install.</strong> The interactive tools in each chapter run right here in the page. There is an optional section in some chapters showing the same ideas as real code — it needs a free account and about twenty minutes of setup, and you can ignore it completely. Nothing later depends on it.',
      '<strong>One chapter per sitting.</strong> They are fifteen to twenty-five minutes. Stopping while you still have energy is what brings you back tomorrow; a huge first week followed by nothing is the usual way this ends.',
      '<strong>Your progress follows you.</strong> Signed in, everything saves against your account, so you can read on your phone and carry on at your desk.'
    ]],
    ['key','You will hit a chapter that feels too hard. That is scheduled, not exceptional. When it happens, the move is neither to push through nor to stop — it is to take the smallest step available and let the day end there. Every question has a “Stuck?” button that shows you the answer without counting it against you.'],
    ['try',{id:'ch0-quit',mins:3,min:40,rows:3,
      task:'Decide it now, while it is easy to think clearly. What will you do on the evening you do not want to open this? What is the smallest thing you would still be willing to do — and what will you tell yourself about the day you skipped?',
      ph:'When I do not want to open this, I will …',
      after:'The plans that survive a bad evening share three things. The smallest step is genuinely tiny — one question, two minutes, not a chapter. You know where to resume without having to decide, because deciding is the expensive part when you are tired. And the story about the missed day is settled in advance: a missed day is a missed day. It is not evidence of anything and it does not mean starting again. Everybody lapses. The people who finish are the ones who had already decided that lapsing was allowed.'}],
    ['p','That is the whole chapter. Nothing here needs remembering. Chapter 1 starts properly.']
  ]
},
{
  id:'ch1', num:1, part:1, minutes:20, labs:[],
  title:'What happens when your app asks an AI something',
  concept:'Three facts about the machine. Each one decides something you will have to design around.',
  takeaway:[
    'Explain why an AI can sound completely certain and be completely wrong.',
    'Say what a company is actually billed for when someone uses an AI feature.',
    'Explain why a long chat costs more per message than a short one — and why that is a product decision, not a technical detail.'
  ],
  story:[
    ['p','Start with your phone keyboard. You type <em>See you at the</em> and it offers <em>office</em>, <em>station</em>, <em>airport</em>. It is guessing the next word from patterns in what people usually type. It is not thinking about your evening.'],
    ['p','An AI model is that, made enormous. It was built by reading a very large amount of writing and getting extremely good at one narrow trick: guessing what text comes next. Do that trick over and over and whole paragraphs come out. That is genuinely all it does.'],
    ['key','It is guessing, not looking up. There is no database behind it that it consults. This one fact causes most of the surprises in this field.'],
    ['pred',{id:'ch1-guess',short:true,ph:'One line — what do you think it does?',
      ask:'So: you ask it about a refund policy at a company that does not exist. It has never seen anything about it. What comes back?',
      reveal:'A confident, well-written, completely invented policy. Not because it is lying — because “guess what text comes next” has no option for “I have nothing here.” Saying <em>I don’t know</em> is a behaviour that has to be added on top, and it does not always hold.',
      then:'This is why you cannot judge an AI answer by how confident it sounds. It sounds identical either way. Chapter 2 is entirely about this.'}],

    ['p','Now the practical part: what actually gets sent, and what you get charged for.'],
    ['p','Your app sends text. The AI sends text back. You are billed for both — for how much went in, and how much came out. Not by the word, though. By something slightly smaller.'],
    ['p','Text gets chopped into pieces called <strong>tokens</strong>. Roughly, a token is about three-quarters of an English word. Common words are usually one token each; unusual words and other scripts break into several. Try it — this is the actual thing, running here:'],
    ['lab','tokenizer'],
    ['p','Type a normal sentence and watch it split. Then try your own name, and then something in Hindi or Tamil if you have it. Notice how many more pieces those become. Every extra piece is money.'],
    ['q','I001'],

    ['p','Second fact: there is a size limit. Everything sent in one go — the question, any instructions you attach, any documents, plus the answer coming back — has to fit inside a ceiling. The industry calls that ceiling the <strong>context window</strong>.'],
    ['p','It is worth being precise about what it is not. It is not memory. It is the size of one delivery.'],
    ['q','I006'],

    ['p','Which brings us to the third fact, and the strangest one.'],
    ['key','The AI forgets you completely the moment it replies. Every request starts from nothing. It has no idea you spoke to it a minute ago.'],
    ['p','That raises an obvious question: so how does a chat assistant seem to remember what you said five messages back?'],
    ['p','It does not. The app re-sends the entire conversation every single time. When you type message six, the app quietly sends messages one to five along with it, so the reply makes sense. The memory is a trick performed by the app, not a property of the AI.'],
    ['p','And since you pay for everything you send — you pay for that whole history again, on every message. Watch it happen:'],
    ['lab','receipt'],
    ['q','I010','I011'],

    ['p','That is the chapter. Three facts, and each one lands on your desk rather than an engineer’s:'],
    ['l',[
      '<strong>It guesses.</strong> So “does it sound confident?” tells you nothing, and you will need a way to actually check answers.',
      '<strong>There is a size limit.</strong> So you cannot simply hand it everything you own and hope. Deciding what gets sent is a design job.',
      '<strong>It forgets.</strong> So memory is something your product builds and pays for, message by message — not a feature you get from the vendor.'
    ]],
    ['try',{id:'ch1-explain',mins:3,min:40,rows:3,
      task:'Last thing, and it is the one that sticks. Write the two sentences you would say to a colleague who asks why a long chat with an AI costs more than a short one. Plain words — no jargon, and nothing you could not defend if they pushed back.',
      ph:'Two sentences.',
      after:'A good answer has both halves: what happens, and what it means. What happens — the AI remembers nothing, so the app sends the whole conversation again with every message. What it means — the cost of a conversation grows the longer it gets, and that cost is ours, not the vendor’s. If you got both halves, you understand this chapter better than most people who have shipped an AI feature.'}],
    ['c','Optional, if you want one thing to try','Open any AI chat you already use. Ask it something about your own company that it could not possibly know — phrased as though the answer obviously exists. See whether it refuses or invents. That is the whole of Chapter 2, and it takes two minutes.']
  ]
},
{
  id:'ch2', num:2, part:1, minutes:20, labs:['temperature'],
  title:'Telling it how to behave — and watching it lie',
  concept:'You get two controls over the AI. Neither of them makes it truthful.',
  needs:[
    ['It guesses, it does not look up','There is no database behind it. It continues text plausibly.',1],
    ['It forgets between messages','Anything it should know has to be sent again every time.',1],
  ],
  takeaway:[
    'Say what a system prompt is and why it is re-sent on every single message.',
    'Explain why a confident tone tells you nothing about whether an answer is right.',
    'Tell the difference between discouraging bad behaviour and removing its cause — the distinction most AI safety claims blur.'
  ],
  story:[
    ['p','Chapter 1 left you with a machine that forgets everything the moment it replies. Which raises a practical problem: if it forgets, how does a company make it behave a particular way — always polite, always in English, never discussing competitors?'],
    ['p','The answer is unglamorous. The app just re-sends the instructions every time, along with everything else. That standing instruction has a name: the <strong>system prompt</strong>. It is a paragraph of ordinary English, sent invisibly with every message, saying who the AI is meant to be and what it must not do.'],
    ['p','It is worth knowing how ordinary this is, because you will hear it dressed up. When a vendor says they have "customised the AI for your organisation," the honest translation is usually: <em>we wrote a paragraph of instructions.</em> Sometimes that is genuinely all it is.'],
    ['q','I013','I014'],

    ['p','The second control is a dial. Remember that the machine is guessing the next piece of text — and at each step several guesses are plausible. The dial decides whether it always takes the most likely one, or occasionally picks something less likely.'],
    ['p','Turned down, you get the same answer to the same question every time. Turned up, you get variety. It is called <strong>temperature</strong>, and you can move it here:'],
    ['lab','temperature'],
    ['pred',{id:'ch2-temp',short:true,ph:'Up or down — and what you give up',
      ask:'Your product answers questions about a refund policy. Should that dial be turned up or down, and what are you trading away?',
      reveal:'Down, near zero. You are giving up variety, which you never wanted here, to get repeatability, which you badly need — the same question should not produce a different policy on Tuesday.',
      then:'But here is the trap, and it catches experienced people. Turning it down does not make it <em>truthful</em>. It makes it <em>consistent</em>. A wrong answer at temperature zero is wrong the same way every single time.'}],
    ['q','I015'],

    ['p','Which brings us to the thing that makes this whole field difficult.'],
    ['key','It cannot tell you it does not know. Not because it is hiding something — because "guess the next piece of text" has no option for silence. Refusing has to be trained in on top, and it does not always hold.'],
    ['p','You predicted this in Chapter 1. Here is why it matters more than it first appears: the invented answer is not obviously worse than a true one. It has the same structure, the same calm tone, the same specificity. It will cite a clause number. It will give a percentage. Everything that normally signals that someone knows what they are talking about is still there, because those signals are patterns in text, and patterns in text are exactly what the machine reproduces.'],
    ['p','The industry word for this is <strong>hallucination</strong>, which is a slightly unfortunate name — it suggests a malfunction. It is not one. It is the machine doing precisely what it was built to do, in a situation where you wanted something else.'],
    ['q','I017','I019'],

    ['p','So the obvious move is to add an instruction: <em>only answer from the documents provided; if the answer is not there, say you do not know.</em> That helps. It genuinely reduces how often this happens.'],
    ['p','It does not fix it, and the reason is worth holding on to.'],
    ['try',{id:'ch2-guard',mins:4,min:40,rows:3,
      task:'Write that instruction in your own words — one sentence you would put in a system prompt to stop it inventing a policy it has not been shown. Then, underneath, write the question you would use to get around your own instruction.',
      ph:'The instruction, then the question that beats it.',
      after:'The instruction is the easy half. The second half is the lesson: almost any such sentence loses to a question that <em>looks</em> answerable from the documents but is not — a policy that sounds adjacent to a real one, a date just outside the range covered, a scheme whose name is one word different. The machine cannot tell the difference between “this is nearly in my documents” and “this is in my documents,” because it is matching patterns, not checking facts. An instruction discourages the behaviour. It does not remove the reason the behaviour happens.'}],
    ['q','I020'],

    ['p','That distinction — discouraging a behaviour versus removing its cause — is one of the most useful things in this course, and you will use it in meetings for years. Someone will tell you a problem is handled because they added a rule. The question that follows is always: <em>does that remove the cause, or does it make the symptom rarer?</em>'],
    ['p','The rest of Part I is about removing the cause. If the machine invents things when it has no evidence, then the fix is not a better instruction. The fix is putting real evidence in front of it. That takes four chapters, and it starts with a problem that sounds trivial and is not: your documents are too big to send.'],
    ['q','I122']

{
  id:'ch3', num:3, part:1, minutes:20, labs:['chunker'],
  title:'Why documents have to be cut up',
  concept:'And why every way of cutting them loses something. Choosing which loss is your job.',

  story:[
    ['p','You want the AI to answer questions about your company’s documents. The obvious approach is to send it the documents. That fails immediately, for two separate reasons you already know.'],
    ['p','It will not fit — there is a ceiling on how much goes in one request. And you pay for every piece of text you send, on every single question, forever. Even where a huge document would technically fit, sending your entire library to answer one question is a bill you would not survive.'],
    ['q','I021'],

    ['p','So everyone does the same thing: cut the documents into pieces, keep the pieces, and send only the few that look relevant to whatever was asked. The pieces are called <strong>chunks</strong>, and the cutting is called chunking. That is the whole idea, and it is genuinely that simple.'],

{
  id:'ch5', num:5, part:1, minutes:25, labs:['meaningmap'],
  title:'Matching meaning instead of words',
  concept:'How “when do I get my money back” finds a paragraph about disbursement. This is the idea the whole industry is built on.',
  needs:[
    ['Word matching is blind to meaning','Two sentences meaning the same thing with no shared words are strangers to it.',4],

  story:[
    ['p','You need something that matches meaning rather than spelling. That sounds like it needs the machine to understand language, which sounds impossible. It is simpler than that, and the trick is genuinely elegant.'],
    ['p','Imagine an enormous map. Not of places — of meanings. Every possible sentence has a position on it. Sentences that mean similar things sit close together; sentences about unrelated things sit far apart. <em>When do I get my money back</em> and <em>reimbursement of approved claims</em> are neighbours, despite sharing no words, because they mean nearly the same thing.'],
    ['p','A separate, smaller AI does the positioning. You give it text, it gives back that text’s coordinates — a long list of numbers. The list is called an <strong>embedding</strong>, and the model that produces it an embedding model. That is all it does: text in, position out.'],
    ['q','I029'],

    ['p','Once every piece of your document has a position, finding relevant pieces stops being about words at all. It becomes geometry: get the position of the question, then find the pieces sitting nearest to it. Comparing two positions gives one number — how close they are. Here is the map, running live:'],
    ['lab','meaningmap'],
    ['pred',{id:'ch5-sim',short:true,ph:'A number between 0 and 1',

      reveal:'High. Usually above 0.6, often near 0.8. That is the entire point: the position comes from meaning, so two texts that mean the same thing land near each other however they are spelled.',
      then:'One warning about that scale, because it costs people money in vendor meetings. The number technically runs from −1 to 1, but real text almost never drops below about 0.1. So 0.5 is not “half similar” — it is closer to the bottom of the useful range. Anyone quoting you a similarity number without telling you what their good and bad examples score is telling you nothing.'}],
    ['q','I032'],

    ['p','Two things about this are not obvious and both bite.'],
    ['p','<strong>Questions and answers are written differently.</strong> A question is short and interrogative; the paragraph answering it is long and declarative. Good embedding models are built knowing this, and expect to be told which is which. Get that wrong and quality quietly drops — nothing breaks, results are just worse, and nobody can see why.'],
    ['q','I030'],

    ['p','<strong>The map is only as good as whoever made it.</strong> It was built by reading text — overwhelmingly English text from the internet. Where your vocabulary was not well represented in that reading, the map gets it wrong. Two things your users consider completely different end up neighbours, or two things they consider identical end up far apart.'],

      after:'Indian financial and legal vocabulary is full of these: <em>lakh</em> and <em>crore</em>, NEFT versus IMPS, government scheme names differing by one word and by enormous sums. Regional languages typed in English letters — <em>paisa kab milega</em> — are another. So is anything internal: two product codenames mean unrelated things to you and nothing at all to the map, so it places them by their spelling. The test of whether you understand this is whether you can name the failure before a user finds it.'}],
    ['q','I031'],

    ['p','This technique is the foundation of nearly every "chat with your documents" product you will ever be shown. It is genuinely good. Note what it still does not do, though: it finds the nearest pieces, always, even when nothing is close. Chapter 4’s problem has not gone anywhere. Which is why the next chapter is about measurement, and why it is the most important one in Part I.']

    ['p','<strong>Two: there are two ways to fail, and they pull against each other.</strong> Picture asking an assistant to fetch the files relevant to a meeting. They can fail two ways: leave out something that mattered, or bury you in things that did not.'],
    ['p','Leaving out what mattered is called poor <strong>recall</strong>. Burying you in irrelevance is poor <strong>precision</strong>. The lever between them is how many pieces you fetch per question — usually written <strong>k</strong>. Fetch more and you miss less, but more of what you fetch is junk. Fetch fewer and everything you get is relevant, but you miss things.'],

    ['p','That is the chapter, and it is the one that changes how people treat you. Almost nobody in an AI conversation has an answer key. Once you have one, you are the only person in the room who can say whether anything is working — and you can say it with a number you produced.']

    {h:'Step 5 — Wire It To Chapter 7', b:[

      ['x','The cricket question now returns <code>found: false</code> — a value your code can branch on, rather than a sentence your code has to pattern-match. Notice what you gained: “Not found in the provided documents” was a string a human had to read; <code>found: false</code> is a routing decision.']

{

  title:'When it stops answering and starts doing',
  concept:'An agent is a loop with a model in it. Knowing that is most of what protects you from the word.',
  needs:[
    ['It re-sends everything every time','Which is why anything that loops gets expensive faster than it looks.',1],
    ['A schema forces a shape','You can require structured output rather than asking for it.',8],
  ],
  takeaway:[
    'Define an agent in one sentence, without using the word “autonomous”.',

  story:[
    ['p','Until now the machine only spoke. Everything it produced was text for a person to read or fields for your code to store. Now it does things: looks something up, sends an email, books a slot, updates a record.'],
    ['p','There is no magic in the mechanism, and you can hold all of it in your head at once.'],
    ['n',[
      'You describe the available functions in the request — name, what each does, what arguments it takes. This is just more text.',
      'The model replies not with prose but with a request: <em>call this one, with these arguments.</em>',
      '<strong>Your code</strong> runs the function. Not the model — the model cannot run anything. It can only ask.',
      'You send the result back, added to the conversation.',
      'It either asks for another call, or writes a final answer. Repeat until it stops, or until you stop it.'
    ]],
    ['key','That loop is the whole thing. An agent is a model, a set of functions, a loop, and a rule for when to stop. Nothing in that sentence is mysterious, and the fourth part is the one people forget to specify.'],
    ['q','I063','I064'],
    ['p','Step through one and watch where it goes wrong:'],
    ['lab','agentloop'],

    ['p','Three things about this deserve to be lodged permanently.'],
    ['p','<strong>The function description is product surface.</strong> The model picks a function by reading its description. That is the entire selection mechanism — no cleverness behind it, just prose. A vague description means the wrong function gets called, and that is a writing bug, not a model failure.'],
    ['try',{id:'ch9-tool',mins:4,min:40,rows:3,
      task:'Write one. The function looks up a customer’s current outstanding balance — not their payment history, not their credit limit. Write the description the model will read. Then name the function it would most likely be confused with.',
      ph:'Description, then the one it gets confused with',
      after:'A good description says what it returns, what it does <em>not</em> return, and when to prefer something else — because ambiguity between two functions is a bug you wrote. “Returns the current outstanding balance for one customer as of today. Does not return payment history, credit limit, or projected dues — use get_payment_history or get_credit_terms for those.” Naming the neighbour inside the description is the trick most teams find only after shipping the confusion.'}],
    ['q','I066'],

    ['p','<strong>Every step multiplies the bill.</strong> Chapter 1 told you each request re-sends the whole conversation. A loop makes that compound.'],
    ['pred',{id:'ch9-cost',short:true,ph:'A multiple, like 4×',
      ask:'A single call sends about 1,200 pieces of text. A six-step agent re-sends a growing conversation at every step. Roughly how many times the single-call cost is the whole run?',
      reveal:'Far more than six. Each step re-sends everything before it plus whatever the last step returned, so the cost grows with the square of the number of steps rather than in a straight line. Six steps commonly lands near fifteen to twenty-five times a single call.',
      then:'Which is why an agent that “only” adds two more steps can double a bill. Step count is a product decision with a number attached, not an implementation detail.'}],
    ['q','I068'],

    ['p','<strong>Reading and doing are different universes.</strong> A function that reads is recoverable — worst case you got bad information and try again. A function that sends, pays, deletes or books is not. The email has gone. The refund has been issued.'],
    ['p','That asymmetry, rather than any amount of testing, is what should decide where a person sits in the loop. And it is a decision you make, not one an engineer makes for you.'],
    ['q','I067','I065']
  ],
  handson:[
    {h:'Step 1 — Give It Two Levers', b:[
      ['p','New notebook <code>chapter-9</code>. Define two tools, one obviously useful and one deliberately similar, so you can watch the model choose.'],
      ['code','tools = [\n  {"type":"function","function":{\n     "name":"get_policy_limit",\n     "description":"Return the maximum claimable amount for a given expense category.",\n     "parameters":{"type":"object",\n       "properties":{"category":{"type":"string"}},\n       "required":["category"]}}},\n  {"type":"function","function":{\n     "name":"get_exchange_rate",\n     "description":"Return today\'s exchange rate between two currency codes.",\n     "parameters":{"type":"object",\n       "properties":{"frm":{"type":"string"},"to":{"type":"string"}},\n       "required":["frm","to"]}}}\n]\n\nLIMITS = {"travel": 25000, "meals": 1500, "equipment": 60000}\nRATES  = {("USD","INR"): 88.2}\n\ndef run_tool(name, args):\n    if name == "get_policy_limit":\n        return {"limit": LIMITS.get(args["category"].lower(), None)}\n    if name == "get_exchange_rate":\n        return {"rate": RATES.get((args["frm"], args["to"]), None)}\n    return {"error": "unknown tool"}'],
      ['x','No output yet — you have built the levers, not pulled them.']
    ]},
    {h:'Step 2 — Write the Loop Yourself', b:[
      ['p','Type this rather than pasting. It is eighteen lines and it is the entire concept of agency in software.'],
      ['code','import json\n\ndef agent(question, max_steps=5, verbose=True):\n    msgs = [{"role":"system","content":\n             "Use the tools when a fact is needed. Never guess a number."},\n            {"role":"user","content":question}]\n    for step in range(max_steps):\n        r = client.chat.completions.create(\n            model="meta/llama-3.1-8b-instruct",\n            temperature=0, messages=msgs, tools=tools\n        ).choices[0].message\n\n        if not getattr(r, "tool_calls", None):\n            if verbose: print(f"[step {step}] final answer")\n            return r.content\n\n        msgs.append(r)\n        for call in r.tool_calls:\n            args = json.loads(call.function.arguments)\n            result = run_tool(call.function.name, args)\n            if verbose:\n                print(f"[step {step}] {call.function.name}({args}) -> {result}")\n            msgs.append({"role":"tool","tool_call_id":call.id,\n                         "content":json.dumps(result)})\n    return "STOPPED: step budget exhausted"\n\nprint(agent("I spent USD 300 on equipment. Am I within the policy limit in INR?"))'],
      ['x','A visible trace: <code>get_exchange_rate</code>, then <code>get_policy_limit</code>, then a final answer combining both. You have just watched a model decompose a question into two lookups and compose the results. Nothing in that loop is intelligent; the intelligence is entirely in the model\'s choice of which line to ask for next.']
    ]},
    {h:'Step 3 — Sabotage the Description', b:[
      ['p','Change <code>get_policy_limit</code>\'s description to something vague — <code>"Returns data about expenses."</code> — and re-run the same question.'],
      ['x','Wrong tool, or no tool, or the right tool with a nonsense category argument. Nothing about the model changed. You edited one sentence of English and degraded the system. File this permanently: <strong>tool descriptions are code.</strong>']
    ]},
    {h:'Step 4 — Return an Error and Watch the Narration', b:[
      ['p','Make <code>run_tool</code> return <code>{"error": "service unavailable"}</code> for the rate lookup, and re-run.'],
      ['x','Observe carefully. Some runs handle it correctly (“I could not retrieve the rate”). Others produce a confident final answer <em>with a plausible exchange rate in it</em>. That second behaviour is Chapter 2\'s hallucination, now inside a workflow that a downstream system trusts. Count how many of five runs narrate success over a failure.']
    ]},
    {h:'Step 5 — Remove the Budget', b:[
      ['p','Set <code>max_steps=50</code> and ask something the tools cannot resolve: <em>“What is the policy limit for interstellar travel in Martian credits?”</em>'],
      ['x','Repeated tool calls, often the same one with mutated arguments, until the budget ends it. Now watch your token counter. This is what an unbudgeted agent does to a bill at 3 a.m. Restore <code>max_steps=5</code> and add a rule: two identical consecutive calls end the run.']
    ]}
  ],
