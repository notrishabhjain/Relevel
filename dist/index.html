{
  id:'ch5', num:5, part:1, minutes:70, labs:['meaningmap'],
  title:'The Map of Meaning',
  concept:'Turning meaning into geometry so that “reimbursement” and “disbursement of approved amounts” become neighbours — the heart of the book.',
  story:[
    ['p','You wrote the job description yourself, pinned to a page in your notebook: <em>match what words mean, not how they are spelled — across dialects and languages.</em> This chapter delivers the candidate.'],
    ['p','Imagine a colossal map — not of places, but of meanings. Every possible piece of text has an address on this map, and the map has one property: texts that mean similar things live in the same neighbourhood. “Reimbursement” and “disbursement of approved claim amounts” — different spellings, same locality. “Contract,” “agreement,” “MoU” — a tight cluster. “Sandwich” — a distant suburb. Across languages, when the mapmaker has done its job, a word and its translation land as neighbours, because the map was drawn by meaning, not script.'],
    ['p','The machine that assigns these addresses is an <strong>embedding model</strong>. It reads text and outputs the text\'s address as a list of numbers — coordinates. Your GPS position needs two numbers because Earth\'s surface has two dimensions; capturing meaning requires far more room, so this map uses roughly a thousand dimensions. Nobody can picture 1024-dimensional space, and nobody needs to. The GPS intuition carries you the entire way: an address is a list of numbers, and neighbours have similar numbers. That list is called an <strong>embedding</strong>.'],
    ['q','I029'],
    ['p','How do you check whether two addresses are neighbours? One calculation compares the two number-lists and yields a single score — in practice between 0 and 1 — where higher means closer in meaning. Its name, <strong>cosine similarity</strong>, wears mathematical perfume, but the idea fits in one image: picture each address as an arrow pointing from the map\'s centre; the score measures whether two arrows point the same direction. Same direction → near 1. Unrelated → near 0. Today you compute it yourself, in one line, and confirm that nothing else lives inside the box.'],
    ['lab','meaningmap'],
    ['pred',{id:'ch5-sim',short:true,ph:'A number between 0 and 1',
      ask:'Predict, then check on the map above. <em>When do I get my money back?</em> and <em>disbursement of approved claim amounts</em> share not one word. What will their similarity score be?',
      reveal:'High — typically well above 0.6, often near 0.8, despite zero shared words. That is the whole point of the chapter: the address is assigned from meaning, so two texts that mean the same thing land near each other no matter how they are spelled.',
      then:'Now look at the scale itself. Cosine similarity runs from −1 to 1, but real text almost never falls below about 0.1 — so 0.5 is <em>not</em> the midpoint of anything. Reading it as “half similar” is one of the most common mistakes made in a vendor conversation.'}],
    ['p','The new retrieval procedure is then straightforward:'],
    ['n',['Once, in advance: compute the address (embedding) of every chunk. Store them.','Per question: compute the question\'s address too.','Score the question\'s address against every chunk\'s address, rank, take the top few.']],
    ['p','That is <strong>semantic search</strong> — and notice what it delivers: the plain-language question “when do I get my money back?” receives an address near the chunk reading “disbursement of approved claim amounts shall be effected within 60 days,” because the mapmaker read meaning, not spelling. No synonym dictionary was needed. No translation layer was bolted on. The map did it.'],
    ['q','I032'],
    ['c','Disclosure 1 — Questions and answers are written differently','The embedding model is trained asymmetrically. On every call you must declare whether you are sending a question (<code>input_type=\'query\'</code>) or a document piece (<code>input_type=\'passage\'</code>). Forget the declaration and nothing errors — retrieval quality just silently degrades. A real-world detail that separates people who have done this from people who have watched videos about it.'],
    ['q','I030'],
    ['c','Disclosure 2 — The map is only as good as the mapmaker','Where might a model trained predominantly on English internet text be weakest? Your homework runs the experiment, and what you measure on your documents and your language pair is worth more than any general claim.'],
    ['try',{id:'ch5-map',mins:4,min:40,rows:3,
      task:'Name a place where the mapmaker will fail <em>you</em>. Your actual domain, your actual users. Where would a map built mostly from English internet text put two things close together that your users consider completely different — or far apart when your users mean the same thing?',
      ph:'In our domain the map would get … wrong, because …',
      after:'Strong answers are concrete and domain-specific. Indian financial and legal vocabulary is a rich seam: <em>lakh</em> and <em>crore</em>, <em>demat</em>, NEFT versus IMPS, scheme names differing by one word and by crores of rupees. Regional-language queries typed in Latin script — <em>paisa kab milega</em> — are another. So is any internal jargon: two product codenames meaning unrelated things sit next to each other because the map has never seen either. The test is whether you can name the failure before a user finds it for you.'}],
    ['q','I031'],
    ['p','<strong>Carry forward from Chapter 4:</strong> this new retrieval still never says no. Every question gets an address; some chunk is always nearest; a respectable score attaches to it even when the true answer is nowhere in your corpus. Chapter 6 builds the instrument that catches this.']
  ],
  words:[
    ['Embedding','A text\'s address on the meaning map: a list of ~1024 numbers. Similar meaning → similar numbers.'],
    ['Embedding model','The mapmaker — reads text, outputs its address.'],
    ['Cosine similarity','The one-line neighbour test between two addresses. Higher = closer in meaning.'],
    ['Semantic search','Retrieval by meaning-map addresses instead of spelling.'],
    ['query vs. passage','The mandatory declaration of what you are embedding — a question or a document piece.'],
    ['Vector','Mathematics\' word for a list of numbers. Embeddings are vectors — hence <strong>vector database</strong>: a system that stores millions of addresses and finds nearest neighbours fast.']
  ],
  handson:[
    {h:'Part 1 — Watch Meaning Become Geometry', b:[
      ['p','New notebook <code>chapter-5</code>. Warm-up cells. Then type this slowly — it is the most important code in the book.'],
      ['code','import numpy as np\n\ndef embed(texts, input_type):\n    resp = client.embeddings.create(\n        model="nvidia/nv-embedqa-e5-v5",\n        input=texts,\n        extra_body={"input_type": input_type, "truncate": "END"}\n    )\n    return [np.array(d.embedding) for d in resp.data]\n\ndef cosine(a, b):\n    return float(np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b)))'],
      ['p','Plain-language tour: <code>embed</code> mails one or more texts to the mapmaker and returns their addresses. <code>cosine</code> is the entire neighbour test — multiply the two lists position by position, adjust for their overall lengths, and out drops the score. That is all.'],
      ['code','words = ["contract", "agreement", "MoU", "sandwich"]\nvecs = embed(words, "passage")\nprint("numbers per address:", len(vecs[0]))\nfor i in range(len(words)):\n    for j in range(i + 1, len(words)):\n        print(f"{words[i]:10s} vs {words[j]:10s} → {cosine(vecs[i], vecs[j]):.3f}")'],
      ['x','<code>numbers per address: 1024</code>, then six scores in which contract/agreement/MoU pair high (commonly 0.5–0.8) while every <em>sandwich</em> pairing sits clearly lower (commonly 0.1–0.35). Exact values vary; only the gap matters. The meaning map is real, on your screen, verified by your own single line of mathematics.']
    ]},
    {h:'Part 2 — Cure Chapter 4', b:[
      ['p','Bring in your 15–20 chunk cards from Chapter 3.'],
      ['code','chunks = [\n    "…paste chunk 1 text…",\n    "…paste chunk 2 text…",\n    # …all of them…\n]\nchunk_vecs = embed(chunks, "passage")   # every chunk gets its address, once\n\ndef retrieve(question, k=3):\n    q = embed([question], "query")[0]        # note: "query" for questions\n    scores = [cosine(q, cv) for cv in chunk_vecs]\n    ranked = sorted(range(len(chunks)), key=lambda i: scores[i], reverse=True)\n    for i in ranked[:k]:\n        print(f"score {scores[i]:.3f} | chunk {i}: {chunks[i][:80]}…")\n    return ranked[:k]'],
      ['p','Now run all five original questions and all three assassins from Chapter 4. For each, compare against your handwritten Chapter 4 rankings.'],
      ['x','The synonym assassin — zero score yesterday — now surfaces the correct chunk at or near rank one. The plain-language question improves dramatically. The second-language question: genuinely uncertain, depending on the model\'s training. Whatever you observe is a finding. Write it down with scores.'],
      ['p','Finally: ask something the document cannot possibly answer. Confirm that top-3 chunks arrive anyway, wearing scores that do not look obviously wrong. <em>Retrieval never says no</em> — proven now in both dialects.']
    ]}
  ],
  wrong:[
    ['4xx on the embeddings call','Missing <code>extra_body</code>','The <code>extra_body={"input_type": …}</code> argument is mandatory for this embedding model.'],
    ['429 Too Many Requests','Loop hit the per-minute rate limit','Add <code>import time; time.sleep(2)</code> inside the loop.'],
    ['Scores all suspiciously similar (0.7–0.8 for everything)','You embedded questions as <code>passage</code>','Re-check the declaration. This is Disclosure 1 biting exactly as promised — silently.']
  ],
  homework:[
    ['The comparison table','For all eight questions — rank under keyword (Ch. 4) versus semantic (today). Five bullets on the pattern. Check your exact-string question from Chapter 4 Step 3: did semantic search fumble it? If yes, you have found the hybrid-search case in your own data.'],
    ['The second-language experiment','Embed a key term and its translation (both as <em>passage</em>) and take their cosine. Then retrieve with 2–3 questions in the second language. Verdict in three bullets: is this mapmaker sufficient for a user-facing system in that language? What would you demand a vendor demonstrate before trusting the word “multilingual”?'],
    ['Explain it upward','4–5 sentences — how the system finds relevant text by meaning, and why “the system found something” still does not mean “the answer exists.”']
  ],
  check:[
    ['What is an embedding, in one sentence a senior leader could repeat?','Every text is given an address on a map of meaning — a list of numbers — such that similar meanings receive nearby addresses; the system then searches by nearness instead of spelling.'],
    ['Why must you declare query vs. passage, and what happens if you don\'t?','Questions and answer-passages are phrased differently yet must land as neighbours; the model maps the two with matching-but-different projections. Skip the declaration and retrieval quality degrades silently — no error, just worse results.'],
    ['Semantic search solved the synonym problem. Name two problems it did not solve, both proved today.','(1) Retrieval still never says no — confident nearest-neighbours arrive even for unanswerable questions. (2) Exact strings and codes can rank worse than under plain keyword search — the persistent motivation for hybrid search.'],
    ['A vendor\'s slide reads: “1024-dimensional state-of-the-art embeddings.” What is the only useful response?','“Measured how, on whose questions, in which languages?” Dimensionality is a specification, not evidence. Retrieval quality on our documents and our users\' phrasing is the claim that needs numbers.']
  ],
  red:['Exact codes fumbled by meaning-search — the hybrid case','The silent query/passage degradation']
},

{
  id:'ch6', num:6, part:1, minutes:70, labs:['prdial'],
  title:'Define Good',
  concept:'How to know whether the system actually works — converting “the demo looked impressive” into numbers you computed yourself.',
  story:[
    ['p','Every AI initiative eventually arrives at one question, asked by the most senior person in the room: <em>Is it good?</em> In almost every room, the answers offered are emotional — the demo was impressive, it answered my questions, the team likes it. The professional counter-move is two words: <strong>Define good.</strong>'],
    ['p','The machinery behind those two words is not new to anyone who has written test cases or acceptance criteria: verified expectations written before the trial, pass/fail grading against them, and agreed sign-off thresholds. Evaluating an AI system is exactly that discipline. This chapter aims a skill many professionals already possess at a target most of them never think to point it at.'],
    ['p','<strong>Idea 1 — Ground truth: the answer key, written before the exam.</strong> You cannot grade a system by asking it things and nodding at fluent replies — Chapter 2 established that fluency is free and means nothing. You need a set of questions whose correct answers, and their locations in your corpus, you have verified in advance. That verified set is <strong>ground truth</strong>. No ground truth, no evaluation — only vibes.'],
    ['q','I040'],
    ['pred',{id:'ch6-first',short:true,ph:'A fraction, like 6/10',
      ask:'Commit a number now, before you build anything. On the first honest run of a retrieval system against a ground-truth set you wrote yourself, how many of ten questions will retrieve a correct chunk in the top three?',
      reveal:'Six or seven out of ten is a normal, healthy first result. If you measured nine or ten, the likeliest explanation is not that your system is excellent — it is that you wrote the questions after reading the chunks, in their vocabulary. That is not a test; it is a mirror.',
      then:'Put this number in your Prediction Ledger. The gap between what you predicted and what you measure is worth more to you than the measurement.'}],
    ['c','The right question','When anyone claims “95% accuracy,” ask first: <em>against which ground truth? Who wrote it? Does it resemble our real users\' questions?</em> An accuracy number without its question set is an anecdote wearing a percentage.'],
    ['q','I103'],
    ['p','<strong>Idea 2 — Two ways to fail, pulling in opposite directions.</strong> Picture an office assistant sent to fetch the relevant files for a decision. He can fail in two directions. He can miss files that mattered — the decision gets made on incomplete papers. Or he can bury the desk — the two relevant files are somewhere in the pile, under thirty irrelevant ones.'],
    ['tb',['Failure type','Industry name','What causes it','How to reduce it'],[
      ['Missing files that mattered','Low <strong>recall</strong>','Top-k too small — not retrieving enough chunks','Raise k (but see the cost)'],
      ['Desk buried in irrelevant material','Low <strong>precision</strong>','Top-k too large — retrieving too many chunks','Lower k or improve the retrieval method'],
      ['Both worsen simultaneously','The trade-off','k cannot be raised and lowered at once','Accept it; decide which failure is cheaper']
    ]],
    ['lab','prdial'],
    ['q','I044','I045'],
    ['p','Every retrieval system lives in the tension between recall and precision. The lever is top-k. Raise k and recall rises; precision falls; token cost rises. Lower k and the reverse. Today you turn that dial on your own system and watch both numbers move under your own hand.'],
    ['q','I047'],
    ['p','<strong>Idea 3 — “Good” belongs to the use case, not the technology.</strong> A customer-facing answer bot and an internal drafting assistant should not be graded on the same rubric. For the customer bot, a wrong answer about eligibility is the catastrophic failure; “I could not find this — please contact us” is perfectly acceptable. For the internal drafting tool, imperfect drafts get caught by the reviewing professional, but a tool that constantly refuses to try is abandoned on day two.'],
    ['key','Deciding which failure type is cheap and which is fatal belongs to whoever owns the use case and its risks. That decision then drives everything technical: the k you choose, the guardrails you demand, the numbers required before go-live.'],
    ['try',{id:'ch6-fatal',mins:5,min:50,rows:4,
      task:'Make the decision that is actually yours. For a feature you work on: which failure is cheap and which is fatal — missing something that mattered, or including something irrelevant? Say why in terms of what happens to a real user, then say what k you would therefore start at.',
      ph:'For … the fatal failure is … because … so I would start at k = …',
      after:'A strong answer ties the choice to a consequence, not a preference. A customer-facing answer bot: including something irrelevant is fatal, because a wrong policy quoted confidently to a customer is a liability, while missing an answer only creates a support ticket — so precision first, low k, and a refusal path. An internal legal research tool inverts it completely: a missed precedent can lose a case, an extra irrelevant one costs a lawyer thirty seconds — so recall first, high k. Neither answer is right in general, and the person who owns the use case is the only one who can make the call.'}],
    ['q','I046'],
  ],
  words:[
    ['Evaluation','Grading the system against verified expectations — acceptance testing, aimed at AI.'],
    ['Ground truth','The pre-verified answer key: questions, correct answers, and their locations in the corpus.'],
    ['Recall','Of everything that mattered, how much did the system fetch? Missed files = low recall.'],
    ['Precision','Of everything the system fetched, how much mattered? Buried desk = low precision.'],
    ['Precision–recall trade-off','Improving one typically costs the other; top-k is the everyday lever.'],
    ['Acceptance criteria','The pre-agreed numbers and behaviours required before go-live.']
  ],
  handson:[
    {h:'Step 1 — Write the Answer Key', b:[
      ['p','Build your ground truth: ten questions about your Chapter 3 document. Reuse your eight (five originals plus three assassins) and add two more — one of which <strong>must be unanswerable</strong> from this document, with the correct answer being “not in this corpus.” For each question, record the verified answer and which chunk numbers contain it.'],
      ['x','Verify from the document, not from memory. This is the single most reused artifact in the whole book — Chapters 12, 14 and 18 all run against it.']

    {h:'Step 2 — Commit to a Prediction', b:[

    ]},
    {h:'Step 4 — Turn the Dial', b:[
      ['p','Re-grade all ten questions at k=1 and k=8. Fill in this table by hand:'],
      ['tb',['k','Correct-chunk hits (of 9)','Relevant / total fetched'],[['1','','… / 9'],['3','','… / 27'],['8','','… / 72']]],
      ['x','Hits rise as k grows (recall climbing) while the relevant-fraction falls (precision sinking) — and k=8 costs roughly eight times the tokens of k=1, per question, forever. You have produced the most-cited chart in applied AI by hand, on your own documents, on a Tuesday evening.']
    ]},
    {h:'Step 5 — Face Your Prediction', b:[

    ['“The unanswerable question returned a 0.6 score”','Normal','That is exactly the finding. 0.6 looks respectable; it is junk. Record it as your threshold reference.']

  homework:[
    ['The ship-it memo','Five rough bullets: your table\'s numbers, and which k you would ship for (a) a customer-facing answer assistant, (b) an internal expert\'s drafting aide — one line of reasoning each. Different answers are expected.'],

  check:[
    ['A vendor reports 94% accuracy. Give the three questions that determine whether that number means anything.','Against which ground truth — who wrote it, does it resemble our real users\' questions? At which k was it measured? What did the other metric read at that setting — what was traded away?'],
    ['Explain precision and recall using the office-assistant-and-files story.','Recall: of the files that mattered, how many reached the desk. Precision: of the files on the desk, how many mattered. Fetch more and you miss fewer but bury deeper — the trade-off in one assistant.'],
    ['Why should k differ between a customer-facing bot and an internal drafting tool, and whose decision is that?','Because the cost of each failure type differs: wrong answers are fatal customer-facing but survivable internally; “cannot find” is survivable customer-facing but fatal for a drafting tool. Weighing those costs belongs to whoever owns the use case — not the implementation team.'],
    ['Why does the unanswerable question deserve a permanent seat in every ground-truth set?','Because it is where retrieval-never-says-no meets the confident liar — the compound failure that produces invented answers with invented citations. A system\'s behaviour at that point is its safety profile, and only a deliberate test row ever measures it.']

{
  id:'ch7', num:7, part:1, minutes:70, labs:['redmap'],
  title:'The Map, and the Machine Assembled',
  concept:'Nothing new — that is the point. Draw the complete system from memory, mark where it breaks, then staple six chapters into one working function.',
  story:[
    ['p','There is a name this book has deliberately withheld from you for six chapters. You have earned it now.'],
    ['p','The pipeline you have been building — cut documents into chunks (Ch. 3); give every chunk an address on the meaning map (Ch. 5); take an incoming question and retrieve the nearest chunks (Ch. 4–5); pack them into the envelope alongside a briefing page (Ch. 1–2); have the machine answer from that supplied text rather than from its imagination (Ch. 2) — with quality you can measure (Ch. 6) — is called, by the entire industry, <strong>RAG: Retrieval-Augmented Generation</strong>.'],
    ['try',{id:'ch7-draw',mins:6,min:60,rows:6,
      task:'From memory, with the chapter closed. Write the whole pipeline as a numbered list, from a document arriving to an answer reaching a user. Then mark with an asterisk every step where a wrong output can be produced without anything appearing to fail.',
      ph:'1. … 2. … (asterisk the silent failures)',
      after:'The pipeline: cut into chunks → embed each chunk → store → embed the question → find the nearest chunks → put them in the envelope with the question → generate → return with citations. Nearly every step fails silently. Chunking splits a rule from its exception and nothing errors. Retrieval returns a rank one for a question with no answer in the corpus and nothing errors. Generation writes a fluent answer from an irrelevant chunk and nothing errors. That is the defining property of this machine: it does not crash, it simply becomes wrong — which is why measurement is not overhead but the only thing standing between you and a confident lie.'}],
    ['p','Generation — Chapter 1\'s text machine. Augmented by retrieval — your Chapters 4 and 5. So that answers are grounded in your verified documents instead of hallucinated from the void.'],
    ['key','RAG is the single most deployed pattern in applied AI. It is the engine behind virtually every “chat with your documents” product and every document-heavy AI proposal that will cross your desk. And there was nothing in it — an envelope, scissors, a map of addresses, one line of neighbour-mathematics, a briefing page, and an answer key.'],
    ['pred',{id:'ch7-spend',rows:3,ph:'Your ranking, highest impact first',
      ask:'A stakeholder wants better answer quality and gives you one quarter. Rank these by impact per unit of effort before you read on: a bigger model, better chunking, a reranker, more prompt engineering, cleaning the corpus.',
      reveal:'Cleaning the corpus and fixing chunking almost always beat everything else, and a reranker is the cheapest large win after that. A bigger model is the most expensive and usually the smallest gain, because the failure was never that the model could not read — it was that the right evidence never reached it. Prompt engineering is the most reached-for and the most quickly exhausted.',
      then:'The general rule this points at: in a retrieval system, quality problems are evidence problems far more often than they are model problems. Spend where the evidence is.'}],
    ['q','I114','I116'],
    ['p','Vendors draw it with glowing hexagons and product logos. You have made every glowing hexagon, several of them in a plain editable document, and you know precisely where each one bleeds.'],
    ['p','Why withhold the name until now? Because vocabulary acquired before experience becomes jargon — words you can recognize but cannot defend. Vocabulary acquired after experience becomes testimony. When you say <em>RAG</em> from today onward, it will not be a word you learned. It will be a thing you did — including, most valuably, the ways you broke it.'],
    ['q','I117'],
    ['q','I118'],
  ],
  words:[
    ['RAG','Retrieval-Augmented Generation — the complete pattern you built: retrieve relevant verified text, then generate the answer from it. You now own every word in that sentence separately, which is the only honest way to own an acronym.']
  ],
  handson:[
    {h:'Act 1 — The Map From Memory', b:[
      ['p','Close everything. Blank page. Draw the full pipeline from memory:'],
      ['code','documents → chunks → addresses (embeddings) → stored\n    → question arrives → question\'s address\n    → nearest chunks retrieved\n    → envelope assembled (briefing + chunks + question) → answer'],
      ['p','Beside every arrow, one line in your own words about what happens there. Then — the part that turns a diagram into an architect\'s diagram — take a red pen and mark every place you have personally watched this pipeline fail, with the chapter where you watched it.'],
      ['x','Grade yourself honestly. The boxes and arrows are the easy half — any diligent viewer of explainer videos can draw boxes. The red marks are the architect. If fewer than six came from memory, revisit those chapters. A map without its dangers is a screenshot, and you did not complete six chapters to own a screenshot.'],
      ['p','Then retrieve your Chapter 1 notebook page — your first predictions. Read it slowly. Write the three beliefs that changed most between that page and today\'s map. Those three deltas are the measurement of this book.']
    ]},
    {h:'Act 2 — Assembly', b:[
      ['p','Notebook <code>chapter-7</code>. Warm-up cells; then paste in your <code>embed</code>, <code>cosine</code>, <code>chunks</code>, and <code>chunk_vecs</code> from Chapter 5. Now type the staple — reading each line as you go, because every line has a chapter behind it.'],
      ['code','def rag_answer(question, k=3):\n    q = embed([question], "query")[0]                     # Ch.5 — the question\'s address\n    scores = [cosine(q, cv) for cv in chunk_vecs]         # Ch.5 — neighbour test vs every chunk\n    ranked = sorted(range(len(chunks)), key=lambda i: scores[i], reverse=True)\n    context = "\\n\\n".join(chunks[i] for i in ranked[:k])  # Ch.3 & 6 — top-k: the dial\n\n    resp = client.chat.completions.create(                # Ch.1 — the envelope\n        model="meta/llama-3.1-8b-instruct",\n        temperature=0,                                    # Ch.2 — set to \'compliance\'\n        messages=[\n            {"role": "system", "content":                 # Ch.2 — the briefing page\n             "Answer ONLY from the provided context. "\n             "If the answer is not in the context, reply exactly: "\n             "\'Not found in the provided documents.\' Never invent details."},\n            {"role": "user", "content": f"Context:\\n{context}\\n\\nQuestion: {question}"}\n        ]\n    )\n    return resp.choices[0].message.content'],
      ['p','The three ceremonial runs:'],

  id:'ch10', num:10, part:2, minutes:65, labs:['contextrot','cache'],
  title:'The Envelope Grew Up',
  concept:'The ceiling became enormous, so the question stopped being "will it fit" and became "does it help".',
  story:[
    ['p','Chapter 1 taught you the envelope has a ceiling, and Chapter 3 built an entire discipline — chunking — around that ceiling being small. Since then, ceilings have grown to hundreds of thousands and in some models millions of tokens. A reasonable person concludes: the problem is solved, put everything in, delete the retrieval code.'],
    ['p','That conclusion is wrong, and the two reasons it is wrong are the substance of this chapter.'],
    ['pred',{id:'ch10-window',rows:3,ph:'Yes or no, and what you would ask to check',
      ask:'A vendor tells you their two-million-token context window makes your retrieval layer unnecessary — just put the whole corpus in every request. Before reading the two reasons: is that true, and what would you ask to find out?',
      reveal:'No, for two independent reasons, and you should insist on both. The meter did not change: two million tokens costs two million tokens’ worth of money on every single query, forever. And capacity is not attention — a model’s ability to actually use what sits in the envelope degrades long before the envelope is full, particularly in the middle of it.',
      then:'The question that settles it in a meeting: <em>show me your accuracy on a fact placed at 50% depth in a full window, against the same fact retrieved into a short one.</em>'}],
    ['p','<strong>Reason one: the meter did not change.</strong> A million-token envelope costs a million tokens\' worth of money, per query, every query, forever. Chapter 3\'s economic argument was never about capacity. It survives the bigger ceiling completely intact.'],
    ['q','I007'],
    ['p','<strong>Reason two — the one that surprises people:</strong> a model\'s ability to use what is in the envelope degrades long before the envelope is full. Fill a large context and accuracy sags, most sharply for material sitting in the <em>middle</em>. Facts at the beginning and end are recovered reliably; facts at 40–60% depth get missed. The informal name is <strong>lost in the middle</strong>; the broader phenomenon is <strong>context rot</strong>.'],
    ['lab','contextrot'],
    ['q','I008'],
    ['key','Capacity is not attention. That a document fits in the envelope is no evidence whatsoever that the model will use it. You are going to measure this yourself tonight on your own corpus, and the number will be lower than you predict.'],
    ['q','I119'],
    ['p','This reframes the whole job. Prompt engineering is about the <em>wording</em> of instructions. <strong>Context engineering</strong> is about what gets into the envelope at all, in what order, and what gets thrown out — a scarcity discipline practised against an apparently unlimited resource. Everything you already own is a context-engineering tool: chunking decides granularity, retrieval decides selection, k decides volume.'],
    ['q','I069'],
    ['try',{id:'ch10-budget',mins:5,min:50,rows:5,
      task:'Budget an envelope. A feature of yours sends: a system prompt, tool schemas, retrieved chunks, conversation history, and the answer. Write a token budget for each line, total it, and then say which line you would cut first if the bill doubled — and what breaks when you do.',
      ph:'system … tools … chunks … history … answer … total … cut first: … which breaks …',
      after:'A strong answer treats the envelope as a budget with an owner rather than whatever accumulated. Retrieved chunks are usually the largest line and the most compressible — cut k, or add reranking so a smaller k carries better chunks. What breaks is recall on multi-part questions, so you re-measure against ground truth after cutting rather than assuming. History is the next candidate and breaks follow-up questions; tool schemas remove capability outright. The mark of someone who has done this is naming the metric the cut endangers, and the re-measurement.'}],
    ['p','Two more instruments belong to this chapter specifically.'],
    ['p','<strong>Prompt caching</strong> changes the economics of repetition. Providers can cache the processed form of a request prefix; if your next request begins with the identical prefix, that portion is billed at a steep discount and returns faster. The architectural consequence is precise and worth memorising: <em>put the stable material first — system prompt, tool schemas, reference documents — and the volatile material last.</em> Reorder your envelope and the same feature can cost meaningfully less with no change in behaviour. Note also the corollary: any change to your system prompt invalidates every cache downstream of it, so system prompts should be versioned deliberately, not tweaked casually.'],
    ['lab','cache'],
    ['q','I070','I071'],
    ['p','<strong>Compaction</strong> is what you do when a long-running conversation or agent trace outgrows its budget: summarise the old middle, keep the recent tail verbatim, and keep a stable head. This is the same trade you have made since Chapter 3 — compression buys room and loses detail — and the detail it loses is, reliably, the specific numbers and names somebody will ask about later.'],
    ['q','I072'],
    ['c','Where "memory" actually lives','Chapter 1 told you memory is engineering around the model. Now you can name the engineering: a store outside the model, a retrieval step that selects from it, and a context budget that decides how much of it earns a place in this envelope. Every “our assistant remembers you” feature is those three parts. Ask which store, which selection rule, and what it costs per query.'],
    ['q','I120','I121'],
  ],
  words:[
    ['Context engineering','Deciding what enters the envelope, in what order, and what is evicted — as opposed to how instructions are worded.'],
    ['Context rot','Degradation of a model\'s use of information as context grows, well before the ceiling.'],
    ['Lost in the middle','The specific pattern: material at the start and end is recovered far more reliably than material in the middle.'],
    ['Prompt caching','Provider-side reuse of a processed request prefix — cheaper and faster on a cache hit.'],
    ['Cache prefix','The stable leading portion of your envelope. Stable first, volatile last.'],
    ['Compaction','Summarising older context to free budget while keeping a verbatim recent tail.'],
    ['Context budget','The deliberate allocation of the envelope across system prompt, tools, retrieved chunks, history and answer.']
  ],
  handson:[
    {h:'Step 1 — Predict First', b:[
      ['p','You are about to hide one sentence inside a long context and ask the model to find it, at three depths. Before running anything, predict the recovery rate at each depth: start, middle, end. Write three percentages.'],
      ['x','Log all three in the Prediction Ledger. Almost everyone predicts 100/100/100.']
    ]},
    {h:'Step 2 — The Needle, at Three Depths', b:[
      ['code','NEEDLE = "The internal reference code for the Q3 audit exception is ZX-4417."\nQUESTION = "What is the internal reference code for the Q3 audit exception?"\n\n# filler: paste ~8-12k words of your own corpus text into `filler`\nwords = filler.split()\n\ndef haystack(depth_pct):\n    cut = int(len(words) * depth_pct)\n    return " ".join(words[:cut]) + " " + NEEDLE + " " + " ".join(words[cut:])\n\nfor depth in (0.05, 0.50, 0.95):\n    hits = 0\n    for trial in range(5):\n        r = client.chat.completions.create(\n            model="meta/llama-3.1-8b-instruct", temperature=0,\n            messages=[{"role":"system","content":"Answer only from the text provided."},\n                      {"role":"user","content":haystack(depth) + "\\n\\nQ: " + QUESTION}]\n        )\n        if "ZX-4417" in r.choices[0].message.content:\n            hits += 1\n    print(f"depth {int(depth*100):>2}% -> {hits}/5 recovered")'],
      ['x','Commonly 5/5 at 5%, 5/5 at 95%, and something lower — often 2/5 or 3/5 — at 50%. Your exact numbers are your finding. If you get 5/5 everywhere, lengthen the filler until you do not; the effect is a function of length, and finding <em>your</em> breaking length is the actual deliverable.'],
      ['c','What you just proved','Not that the model is bad — that “it fits” and “it works” are different claims, and only one of them is measurable by reading a spec sheet.']
    ]},
    {h:'Step 3 — Everything vs. Retrieval, Head to Head', b:[
      ['p','Take your Chapter 6 ground truth. Answer all ten questions two ways: (a) whole document stuffed into the envelope, (b) your Chapter 7 <code>rag_answer</code> at k=3. Record accuracy, tokens, and wall-clock for both.'],
      ['code','import time\nfor q in ground_truth_questions:\n    t0 = time.time(); a = stuff_answer(q); t1 = time.time()\n    t2 = time.time(); b = rag_answer(q, k=3); t3 = time.time()\n    print(f"{q[:40]:40s} | stuff {t1-t0:.1f}s | rag {t3-t2:.1f}s")'],
      ['x','Typically: comparable accuracy on easy questions, an accuracy edge for stuffing on questions needing several distant sections, and a 10–50× difference in tokens and a large gap in latency. Write the sentence your own numbers support. It will be more nuanced than either camp\'s slogan.']
    ]},
    {h:'Step 4 — Reorder for the Cache', b:[
      ['p','Build the same request twice — once with the stable material (system prompt, reference text) first and the question last; once with the question first. Send each 5 times and compare latency and any cache fields in the response.'],
      ['x','Stable-first shows lower latency from the second call onward where the provider supports caching. Even where you cannot observe a cache field, adopt the ordering: it costs nothing and it is the shape every caching implementation rewards.']
    ]},
    {h:'Step 5 — Compaction, and What It Costs', b:[
      ['p','Take a 20-turn conversation. Summarise turns 1–15 into 150 words, keep 16–20 verbatim, and re-ask three questions whose answers lived in the summarised region.'],
      ['x','Thematic questions survive compaction. Questions about specific figures, names, or dates usually do not. Write down which of your three broke — that is the compaction trade-off in your own handwriting.']
    ]}
  ],
  wrong:[
    ['Needle recovered 5/5 at every depth','Filler too short for this model','Double the filler and re-run. You are looking for the length at which it breaks, not for a pass.'],
    ['Context-length error on the stuffing test','Document exceeds the window','Good — that is Chapter 3\'s original constraint, alive and well. Note the model and its ceiling and use a shorter document.'],
    ['No visible cache benefit','Provider does not expose or support caching on this endpoint','Adopt the ordering anyway and add “do you support prompt caching, and what is the discount?” to your vendor list.']
  ],
  homework:[
    ['Your context budget','Draw the envelope of one real feature as a bar divided into: system prompt, tool schemas, retrieved chunks, conversation history, output. Put a token estimate on each. Then mark which section you would cut first under pressure, and what breaks when you do.'],
    ['The stable/volatile split','Take that same feature and write the ordering explicitly: what is identical on every call (cacheable) and what changes (not cacheable). If the stable part is not first, you have found free money.'],
    ['Explain it upward','4–5 sentences — why “the new model has a two-million-token context so we can skip retrieval” is half right, and which half.']
  ],
  check:[
    ['Someone proposes deleting the retrieval layer because the context window is now huge. Give two independent rebuttals.','(1) Cost: a huge envelope is billed per query, forever; retrieval is a cost-control mechanism, not only a capacity one. (2) Quality: measured accuracy degrades with context length — and worst in the middle — so more context is not monotonically better. Then offer the real answer: measure both on our ground truth, which is Step 3.'],
    ['What is the practical instruction that prompt caching gives an architect?','Stable material first, volatile last — system prompt and reference documents at the head of the envelope, the user\'s question at the tail. And treat system-prompt edits as cache-invalidating events, not casual tweaks.'],
    ['What does compaction reliably destroy?','Specific detail — figures, names, dates, identifiers. Themes survive summarisation; particulars do not. Design accordingly: keep identifiers in a structured store, not in prose history.'],
    ['Distinguish prompt engineering from context engineering in one sentence each.','Prompt engineering: how the instruction is worded. Context engineering: what material is admitted into the envelope, in what order, and what is evicted when the budget binds.']
  ],
  red:['Lost in the middle — accuracy sagging with context depth','Compaction silently dropping identifiers','Cache invalidated by a casual system-prompt edit']
},

{
  id:'ch11', num:11, part:2, minutes:60, labs:['reasoning'],
  title:'Paying for Thought',
  concept:'A second dial appeared: buy accuracy with money and latency at query time. Most production traffic should not buy any.',
  story:[
    ['p','For most of this book, a model answered immediately. A newer class of model does something else first: it generates a long private working-out — trying approaches, checking itself, discarding lines — and only then writes the answer you see. You pay for that working-out in tokens and in seconds.'],
    ['p','The formal name for what you are buying is <strong>test-time compute</strong>: rather than accuracy being fixed at training time, you can purchase more of it, per query, at the moment of asking. That is a genuinely new product lever, and it is the first one in this book that a product manager controls directly with a number.'],
    ['q','I073'],
    ['key','Reasoning is not a quality setting to be turned up. It is a purchase, made per query, in money and in latency — and for most production traffic it buys nothing at all.'],
    ['lab','reasoning'],
    ['pred',{id:'ch11-where',rows:3,ph:'Two tasks that gain, two that do not',
      ask:'Before the chapter tells you. From your own product, name two tasks that would genuinely get better with a reasoning budget, and two that would get slower and more expensive with no gain at all.',
      reveal:'It pays on multi-step logic, arithmetic with dependent stages, code, planning, and resolving genuine ambiguity. It wastes on lookup, extraction, classification, formatting, routing, and summarising a supplied passage — tasks where the answer is present and only needs to be found or reshaped, not worked out.',
      then:'The routing rule follows directly: reasoning is a per-query purchase, so decide per task type, not per product.'}],
    ['p','Where it pays, reliably: multi-step logic, arithmetic with several dependent stages, code, planning, resolving ambiguous or conflicting requirements, and any task where a wrong intermediate step poisons everything after it.'],
    ['p','Where it wastes, equally reliably: lookup, extraction, classification, formatting, routing, summarisation of a supplied passage. These are the overwhelming majority of production requests in most document-AI products. Spending reasoning tokens on “which department does this ticket belong to?” is paying a barrister to read a form.'],
    ['q','I074'],
    ['p','Three traps are worth naming before you meet them.'],
    ['l',['<strong>Reasoning does not manufacture evidence.</strong> Point a reasoning model at bad retrieval and it will reason beautifully, at length, toward the wrong page. Chapters 5, 6 and 12 remain the only fix for a retrieval problem. Thinking harder about the wrong document produces a better-argued wrong answer — which is worse, because it is more persuasive.','<strong>Latency is a product feature you are spending.</strong> A 45-second answer is unusable in a chat interface and completely fine in an overnight batch. The right question is never “is it more accurate” but “is it more accurate <em>within the latency this surface allows</em>.”','<strong>The visible reasoning is not an audit trail.</strong> The working-out you can read is generated text, and it does not reliably describe the computation that produced the answer. It is useful for debugging and worthless as evidence. Do not put it in a compliance document.']],
    ['q','I075'],
    ['c','The dial has more than two positions','Most providers expose an effort or thinking-budget control. Treat it as a routing decision made per request type — cheap for lookups, expensive for the 5% that earn it — which is exactly the cascade you will build in Chapter 15.'],
    ['q','I076'],
    ['try',{id:'ch11-route',mins:4,min:45,rows:4,
      task:'Write the routing rule. For one feature you own: which requests get a reasoning budget, which do not, and what measurement would tell you the rule is wrong?',
      ph:'Reasoning when … no reasoning when … I would know the rule is wrong if …',
      after:'A strong rule routes on a property of the request that you can detect before answering — question type, number of entities, whether arithmetic is involved, whether retrieval returned conflicting chunks — not on a guess about difficulty. And it names the measurement that falsifies it: accuracy on the no-reasoning bucket falling below the reasoning bucket on the same questions, or latency on the reasoning bucket exceeding what the surface can absorb. A rule with no falsifying measurement is a preference.'}],
    ['q','I077'],
  ],
  words:[
    ['Reasoning model','A model that generates an internal working-out before its answer.'],
    ['Thinking / reasoning tokens','Tokens spent on the working-out. Billed, usually at output rates, and usually invisible in the answer.'],
    ['Test-time compute','Buying accuracy per query at inference time rather than at training time.'],
    ['Thinking budget / effort','The control that sets how much working-out is permitted. A product decision.'],
    ['Latency budget','The maximum acceptable response time for a given surface — chat, batch, background.'],
    ['Overthinking','Degradation or waste on simple tasks given excessive reasoning budget.']
  ],
  handson:[
    {h:'Step 1 — Two Tasks, Two Settings, Four Cells', b:[
      ['p','New notebook <code>chapter-11</code>. Pick a reasoning-capable model from build.nvidia.com. Build two tasks from your own domain: one pure lookup, one genuinely multi-step (an eligibility calculation with conditions, a reconciliation across three figures).'],
      ['code','import time\n\ndef timed(model, prompt, **kw):\n    t0 = time.time()\n    r = client.chat.completions.create(\n        model=model, temperature=0,\n        messages=[{"role":"user","content":prompt}], **kw)\n    dt = time.time() - t0\n    u = r.usage\n    return {"answer": r.choices[0].message.content,\n            "in": u.prompt_tokens, "out": u.completion_tokens,\n            "secs": round(dt,1)}\n\nfor name, prompt in [("lookup", LOOKUP_TASK), ("multistep", MULTISTEP_TASK)]:\n    fast = timed(FAST_MODEL, prompt)\n    slow = timed(REASONING_MODEL, prompt)\n    print(f"{name:10s} fast: {fast[\'out\']:>5} out / {fast[\'secs\']:>5}s"\n          f"  reasoning: {slow[\'out\']:>5} out / {slow[\'secs\']:>5}s")'],
      ['x','On the lookup: near-identical answers, with the reasoning model spending several times the output tokens and seconds. On the multi-step: often a correctness difference, sometimes decisive. That asymmetry is the whole chapter, in one printout.'],
      ['c','Predict first','Before running: how many times more output tokens will the reasoning model spend on the <em>lookup</em>? Write the multiple down. Most people say 2×. Log it.']
    ]},
    {h:'Step 2 — Build the 2×2 On Your Own Traffic', b:[
      ['p','Take ten real requests your feature would receive. Classify each as reasoning-worthy or not, <em>before</em> testing. Then run both models on all ten and grade.'],
      ['tb',['','Fast model correct','Fast model wrong'],[
        ['Reasoning correct','Waste — you paid for nothing','<strong>The only cell that justifies the spend</strong>'],
        ['Reasoning wrong','Reasoning hurt — investigate','Neither works — it is a retrieval or data problem, not a thinking problem']
      ]],
      ['x','Count how many of your ten land in the top-right cell. In most document-AI workloads it is one or two. That fraction is the number you take to a pricing conversation.']
    ]},
    {h:'Step 3 — Reasoning Cannot Save Bad Retrieval', b:[
      ['p','Take your Chapter 7 pipeline. Force k=1 and pick a question you know retrieves the <em>wrong</em> chunk. Answer it with the fast model, then the reasoning model.'],
      ['x','Both are wrong. The reasoning model is wrong at greater length, with more apparent justification, and is therefore more likely to be believed by a reviewer. Write one sentence about what that means for review processes.']
    ]},
    {h:'Step 4 — Find the Latency Cliff', b:[
      ['p','Run your multi-step task 10 times at the reasoning setting and record every response time. Sort them. Read off the median and the slowest.'],
      ['x','The gap between median and slowest is usually large — often 2–3×. <strong>Users experience the slow tail, not the median.</strong> Note both numbers; you will need the slow one for Chapter 15 and for any SLA conversation.']
    ]},
    {h:'Step 5 — Overthink a Trivial Task', b:[
      ['p','Give the reasoning model something trivial: <em>“Classify this sentence as complaint, query, or compliment.”</em> Run it five times at maximum effort.'],
      ['x','Long working-out, occasionally a worse answer than the fast model — second-guessing an obvious classification into an exotic one. Overthinking is real, measurable, and you just measured it.']
    ]}
  ],
  wrong:[
    ['No reasoning-capable model available','Endpoint catalogue varies','Use any two models of clearly different size and cost. The lesson — a task-dependent price/accuracy curve — transfers exactly.'],
    ['Reasoning tokens not itemised in <code>usage</code>','Provider-dependent reporting','Use total completion tokens as the proxy and note the gap. “Are thinking tokens itemised on the bill?” is a real vendor question.'],
    ['Timeouts on the reasoning model','Long generations','Raise the client timeout. Then note that you had to — that is your latency finding arriving early.']
  ],
  homework:[
    ['The traffic split','Estimate the percentage of your feature\'s real requests that fall in the top-right cell of the 2×2. Then compute the blended cost of routing only those to the expensive path versus sending everything there. The difference is usually large enough to change a business case.'],
    ['The latency contract','For each surface your feature has (chat, email, batch, background job) write the maximum acceptable response time. Then mark which surfaces can afford reasoning at all. Some cannot at any price, and that is an architectural fact, not a preference.'],
    ['Explain it upward','4–5 sentences — what “we upgraded to the reasoning model” actually costs, and the one question that determines whether it was worth it.']
  ],
  check:[
    ['Someone reports “accuracy went up after we moved to the reasoning model.” What three questions determine whether to keep it?','On which slice of traffic did it improve — the whole set or a few hard cases? What happened to p95 latency and to cost per query? And could a retrieval fix have produced the same gain more cheaply (Step 3)?'],
    ['Why can a reasoning model be more dangerous than a fast one when retrieval is broken?','Because it produces a longer, better-argued, more confident wrong answer. Persuasiveness scales with reasoning effort; correctness does not, when the evidence supplied is wrong.'],
    ['Can you use the visible reasoning trace as an audit trail?','No. It is generated text and does not reliably describe the computation that produced the answer. Useful for debugging, inadmissible as evidence — and Chapter 17 will need real evidence.'],
    ['Which number matters more for a chat surface: median or p95 latency?','p95. Users experience the tail, and one 40-second response teaches them the product is slow more effectively than twenty fast ones teach them it is quick.']
  ],
  red:['Reasoning applied to a retrieval failure — a better-argued wrong answer','Latency tail making a correct feature unusable','Overthinking a trivial classification']
},

{
  id:'ch12', num:12, part:2, minutes:75, labs:['fusion'],
  title:'Retrieval, Grown Up',
  concept:'The LATER page, unlocked. Hybrid search, reranking and contextual retrieval — each aimed at a failure you personally measured.',
  story:[
    ['p','Since Chapter 3 you have been writing names on a page titled LATER and abandoning them. Tonight you collect. Every technique in this chapter is a cure for a specific injury you observed with your own hands — which is why they will be memorable rather than decorative.'],
    ['p','<strong>Hybrid search</strong> cures the injury from Chapter 5\'s homework: your exact-string question, which keyword search nailed and semantic search fumbled. You have two scoreboards, each blind where the other sees. Merging them is the entire idea. The standard merge is <em>reciprocal rank fusion</em>, and its plain-language form is: a document\'s score is the sum, across both lists, of one-over-its-rank. Rank 1 contributes a lot; rank 40 contributes almost nothing; appearing respectably on both lists beats winning one. There is no learning in it and no magic — a single line of arithmetic that is very hard to beat.'],
    ['lab','fusion'],
    ['q','I033'],
    ['p','<strong>Reranking</strong> cures the precision half of Chapter 6\'s trade-off, and it is the closest thing to a free lunch in this book. Your embedding model gave every chunk an address computed <em>without ever seeing your question</em> — that is precisely what makes it fast, because the addresses were computed once, in advance. A reranker is a slower, more accurate model that reads the question and a candidate chunk <em>together</em> and scores that pair. Too slow for thousands of chunks; perfectly affordable for the top 50 that retrieval already shortlisted.'],
    ['key','Retrieve wide, rerank narrow. Fetch 50 by address, re-score those 50 by reading, keep 5. You raise recall with the wide fetch and restore precision with the rerank — the first time in this book the Chapter 6 trade-off bends instead of merely sliding.'],
    ['pred',{id:'ch12-rerank',short:true,ph:'A number of points, or a range',
      ask:'Commit before the chapter claims anything. You add a reranker to a working retrieval system — fetch 50 by address, re-score by reading, keep 5. How much does precision move?',
      reveal:'Usually a large, immediate jump — it is the closest thing to a free lunch in this book, because the reranker reads the question and the chunk together rather than comparing two addresses computed independently. Recall rises too, because you fetched 50 instead of 5 before narrowing.',
      then:'The cost is latency and a second model call on a shortlist — which is why it runs on 50 chunks and not on the corpus. That constraint is the entire design.'}],
    ['q','I034','I036'],
    ['p','<strong>Contextual retrieval</strong> cures the orphan chunk you counted in Chapter 3 — “the aforesaid amount…”, meaningless alone and therefore un-findable. The fix is disarmingly direct: before embedding each chunk, use a cheap model to write one sentence situating it in its document, and prepend that sentence. The orphan becomes “From Section 4.2 of the Travel Policy, on reimbursement limits for international travel: the aforesaid amount…” — and now it has an address in the right neighbourhood. It costs one cheap call per chunk, once, at indexing time. Nothing at query time.'],
    ['q','I035'],
    ['p','<strong>Query rewriting</strong> attacks the same gap from the other end. The user\'s question is often a fragment (“and for contractors?”) that means nothing without the conversation. Rewrite it into a standalone question before embedding it. For a conversational product this is not optional — it is the difference between a working follow-up and a baffling one.'],
    ['c','The unglamorous one that beats all of them','<strong>Metadata filtering.</strong> Before any scoring, discard chunks that cannot possibly be right: wrong document type, superseded version, wrong department, out of date range. Filtering a 10,000-chunk corpus to the 300 that are current and in-scope improves results more than any technique above, and it is ordinary database work. If your corpus contains superseded policy versions, no embedding model on earth will save you — it will faithfully retrieve last year\'s rule with a high score. Version-awareness is retrieval quality.'],
    ['q','I037','I123'],
    ['try',{id:'ch12-meta',mins:5,min:50,rows:4,
      task:'Before a single document is embedded: list the metadata you would require on every chunk in your corpus, and beside each one write the specific failure it prevents. Only include fields you can actually name a failure for.',
      ph:'field — the failure it prevents',
      after:'The strong list is short and each line is justified by a failure no retrieval-quality technique can fix. Document identity and version, because a better reranker cannot stop a repealed 2024 policy outranking the 2026 one. Effective and expiry dates, for the same reason in time. Access or audience, because filtering is the only thing standing between a user and a document they may not read — relevance scoring will happily return it. Source system and ingestion date, so you can retire a corpus you no longer trust. The point is that filtering happens <em>before</em> scoring, so these are the only failures you can make architecturally impossible rather than merely unlikely.'}],
    ['q','I039'],
    ['p','<strong>Agentic retrieval</strong> is Chapter 9 pointed at Chapter 5: make retrieval a tool, let the model issue several searches, read what returns, and search again with better terms. It genuinely fixes questions requiring evidence from multiple documents. It also multiplies cost and latency per question, and it can loop. Budget it like any other agent.'],
    ['q','I105'],
  ],
  words:[
    ['BM25','The standard statistical keyword-ranking method — Chapter 4\'s scoreboard, done properly, with rare words weighted more heavily.'],
    ['Reciprocal rank fusion (RRF)','Merging two ranked lists by summing 1/(rank) across them. Simple, robust, hard to beat.'],
    ['Reranker / cross-encoder','A model that scores a (question, chunk) pair by reading both together. Slow, accurate, applied only to shortlists.'],
    ['Retrieve wide, rerank narrow','Fetch many candidates cheaply, then re-score the shortlist expensively.'],
    ['Contextual retrieval','Prepending a generated situating sentence to each chunk before embedding, curing orphan chunks.'],
    ['Query rewriting','Turning a conversational fragment into a standalone searchable question.'],
    ['Metadata filter','Discarding out-of-scope chunks before scoring — version, date, department, document type.'],
    ['Agentic retrieval','Letting the model run multiple retrieval rounds as a tool, refining its own queries.']
  ],
  handson:[
    {h:'Step 1 — Formalise Chapter 4', b:[
      ['p','New notebook <code>chapter-12</code>. Bring in your chunks, <code>chunk_vecs</code>, and your Chapter 6 ground truth. First, write the keyword scoreboard you ran by hand in Chapter 4 — in code this time.'],
      ['code','import re, math\nfrom collections import Counter\n\ndef toks(s): return re.findall(r"[a-z0-9]+", s.lower())\n\nDF = Counter()\nfor c in chunks:\n    for t in set(toks(c)): DF[t] += 1\nN = len(chunks)\n\ndef keyword_scores(query):\n    q = set(toks(query))\n    out = []\n    for c in chunks:\n        tf = Counter(toks(c))\n        # rare words count for more — the one idea BM25 adds to your hand method\n        s = sum(tf[t] * math.log(1 + N / (1 + DF[t])) for t in q)\n        out.append(s)\n    return out'],

{
  id:'ch15', num:15, part:3, minutes:60, labs:['costmodel'],
  title:'The Meter',
  concept:'Chapter 1 gave you the receipt. Build the bill — including the four multipliers nobody puts in the business case.',
  story:[
    ['p','You have read a receipt since Chapter 1. Now you build the bill, because at some point somebody senior will ask what this costs at scale, and the answer “it depends on tokens” ends careers slowly.'],
    ['p','The base formula is arithmetic:'],
    ['code','cost_per_query = (input_tokens  × input_rate)\n               + (output_tokens × output_rate)\n\nmonthly = cost_per_query × queries_per_month'],
    ['p','That is the number in most business cases, and it is wrong by a factor that is routinely between three and twenty. The error is never in the formula. It is in what gets left out of <code>input_tokens</code> and out of <code>queries</code>.'],
    ['pred',{id:'ch15-mult',short:true,ph:'A multiple, like 5×',
      ask:'Commit a number. A business case quotes cost per query using only input tokens × rate plus output tokens × rate. By what factor is that figure typically wrong once the system is real?',
      reveal:'Routinely between three and twenty times too low. The base formula is not wrong arithmetic — it is arithmetic over the wrong quantities, because it prices a single clean call and real features do not make single clean calls.',
      then:'The four multipliers that close the gap are all chapters you have already done: retrieved volume, retries, agent steps, and reasoning tokens. Each is a decision someone made, which means each is a lever.'}],
    ['p','<strong>The four multipliers.</strong> Each is a chapter you have already done:'],
    ['tb',['Multiplier','Where it comes from','Typical effect'],[
      ['<strong>k</strong> — retrieved chunks','Ch. 6','k=8 instead of k=3 nearly triples input tokens on every query, forever'],
      ['<strong>Retries</strong>','Ch. 8','A 10% validation-retry rate re-sends the whole envelope — more than 10% added cost'],
      ['<strong>Agent steps</strong>','Ch. 9','A 6-step agent re-sends a growing conversation 6 times — often 10–20× a single call'],

    ['lab','costmodel'],
    ['q','I003'],
    ['p','A feature quoted at ₹0.40 per query using the base formula, with k=8, a 12% retry rate, a 4-step agent, and reasoning on by default, does not cost ₹0.50. It costs several rupees. That gap is the difference between a viable feature and one quietly killed in month four.'],
    ['q','I100'],
    ['p','<strong>The five levers</strong> that move the number, roughly in order of how much they move it:'],
    ['l',['<strong>Model choice.</strong> Rates across a provider\'s catalogue vary by one to two orders of magnitude. This dwarfs every other lever, which is why it deserves the measurement in Chapter 11 rather than a preference.','<strong>Routing and cascades.</strong> Send everything to a cheap model first; escalate only what fails a check. If 80% of traffic is a lookup (and Chapter 11 told you it is), you are paying premium rates for work a small model does correctly.','<strong>k and context size.</strong> Every token you do not send is free forever. Chapter 12\'s reranker lets you cut k while <em>raising</em> quality — the rare lever that improves both sides.','<strong>Caching.</strong> Chapter 10\'s stable-first ordering. Free money, requiring only that you order the envelope correctly.','<strong>Batching.</strong> Where latency permits, batch endpoints are often materially cheaper. Overnight enrichment does not need an interactive price.']],
    ['q','I099','I004'],
    ['try',{id:'ch15-model',mins:6,min:60,rows:5,
      task:'Build the loaded number for something real. Pick a feature. Estimate input and output tokens per query, apply the four multipliers with the values your design actually uses, multiply by your monthly volume — then write the one sentence you would say to a finance director, including what would make the number wrong.',
      ph:'base … × k … × retries … × steps … × reasoning … = per query … monthly … and it is wrong if …',
      after:'A strong answer is defensible rather than precise. It states the assumptions as assumptions, names which multiplier dominates (usually retrieved volume or agent steps), and says what would falsify it — a change in traffic mix, a higher retry rate than tested, a model price change. The sentence that earns trust is not “it costs ₹4 lakh a month”; it is “it costs ₹4 lakh a month at 300,000 queries with k=8 and a 12% retry rate, and the number moves most if retries exceed 20%.”'}],
    ['c','Latency is a cost too','p95, not median — Chapter 11. A feature that is cheap and slow can fail commercially exactly as thoroughly as one that is fast and expensive. Put both on the same page: cost per query, p50, p95. Three numbers, one line, every AI feature you ever propose.'],
    ['q','I101'],
    ['p','And the question that actually kills AI features, which has nothing to do with tokens: <strong>what is the gross margin at scale?</strong> If your feature costs ₹3 per query and the revenue it defends is ₹2, no amount of prompt optimisation saves it. That calculation belongs to the product manager, on day one, before the pilot — not to the engineer in month six.'],
    ['q','I005'],
    ['q','I102'],

  words:[
    ['Cost per query','The full loaded cost of one user-visible request, including retries and agent steps.'],
    ['Blended rate','Effective average cost across a mixed workload spanning multiple models.'],
    ['Cache hit rate','Fraction of input tokens served from a cached prefix.'],
    ['Model routing','Choosing a model per request based on the request\'s difficulty.'],
    ['Cascade','Cheap model first; escalate on a failed check. The main production cost pattern.'],
    ['p50 / p95 latency','Median and slow-tail response times. Users experience the tail.'],
    ['Unit economics','Cost and revenue per unit of use — the number that decides whether a feature survives.']

  handson:[
    {h:'Step 1 — Measure, Don\'t Estimate', b:[
      ['p','New notebook <code>chapter-15</code>. Run your Chapter 12 pipeline over the ten ground-truth questions and record real token counts.'],
      ['code','rows = []\nfor q in ground_truth_questions:\n    r = rag_answer_instrumented(q, k=3)   # returns .usage alongside the answer\n    rows.append({"q": q, "in": r.usage.prompt_tokens,\n                 "out": r.usage.completion_tokens})\n\navg_in  = sum(r["in"]  for r in rows) / len(rows)\navg_out = sum(r["out"] for r in rows) / len(rows)\nprint(f"avg in {avg_in:.0f} / avg out {avg_out:.0f} tokens per query")'],
      ['x','Real numbers from your real corpus. Everything after this is arithmetic on measured input rather than a guess dressed as a forecast.']
    ]},
    {h:'Step 2 — Build the Bill, With the Multipliers', b:[
      ['code','def monthly_cost(avg_in, avg_out, queries,\n                 in_rate, out_rate,           # per 1M tokens\n                 retry_rate=0.0, agent_steps=1,\n                 reasoning_ratio=0.0, cache_hit=0.0):\n    eff_in  = avg_in * agent_steps * (1 - cache_hit * 0.9)\n    eff_out = avg_out * agent_steps * (1 + reasoning_ratio)\n    per_q = (eff_in/1e6)*in_rate + (eff_out/1e6)*out_rate\n    per_q *= (1 + retry_rate)\n    return per_q, per_q * queries\n\nbase = monthly_cost(avg_in, avg_out, 10_000, 0.20, 0.60)\nreal = monthly_cost(avg_in, avg_out, 10_000, 0.20, 0.60,\n                    retry_rate=0.10, agent_steps=4,\n                    reasoning_ratio=2.0, cache_hit=0.0)\nprint(f"naive: {base[1]:.2f}   with multipliers: {real[1]:.2f}   ratio {real[1]/base[1]:.1f}x")'],
      ['x','A ratio commonly between 8× and 20×. Write it down. That single number is the most useful thing you can carry into a budget conversation, and it is why “we estimated the token cost” is not the same as “we estimated the cost.”'],
      ['c','Predict first','Before running Step 2: what multiple will the loaded cost be over the naive one? Log your guess.']
    ]},
    {h:'Step 3 — Build the Cascade', b:[
      ['p','Route cheaply first, escalate on a failed check. Use your Chapter 8 structured output — <code>found: false</code> or a missing quote — as the escalation trigger.'],
      ['code','def cascade(question, k=3):\n    small = rag_answer(question, k=k, model=CHEAP_MODEL)\n    if small["found"] and programmatic_checks(small, small["source_chunk_ids"]) == []:\n        return small, "cheap"\n    return rag_answer(question, k=k, model=STRONG_MODEL), "escalated"\n\nesc = sum(1 for q in ground_truth_questions if cascade(q)[1] == "escalated")\nprint(f"escalation rate: {esc}/{len(ground_truth_questions)}")'],
      ['x','An escalation rate — commonly 20–40%. Compute the blended cost and re-grade accuracy against your Chapter 6 key. You now have both halves of the trade: what the cascade saved, and what (if anything) it cost in quality.']
    ]},
    {h:'Step 4 — The Three Numbers', b:[
      ['p','For each configuration you have built — naive, k=8, cascade, reasoning-on — record exactly three numbers.'],
      ['tb',['Configuration','Cost / query','p50','p95','Accuracy (of 9)'],[['Baseline k=3','','','',''],['k=8','','','',''],['Cascade','','','',''],['Reasoning always on','','','','']]],
      ['x','This table is your Chapter 15 deliverable. It converts an architecture debate into a decision with a defensible basis, and it fits on one slide.']
    ]},
    {h:'Step 5 — The Margin Question', b:[
      ['p','One line of arithmetic, done honestly: what does this feature cost per user per month at your expected usage, and what is it worth per user per month?'],
      ['x','If the second number is not comfortably larger than the first, you have learned something before the pilot rather than after it. That is the entire purpose of this chapter.']

    ['What is a cascade and why does it usually work?','Route to a cheap model first and escalate only what fails a check. It works because the traffic distribution is lopsided — most production requests are lookups and extractions that a small model handles correctly (Ch.11\'s 2×2 measured this).'],

{
  id:'ch16', num:16, part:3, minutes:55, labs:[],
  title:'Beyond the Text Box',
  concept:'Your corpus is not text. It is pages — with tables, stamps, signatures and scans that clean-text chunking silently destroys.',
  story:[
    ['p','Chapter 3 asked you to paste your document\'s text into an editable file. That instruction concealed an assumption, and in most real organisations the assumption is false.'],
    ['p','Real corpora are pages. Scanned contracts with signatures and stamps. Financial statements whose meaning lives entirely in a table\'s row-column geometry. Manuals where the safety warning is a red box beside a diagram. Screenshots pasted into tickets. Forms with handwriting in the margins.'],
    ['key','Everything you built assumes extracted text. The extraction step you skipped is where most real document-AI projects actually fail — quietly, upstream of anything you measured.'],
    ['pred',{id:'ch16-clean',short:true,ph:'A percentage',
      ask:'Commit before the chapter tells you. For a real enterprise corpus — contracts, statements, policies, scanned correspondence — what fraction is clean, digital, correctly-ordered text that needs no extraction work at all?',
      reveal:'Usually far less than a proposal assumes. A large share is scanned, and a large share of what is digital still has structure that plain text extraction destroys — multi-column layouts, tables, headers repeating on every page. The number matters because every estimate downstream of it inherits its error.',
      then:'This is the audit nobody runs, and it is the cheapest way to stop a document-AI project failing six weeks in.'}],
    ['p','The classic failure is the table, and it is worth understanding precisely because it is invisible. A text extractor reading a three-column table often produces a single flat line of numbers. The values all survive. The <em>relationships</em> — this number is this row\'s figure for this year — do not. Retrieval then works perfectly, the model answers fluently from the retrieved chunk, and the number it quotes belongs to the wrong column. Nothing in your pipeline can detect this, because nothing downstream of extraction ever sees the page.'],
    ['q','I078','I079'],
    ['p','Two approaches, and the choice is a real one:'],
    ['tb',['','OCR → text → your pipeline','Page image → vision model'],[
      ['Cost','Cheap','Higher per page'],
      ['Layout, tables, figures','Frequently destroyed','Largely preserved'],
      ['Chunking','Your Chapter 3 discipline applies','A page becomes the natural chunk'],
      ['Exact strings','Preserved well','Occasional misreads — 0/O, 1/l, 5/S'],
      ['Auditability','Text is quotable and diffable','Needs a citation back to the page region']
    ]],
    ['q','I080'],
    ['p','A practical middle path is common and effective: extract text for retrieval, and hand the model the <em>page image</em> for the final answer when the question concerns a table, figure, or form. Cheap search, accurate reading.'],
    ['p','<strong>Voice changes a different variable entirely.</strong> Not accuracy — latency. In text, a two-second response is fine. In speech, a two-second silence is a conversational failure; people start talking over it. The realtime stack budgets for the whole round trip — speech in, model, speech out — and the product problems are conversational rather than linguistic: when has the user finished speaking, what happens when they interrupt, what does the system say while it is thinking. Chapter 11\'s reasoning models are, for most voice surfaces, simply unaffordable at any accuracy.'],
    ['q','I076'],
    ['c','The audit nobody runs','Before any document-AI proposal: what fraction of the corpus is clean digital text, what fraction is scanned, and what fraction of the <em>answers people actually need</em> live inside tables and figures? That third number is usually the highest and is almost never asked. It decides the architecture, and it is one afternoon with a sample of fifty documents.'],
    ['try',{id:'ch16-audit',mins:6,min:60,rows:4,
      task:'Run the audit on a corpus you actually have. What fraction is clean digital text, what fraction is scanned, and what fraction contains tables or layout that carries meaning? Estimate if you must, but say how you would measure it properly — and what you would do differently if the scanned fraction turned out to be half.',
      ph:'clean … scanned … layout-bearing … how I would measure … what changes if scanned is 50%',
      after:'Measuring it properly means sampling — fifty documents drawn at random from real traffic, not fifty chosen by whoever is enthusiastic. If the scanned fraction is high, the architecture changes rather than the effort estimate: OCR quality becomes a first-class metric with its own ground truth, the extraction step needs its own eval, and the timeline gains a phase that most proposals leave out entirely. Saying this before the project starts is worth more than any retrieval technique in this book.'}],
    ['q','I081'],
  ],
  words:[
    ['Vision-language model (VLM)','A model that reads images and text together.'],
    ['OCR','Optical character recognition — converting page images to text, discarding most layout.'],
    ['Page-as-chunk','Treating a rendered page as the retrieval unit rather than a text span.'],
    ['Layout preservation','Keeping the spatial relationships — rows, columns, callouts — that carry meaning.'],
    ['Modality gap','Information present on the page but absent from its extracted text.'],
    ['Turn detection','Deciding when a speaker has finished — the core problem of voice interfaces.'],
    ['Barge-in','A user interrupting mid-response, which the system must handle gracefully.']
  ],
  handson:[
    {h:'Step 1 — Find Your Own Silent Error', b:[
      ['p','New notebook <code>chapter-16</code>. Take one page from your corpus containing a real table — financial, eligibility bands, a rate card. Extract its text with whatever tool you have, and look at the extracted string.'],
      ['x','Read it as a machine would. Can you reconstruct which figure belongs to which row and column from the text alone? Frequently: no. Write down the specific relationship that was destroyed.']
    ]},
    {h:'Step 2 — Ask a Question Only the Table Answers', b:[
      ['p','Run that extracted text through your Chapter 7 pipeline with a question whose answer sits at a specific row-column intersection.'],
      ['x','A confident answer, frequently with a number from an adjacent column or row. This is the compound failure of Chapters 2 and 4 arriving through a route you had not instrumented — and note that every metric in your Chapter 6 evaluation would have scored this as a retrieval success.'],
      ['c','Predict first','Before running: will your pipeline get the table question right? Log your prediction. This is one of the few in this book where confidence is usually misplaced in the other direction — people expect failure and are surprised by how <em>fluent</em> the wrong answer is.']
    ]},
    {h:'Step 3 — Hand It the Page Instead', b:[
      ['p','Render the same page as an image and give it to a vision-capable model with the same question.'],
      ['code','import base64\nwith open("page.png","rb") as f:\n    b64 = base64.b64encode(f.read()).decode()\n\nr = client.chat.completions.create(\n    model=VISION_MODEL, temperature=0,\n    messages=[{"role":"user","content":[\n        {"type":"text","text":"Answer only from this page. "\n                              "Quote the row and column labels you used."},\n        {"type":"image_url",\n         "image_url":{"url":f"data:image/png;base64,{b64}"}}\n    ]}]\n)\nprint(r.choices[0].message.content)'],
      ['x','Usually correct, and — because you demanded the row and column labels — checkable in seconds. That demand is Chapter 8\'s supporting-quote idea, translated into two dimensions.']

      ['x','Expect a small number of errors — often in the least visually distinct cells: merged headers, footnote markers, empty-versus-zero. Count them. That error rate <em>is</em> your extraction quality number, and it belongs in every document-AI proposal you ever review.']
    ]},
    {h:'Step 5 — Audit the Corpus', b:[
      ['p','Sample 30 documents. Classify each: clean digital text, scanned image, or mixed. Then, separately and more importantly, sample 20 questions people actually ask and mark how many need a table or figure to answer.'],
      ['x','Two percentages. They decide whether your architecture is text-first, vision-first, or hybrid — and they take one afternoon to obtain instead of one quarter to discover.']

    ['Explain it upward','4–5 sentences — why a system can retrieve the right page and still quote the wrong number, and what that means for reviewing financial or tabular outputs.']

    ['A vendor says “we support all document formats.” What do you ask?','Show extraction on ten of <em>our</em> worst pages — scanned, multi-column, tabular — and give me the cell-level error rate. Format support is a file-opening claim; extraction fidelity is the one that matters.'],
