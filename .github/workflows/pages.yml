# Publishes the static site to GitHub Pages: https://<user>.github.io/<repo>/
#
# This is the no-backend host. The app runs from the curriculum built into the
# page and keeps progress in the browser (see "Running it without a backend" in
# the README). Sign-in and the Content Studio's Publish need the Vercel + Postgres
# deployment instead; Pages is the zero-setup live link.
#
# One-time: Settings > Pages > Source = "GitHub Actions" (the first run also tries
# to enable it).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: node build.js
      - name: Make URLs work under /<repo>/
        run: node tools/pages-prefix.mjs dist/site "/${{ github.event.repository.name }}"
      - name: Check the site
        run: |
          test -s dist/site/index.html
          test -s dist/site/plan/index.html
          test -s dist/site/plan/index.html
          test -s dist/site/book/index.html
          grep -q '"base":"/${{ github.event.repository.name }}/book/"' dist/site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
