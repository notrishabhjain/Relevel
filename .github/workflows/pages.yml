# Builds the tracker and publishes dist/site/ to GitHub Pages.
#
# Before the first run, enable Pages once:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# On a Free plan Pages requires the repository to be public. If you would
# rather keep it private, delete this file and use Cloudflare Pages instead
# (build command: `node build.js`, output directory: `dist/site`).
name: Deploy tracker to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: node build.js
      - name: Check the build produced a page
        run: |
          test -s dist/site/index.html
          test -s dist/site/sw.js
          grep -q "window.SKILLS" dist/site/index.html
          echo "built $(du -h dist/site/index.html | cut -f1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
