# Backup trigger for the daily reminder. The main trigger is Vercel's own
# scheduler (the "crons" in vercel.json), because GitHub runs scheduled
# workflows late, sometimes by hours. The site decides whether it is the right
# time and whether today's has already gone out, so these runs only send if
# Vercel's did not.
name: Daily reminder

on:
  schedule:
    - cron: '30 6 * * 1-5'   # 12:00 IST
    - cron: '50 6 * * 1-5'   # 12:20 IST, if the first was late or missed
    - cron: '20 7 * * 1-5'   # 12:50 IST
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to send today's reminder
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 30 "https://relevel-steel.vercel.app/api/nudge?run=1" && exit 0
            sleep 20
          done
          exit 1
